ttings.order)||v.settings.order.some(x=>!modules.includes(x))))throw Error('Invalid module order');return true}
function persist(){if(recovery)return;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));$('#saved').textContent='✓ Saved on this device'}catch(e){toast('Storage is unavailable or full. Export a backup now.')}},180)}
function commit(fn,message='Saved'){undoState=structuredClone(S);fn();persist();render();toast(message,true)}
function toast(t,undo=false){const e=$('#toast');e.textContent=t;if(undo){const b=document.createElement('button');b.textContent='Undo';b.onclick=()=>{if(undoState){S=undoState;undoState=null;persist();render();toast('Undone')}};e.append(' ',b)}e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',6000)}
function applyStyleBase(){let a=S.settings;document.body.classList.toggle('dark',!!a.dark);for(const k of ['accent','peach','lilac'])if(/^#[0-9a-f]{6}$/i.test(a[k]))document.documentElement.style.setProperty('--'+k,a[k]);document.documentElement.style.fontSize=Math.max(13,Math.min(20,+a.scale||15))+'px';document.documentElement.style.setProperty('--radius',Math.max(0,Math.min(30,+a.radius||0))+'px');$('#brand').textContent=a.title;document.title=a.title+' • Family Planner'}
function toggleTheme(){S.settings.dark=!S.settings.dark;persist();render()}
function label(x){return S.settings.labels[x]||x}function go(p){S.page=p;query='';filter='All';document.body.classList.remove('drawer');persist();render();window.scrollTo(0,0)}
function money(n){try{return new Intl.NumberFormat('en',{style:'currency',currency:S.settings.currency,maximumFractionDigits:0}).format(n)}catch{return n}}
const records=t=>S.records.filter(r=>!t||r.type===t),done=r=>r.status==='Done',sum=a=>a.reduce((n,r)=>n+(Number(r.amount)||0),0);
function rangeRecords(){const today=dateKey(),start=shift(today,-reportDays+1);return records('Budget').filter(r=>r.date>=start&&r.date<=today)}
function totals(a=rangeRecords()){return {income:sum(a.filter(r=>r.flow==='Income')),expense:sum(a.filter(r=>r.flow!=='Income'))}}
function renderBase(){applyStyle();$('#nav').innerHTML=S.settings.order.filter(x=>x!=='Settings'&&!S.settings.hidden.includes(x)).map(x=>`<button class="${S.page===x?'active':''}" data-go="${esc(x)}">${icons[modules.indexOf(x)]} &nbsp; ${esc(label(x))}</button>`).join('');$('#nav').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));let html='';if(S.page==='Dashboard')html=dashboard();else if(S.page==='Today')html=todayPage();else if(S.page==='Calendar')html=calendar();else if(S.page==='Settings')html=settings();else if(S.page==='Reports')html=reports();else html=listPage(S.page);$('#page').innerHTML=html;$('#page').style.setProperty('--density',S.settings.density+'px');$('#page').querySelectorAll('.card').forEach(c=>c.style.padding=S.settings.density+'px');bind();clock()}
function heading(title,sub=''){return `<div class="flex"><div><div class="eyebrow">YOUR PERSONAL PLANNING SPACE</div><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:''}</div><button class="primary right" onclick="edit(null,'${recordTypes.includes(S.page)?S.page:'Tasks'}')">＋ Add new</button></div>`}
function dashboardBase(){const today=dateKey(),tasks=records('Tasks').filter(r=>r.date===today),routines=records('Routines'),events=S.records.filter(r=>['Family Schedule','Appointments'].includes(r.type)&&r.date>=today).sort((a,b)=>a.date.localeCompare(b.date)),t=totals();return `${recovery?`<div class="banner">${esc(recovery)}</div>`:''}${S.sampleNotice&&S.records.some(r=>r.isSample)?'<div class="banner flex">You’re exploring a sample family. Make this space your own.<button class="right" onclick="S.sampleNotice=false;persist();render()">Dismiss</button></div>':''}<section class="hero"><div class="eyebrow">A FRESH LITTLE START</div><h1 id="greeting">Hello, lovely day.</h1><p>${esc(S.settings.subtitle)} Your plans, people and everyday moments — together in one calm space.</p><div class="flex"><button class="primary" onclick="go('Today')">Plan my day →</button><button onclick="go('Calendar')">View calendar</button></div></section><div class="grid">${S.settings.cards.includes('Tasks')?metric('Today’s tasks',`${tasks.filter(done).length} / ${tasks.length}`,'A little progress goes a long way.','Tasks'):''}${S.settings.cards.includes('Routines')?metric('Daily rituals',`${routines.filter(r=>(r.checks||[]).includes(today)).length} / ${routines.length}`,'Small habits, brighter days.','Routines'):''}${S.settings.cards.includes('Budget')?metric('Household balance',money(t.income-t.expense),'Income minus spending · last '+reportDays+' days','Budget'):''}${S.settings.cards.includes('Goals')?metric('Dreams in motion',records('Goals').filter(r=>r.status!=='Done').length,'Build something to look forward to.','Goals'):''}<section class="card span8"><div class="flex"><h2>Today’s little priorities</h2><button class="right" onclick="edit(null,'Tasks')">＋ Task</button></div>${rows(tasks.sort((a,b)=>(a.priority==='High'?-1:1)),true)}</section><section class="card span4" style="background:var(--peach)"><div class="eyebrow">AROUND THE TABLE</div><h2 style="margin-top:10px">What’s cooking?</h2>${rows(records('Meals').filter(r=>r.date===today).slice(0,2))}<button onclick="go('Meals')">Plan meals →</button></section><section class="card span12"><h2>Your seven-day rhythm</h2>${lineChart()}</section><section class="card span6"><h2>Money, in perspective</h2>${barChart()}<button onclick="go('Reports')">Explore reports →</button></section><section class="card span6"><h2>Where it goes</h2>${donutChart()}</section><section class="card span6"><h2>Coming up for your family</h2>${rows(events.slice(0,4))}<button onclick="go('Family Schedule')">Family schedule →</button></section><section class="card span6"><h2>Make space for yourself</h2>${rows(records('Self-Care').filter(r=>r.date>=today).slice(0,2))}<div class="help" style="padding:16px;border-radius:12px">Your wellbeing belongs on the calendar, too. ♡</div></section><section class="card span6"><h2>Dream a little, grow a little</h2>${goalCards()}</section><section class="card span6"><h2>Notes to come back to</h2>${rows(records('Notes').sort((a,b)=>!!b.pinned-!!a.pinned).slice(0,3))}</section></div>`}
function metric(title,value,sub,type){return `<section class="card span3"><div class="eyebrow">${title}</div><div class="metric">${value}</div><small>${sub}</small><div><button onclick="go('${type}')" style="margin-top:12px">Open ${type.toLowerCase()} →</button></div></section>`}
function rows(a,checks=false){if(!a.length)return '<div class="empty">A little room for something new.<br>Add your first plan whenever you’re ready.</div>';return a.map(r=>`<div class="row ${done(r)?'completed':''}">${checks?`<input class="check" type="checkbox" aria-label="Complete ${esc(r.title)}" ${done(r)?'checked':''} onchange="complete('${r.id}')">`:'<span class="dot"></span>'}<div class="body"><strong class="${done(r)?'done':''}">${esc(r.title)}</strong><br><small>${esc([r.date,r.time,r.assignee,r.category].filter(Boolean).join(' · '))}</small>${r.type==='Budget'?`<div>${r.flow==='Income'?'+':'−'} ${money(r.amount)}</div>`:''}${r.type==='Notes'?`<div class="muted">${esc((r.notes||'').slice(0,120))}</div>`:''}</div><button onclick="edit('${r.id}')" aria-label="Edit ${esc(r.title)}">↗</button></div>`).join('')}
function todayPage(){const t=dateKey();return heading('A day with a little more ease',t)+`<div class="grid"><section class="card span8"><h2>Today’s to-do list</h2>${rows(S.records.filter(r=>r.date===t&&['Tasks','Chores','Home Care','Grocery List'].includes(r.type)),true)}</section><section class="card span4"><h2>Your daily rituals</h2>${habitCards()}</section><section class="card span6"><h2>Your appointments & plans</h2>${rows(S.records.filter(r=>r.date===t&&['Family Schedule','Appointments','Self-Care'].includes(r.type)))}</section><section class="card span6"><h2>On the menu</h2>${rows(records('Meals').filter(r=>r.date===t))}</section></div>`}
function listPageBase(type){let a=records(type).filter(r=>(!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase()))&&(filter==='All'||r.status===filter));a.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='priority'?(['High','Medium','Low'].indexOf(a.priority)-['High','Medium','Low'].indexOf(b.priority)):(a.date||'9999').localeCompare(b.date||'9999'));return heading(label(type))+`<div class="toolbar flex"><input aria-label="Search ${type}" placeholder="Search this section…" value="${esc(query)}" onchange="query=this.value;render()"><select aria-label="Filter status" onchange="filter=this.value;render()">${['All','Pending','In progress','Done'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Sort" onchange="sort=this.value;render()">${['date','title','priority'].map(x=>`<option ${sort===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="csv('${type}')">Export CSV</button>${['Tasks','Chores','Grocery List'].includes(type)?`<button onclick="bulk('${type}')">Complete visible</button>`:''}</div>${type==='Routines'?`<div class="grid">${habitCards(a,true)}</div>`:type==='Goals'?`<div class="grid">${goalCards(a,true)}</div>`:`<section class="card">${rows(a,['Tasks','Chores','Home Care','Grocery List'].includes(type))}</section>`}`}
function streak(r){const c=new Set(r.checks||[]);let d=dateKey(),n=0;if(!c.has(d))d=shift(d,-1);while(c.has(d)&&n<40000){n++;d=shift(d,-1)}return n}
function habitCards(a=records('Routines'),grid=false){return a.length?a.map(r=>{const checks=r.checks||[],t=dateKey();return `<section class="${grid?'card span4':''}" style="margin-bottom:15px"><div class="flex"><strong>${esc(r.title)}</strong><button class="right" onclick="edit('${r.id}')">Edit</button></div><small>${r.frequency==='Weekly'?'Weekly target':'Daily target'}: ${r.target||1} · ${streak(r)} day streak</small><div class="flex" style="margin:12px 0">${Array.from({length:7},(_,i)=>{let d=shift(t,i-6);return `<button title="${d}" aria-label="Check in for ${d}" style="padding:7px;min-width:32px;${checks.includes(d)?'background:var(--soft)':''}" onclick="checkHabit('${r.id}','${d}')">${checks.includes(d)?'✓':d.slice(-2)}</button>`}).join('')}</div><small>${checks.filter(d=>d>=shift(t,-29)&&d<=t).length} check-ins in 30 days · ${r.frequency==='Weekly'?'History tracks days checked in.':'Check in once when your daily target is met.'}</small></section>`}).join(''):'<div class="empty">Add a ritual you want to make room for.</div>'}
function goalCards(a=records('Goals'),grid=false){return a.length?a.map(r=>{const p=Math.min(100,Math.max(0,100*(r.progress||0)/(r.target||1)));return `<section class="${grid?'card span4':''}" style="margin-bottom:18px"><div class="flex"><strong>${esc(r.title)}</strong><button class="right" onclick="edit('${r.id}')">Edit</button></div><small>${r.progress||0} of ${r.target||100} · ${p.toFixed(0)}%</small><progress max="100" value="${p}" aria-label="Goal progress">${p}%</progress><small>Due ${esc(r.date||'whenever you’re ready')}</small></section>`}).join(''):'<div class="empty">Your next dream starts here.</div>'}
function complete(id){commit(()=>{let r=S.records.find(x=>x.id===id);r.status=done(r)?'Pending':'Done';r.completedDate=done(r)?dateKey():'';if(done(r)&&r.recurring&&r.recurring!=='None'){const next=structuredClone(r);next.id=uid();next.isSample=false;next.status='Pending';next.completedDate='';next.date=shift(r.date||dateKey(),r.recurring==='Daily'?1:r.recurring==='Weekly'?7:30);S.records.push(next)}},'Status updated')}
function checkHabit(id,d){commit(()=>{let r=S.records.find(x=>x.id===id);r.checks??=[];r.checks=r.checks.includes(d)?r.checks.filter(x=>x!==d):[...r.checks,d]},'Ritual updated')}
function bulk(type){commit(()=>{for(const r of records(type))if((filter==='All'||r.status===filter)&&(!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase()))){r.status='Done';r.completedDate=dateKey()}},'Visible records completed')}
// Modal editing uses escaped attributes and plain-text storage.
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();setTimeout(()=>$('#modalBody').querySelector('input,select,button')?.focus(),0)}function closeModal(){$('#modal').close()}
function field(name,title,value='',type='text',extra=''){return `<label>${title}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(name,title,options,value){return `<label>${title}<select name="${name}">${options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function edit(id=null,type='Tasks',presetDate=null){let r=id?S.records.find(x=>x.id===id):{type,title:'',date:presetDate||dateKey(),priority:'Medium',status:'Pending',category:'Family',assignee:S.settings.members.split(',')[0].trim(),target:1};if(!r)return;openModal(id?'A little update':'Make a little plan',`<form id="recordForm"><div class="fields">${select('type','Section',recordTypes,r.type)}${field('title','Title *',r.title,'text','required maxlength="300"')}${field('date','Date',r.date,'date')}${field('time','Time',r.time,'time')}${select('status','Status',['Pending','In progress','Done'],r.status)}${select('priority','Priority',['High','Medium','Low'],r.priority)}${field('category','Category',r.category,'text','list="categories"')}${field('assignee','Family member',r.assignee,'text','list="members"')}<datalist id="members">${S.settings.members.split(',').map(x=>`<option value="${esc(x.trim())}">`).join('')}</datalist><datalist id="categories">${S.settings.categories.split(',').map(x=>`<option value="${esc(x.trim())}">`).join('')}</datalist>${field('tags','Tags (comma separated)',r.tags)}${select('recurring','Repeat after completion',['None','Daily','Weekly','Every 30 days'],r.recurring||'None')}<label class="full">Notes / contact details<textarea name="notes" maxlength="20000">${esc(r.notes)}</textarea></label><label class="full">Subtasks / milestones / checklist (one per line)<textarea name="subtasks" maxlength="10000">${esc(r.subtasks)}</textarea></label>${field('amount','Amount (budget / grocery)',r.amount||0,'number','step="0.01" min="0" max="1000000000000"')}${select('flow','Budget direction',['Expense','Income'],r.flow||'Expense')}${field('target','Goal / routine target',r.target||1,'number','min="1" max="1000000000000" step="any"')}${field('progress','Goal progress',r.progress||0,'number','min="0" max="1000000000000" step="any"')}${select('frequency','Routine frequency',['Daily','Weekly'],r.frequency||'Daily')}${field('color','Note color',r.color||'#e8e1f4','color')}<label style="flex-direction:row;align-items:center"><input name="pinned" type="checkbox" ${r.pinned?'checked':''}> Pin note</label></div><div class="toolbar flex"><button class="primary" type="submit">Save plan</button>${id?`<button type="button" onclick="duplicate('${id}')">Duplicate</button><button type="button" onclick="removeRecord('${id}')">Delete</button>`:''}<button type="button" onclick="closeModal()">Cancel</button></div></form>`);$('#recordForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(!f.title.trim()){toast('Please enter a title.');return}for(let k of ['amount','target','progress'])f[k]=Number(f[k]);f.pinned=e.target.elements.pinned.checked;commit(()=>{if(id)Object.assign(r,f,{isSample:false});else S.records.push({...f,id:uid(),checks:[],isSample:false});if(f.status==='Done'){const saved=id?r:S.records[S.records.length-1];saved.completedDate=dateKey()}},'Plan saved');closeModal()}}
function duplicate(id){commit(()=>{const r=structuredClone(S.records.find(x=>x.id===id));r.id=uid();r.title+=' (copy)';r.isSample=false;S.records.push(r)},'Copied');closeModal()}function removeRecord(id){if(confirm('Delete this plan? You can undo immediately afterward.')){commit(()=>S.records=S.records.filter(r=>r.id!==id),'Plan deleted');closeModal()}}
function searchAll(v){if(!v.trim())return;const a=S.records.filter(r=>[r.title,r.notes,r.tags,r.assignee].join(' ').toLowerCase().includes(v.toLowerCase())).slice(0,40);openModal('Find a little something',a.length?a.map(r=>`<div class="row"><div class="body"><span class="badge">${esc(r.type)}</span><br>${esc(r.title)}</div><button onclick="edit('${r.id}')">Open</button></div>`).join(''):'<p>No matching plans yet.</p>');$('#globalSearch').value=''}
// Calendar: month, week and agenda, with task due dates.
function calendar(){const d=new Date(calDate+'T12:00:00'),today=dateKey(),include=['Tasks','Family Schedule','Appointments','Meals','Self-Care','Chores','Home Care','Goals'];let a=S.records.filter(r=>include.includes(r.type)&&r.date&&(!query||(r.category||'').toLowerCase().includes(query.toLowerCase())));let body='';if(calView==='Agenda')body=rows(a.filter(r=>r.date.slice(0,7)===calDate.slice(0,7)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))));else {let start=new Date(d);if(calView==='Month')start.setDate(1);let offset=(start.getDay()-S.settings.firstDay+7)%7;start.setDate(start.getDate()-offset);let n=calView==='Week'?7:42;body=`<div class="calendar">${Array.from({length:7},(_,i)=>`<div class="weekhead">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][(i+S.settings.firstDay)%7]}</div>`).join('')}${Array.from({length:n},(_,i)=>{let dt=new Date(start);dt.setDate(dt.getDate()+i);let key=localDay(dt);return `<div class="day ${key===today?'today':''}"><div class="flex daynum">${dt.getDate()}<button class="right" aria-label="Add plan on ${key}" onclick="edit(null,'Family Schedule','${key}')">＋</button></div>${a.filter(r=>r.date===key).map(r=>`<button onclick="edit('${r.id}')">${esc((r.time||'')+' '+r.title)}</button>`).join('')}</div>`}).join('')}</div>`}return heading('All your days, together')+`<div class="toolbar flex"><button onclick="moveCal(-1)">← Previous</button><h2 style="margin:0">${d.toLocaleDateString('en',{month:'long',year:'numeric',...(calView==='Week'?{day:'numeric'}:{})})}</h2><button onclick="moveCal(1)">Next →</button><button onclick="calDate=dateKey();persistView();render()">Today</button><select aria-label="Calendar view" onchange="calView=this.value;persistView();render()">${['Month','Week','Agenda'].map(x=>`<option ${calView===x?'selected':''}>${x}</option>`).join('')}</select><input aria-label="Filter calendar by category" placeholder="Filter category…" value="${esc(query)}" onchange="query=this.value;render()"></div><section class="card">${body}</section>`}
function moveCal(n){let d=new Date(calDate+'T12:00:00');if(calView==='Week')d.setDate(d.getDate()+7*n);else{d.setDate(1);d.setMonth(d.getMonth()+n)}calDate=localDay(d);persistView();render()}
// Inline SVG charts use the same records as reports.
function chartData(){let end=dateKey(),out=[];for(let i=5;i>=0;i--){let start=shift(end,-(i+1)*5+1),stop=shift(end,-i*5),a=records('Budget').filter(r=>r.date>=start&&r.date<=stop);out.push({label:start.slice(5),...totals(a)})}return out}
function barChart(){let a=chartData(),max=Math.max(1,...a.flatMap(x=>[x.income,x.expense]));return `<svg viewBox="0 0 480 180" role="img" aria-label="Income and expenses over six five-day periods">${a.map((v,i)=>`<rect x="${30+i*76}" y="${140-v.income/max*110}" width="19" height="${v.income/max*110}" rx="4" fill="var(--accent)"><title>${v.label} income: ${money(v.income)}</title></rect><rect x="${52+i*76}" y="${140-v.expense/max*110}" width="19" height="${v.expense/max*110}" rx="4" fill="#d6a781"><title>Expenses: ${money(v.expense)}</title></rect><text x="${30+i*76}" y="164" font-size="12" fill="var(--muted)">${v.label}</text>`).join('')}</svg><div class="legend"><span>● Income</span><span style="color:#a9764e">● Expenses</span><span>5-day periods · latest 30 days</span></div>`}
function donutChart(){let a=rangeRecords().filter(r=>r.flow!=='Income'),cat=Object.create(null);for(const r of a)cat[r.category||'Other']=(cat[r.category||'Other']||0)+r.amount;let entries=Object.entries(cat),total=sum(a),colors=['#377c69','#d6a781','#9a88b7','#91b5a1','#b4a378'];let offset=0;return `<div class="flex"><svg viewBox="0 0 180 180" width="180" role="img" aria-label="Expenses by category"><circle cx="90" cy="90" r="62" fill="none" stroke="var(--line)" stroke-width="22"/>${entries.map(([k,v],i)=>{let len=total?v/total*389.56:0,s=`<circle cx="90" cy="90" r="62" fill="none" stroke="${colors[i%5]}" stroke-width="22" stroke-dasharray="${len} ${389.56-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)"><title>${esc(k)}: ${money(v)}</title></circle>`;offset+=len;return s}).join('')}<text x="90" y="87" text-anchor="middle" font-size="19" fill="var(--ink)">${esc(money(total))}</text><text x="90" y="108" text-anchor="middle" font-size="11" fill="var(--muted)">total spent</text></svg><div>${entries.length?entries.map(([k,v],i)=>`<div style="margin:7px 0"><span style="color:${colors[i%5]}">●</span> ${esc(k)} <strong>${money(v)}</strong></div>`).join(''):'<p>No expenses in this range.</p>'}</div></div>`}
function lineChart(){const points=Array.from({length:7},(_,i)=>{let d=shift(dateKey(),i-6);return {d,n:records('Tasks').filter(r=>done(r)&&r.completedDate===d).length}}),max=Math.max(1,...points.map(x=>x.n));return `<svg viewBox="0 0 480 150" role="img" aria-label="Completed tasks over seven days"><polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${points.map((x,i)=>`${20+i*72},${110-x.n/max*80}`).join(' ')}"/>${points.map((x,i)=>`<circle cx="${20+i*72}" cy="${110-x.n/max*80}" r="5" fill="var(--accent)"/><text x="${20+i*72}" y="135" text-anchor="middle" font-size="11" fill="var(--muted)">${x.d.slice(5)}</text><text x="${20+i*72}" y="${99-x.n/max*80}" text-anchor="middle" font-size="12" fill="var(--ink)">${x.n}</text>`).join('')}</svg>`}
function reportsBase(){let t=totals();return heading('A clearer picture of your days')+`<div class="toolbar flex"><label>Financial date range<select onchange="reportDays=+this.value;render()">${[7,30,90,365].map(n=>`<option value="${n}" ${n===reportDays?'selected':''}>Last ${n} days</option>`).join('')}</select></label><button onclick="csv('Budget')">Export budget CSV</button></div><div class="grid">${metric('Money in',money(t.income),'Total income in selected range','Budget')}${metric('Money out',money(t.expense),'Total expenses in selected range','Budget')}${metric('Available',money(t.income-t.expense),'Income minus expenses','Budget')}${metric('Tasks completed',records('Tasks').filter(done).length,'All-time completed tasks','Tasks')}<section class="card span6"><h2>Income & expenses · 30 days</h2>${barChart()}<details><summary>View chart values</summary>${chartData().map(x=>`<p>${x.label}: income ${money(x.income)}, expenses ${money(x.expense)}</p>`).join('')}</details></section><section class="card span6"><h2>Spending · selected range</h2>${donutChart()}</section><section class="card span12"><h2>Your seven-day task rhythm</h2>${lineChart()}<p>Each point counts tasks with a completion date on that day.</p></section></div>`}

</p>${a.order.filter(x=>!['Dashboard','Today','Calendar','Reports','Settings','Focus Timer','Weekly Review','Planning Packs'].includes(x)).map(x=>`<div class="row"><label style="flex-direction:row"><input type="checkbox" ${a.hidden.includes(x)?'':'checked'} onchange="moduleToggle('${x}',this.checked)" aria-label="Show ${x}"></label><input style="width:100%;min-width:0" aria-label="Rename ${x}" value="${esc(label(x))}" onchange="S.settings.labels['${x}']=this.value.trim()||'${x}';persist();render()"><button onclick="moveModule('${x}',-1)" aria-label="Move ${x} up">↑</button><button onclick="moveModule('${x}',1)" aria-label="Move ${x} down">↓</button></div>`).join('')}</section><section class="card"><h2>Data & backup</h2><p>Private by design: data stays in this browser. There is no automatic device sync. Export regular backups, especially before moving this HTML file or clearing browser data.</p><div class="flex"><button onclick="download('bloomstead-backup-'+dateKey()+'.json',JSON.stringify(S,null,2),'application/json')">Export full backup</button><label>Import JSON<input type="file" accept=".json,application/json" onchange="importBackup(this.files[0])"></label><button onclick="clearSamples()">Clear sample data</button><button onclick="resetSettings()">Restore default settings</button><button onclick="resetPlanner()">Reset planner</button></div></section><section class="card help"><h2>A little help getting started</h2><p>1. Clear sample data when you’re ready.<br>2. Add family members and choose your time zone above.<br>3. Use Quick add to create plans in any section.<br>4. Export a backup regularly. Use Print → Save as PDF for paper plans.</p><p>Shortcuts outside text fields: Q add · / search · Esc close. Ctrl/⌘ + P opens the print panel; Ctrl/⌘ + S saves a backup.</p><p>Recurring tasks generate the next occurrence when completed. “Every 30 days” uses a fixed 30-day interval. Routine check-ins record the days you meet your target; streaks count consecutive checked days.</p></section><section class="card"><h2>Developer checks</h2><p>Safe tests run on temporary copies. Your records are never changed.</p><button onclick="selfTest()">Run Self-Test</button><div id="tests"></div></section></div>`}
function bindBase(){const form=$('#settingsForm');if(form){form.elements.accent.oninput=e=>$('#stylePreview').style.background=e.target.value;form.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form));try{new Intl.DateTimeFormat('en',{timeZone:f.zone})}catch{toast('Use a valid time zone, for example Europe/London or Asia/Karachi.');return}Object.assign(S.settings,f,{firstDay:f.firstDay==='Monday'?1:0,hour24:f.hour24==='24 hour',scale:+f.scale,radius:+f.radius,density:+f.density});persist();render();toast('Your preferences are saved.')}}}

function download(name,text,mime){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type:mime}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function csv(type){let fields=['type','title','date','time','category','assignee','status','amount','flow','notes'];let cell=s=>'"'+String(s??'').replace(/^[=+@\-]/,"'$&").replace(/"/g,'""')+'"';download('bloomstead-'+type.toLowerCase().replaceAll(' ','-')+'.csv',[fields.join(','),...records(type).map(r=>fields.map(k=>cell(r[k])).join(','))].join('\r\n'),'text/csv;charset=utf-8')}

function selfTestBase(){const tests=[];function test(name,fn){try{if(!fn())throw Error('Unexpected result');tests.push([name,true,''])}catch(e){tests.push([name,false,e.message])}}let copy=newState();test('State creation',()=>copy.version===1&&copy.records.length===0);test('Add, edit, delete',()=>{copy.records.push({id:'test',title:'A',type:'Tasks'});copy.records[0].title='B';let ok=copy.records[0].title==='B';copy.records=[];return ok&&copy.records.length===0});test('Income and spending totals',()=>{let v=totals([{flow:'Income',amount:20},{flow:'Expense',amount:8}]);return v.income-v.expense===12});test('Leap day date calculation',()=>shift('2024-02-28',1)==='2024-02-29'&&shift('2024-12-31',1)==='2025-01-01');test('Routine streak',()=>streak({checks:[dateKey(),shift(dateKey(),-1)]})===2);test('Serialization',()=>JSON.parse(JSON.stringify(copy)).version===1);test('Import validation',()=>validate(copy));test('Reject invalid import',()=>{try{validate({version:9});return false}catch{return true}});test('Reject duplicate IDs',()=>{let c=structuredClone(copy);c.records=[{id:'x',title:'A',type:'Tasks'},{id:'x',title:'B',type:'Tasks'}];try{validate(c);return false}catch{return true}});test('Theme isolation',()=>{let c=structuredClone(S);c.settings.dark=!S.settings.dark;return c.settings.dark!==S.settings.dark});test('Chart series',()=>chartData().length===6&&chartData().every(x=>Number.isFinite(x.income)));test('Required controls',()=>!!$('#nav')&&!!$('#modal')&&!!$('#globalSearch')&&!!$('#settingsForm'));$('#tests').innerHTML=tests.map(([n,ok,msg])=>`<p>${ok?'✓ Passed':'✕ Failed'} — ${esc(n)} ${esc(msg)}</p>`).join('');return tests}
function clock(){const now=new Date();$('#clock').textContent=now.toLocaleDateString(S.settings.dateFormat,{timeZone:S.settings.zone,weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+now.toLocaleTimeString('en',{timeZone:S.settings.zone,hour:'2-digit',minute:'2-digit',hour12:!S.settings.hour24});const g=$('#greeting');if(g){let hour=+new Intl.DateTimeFormat('en-GB',{timeZone:S.settings.zone,hour:'numeric',hourCycle:'h23'}).format(now);g.textContent=hour<12?'Good morning, lovely.':hour<18?'A little afternoon reset.':'Let’s make room for a softer evening.'}}

function normalizeState(){S.settings={...defaults,...S.settings};S.records=S.records.map(r=>({...freshRecord(r.type,r.title),...r}));S.reviews??={};S.packHistory??=[];S.timer??={duration:1500,remaining:1500,running:false,endAt:null};S.filters??={};S.settings.order=[...new Set([...(S.settings.order||[]),...modules])];S.settings.hidden=(S.settings.hidden||[]).filter(x=>modules.includes(x));if(!modules.includes(S.page))S.page='Dashboard'}
function validate(v){validateBase(v);if(v.filters&&(typeof v.filters!=='object'||Array.isArray(v.filters)||Object.values(v.filters).some(f=>!f||typeof f!=='object'||Object.values(f).some(x=>typeof x!=='string'))))throw Error('Invalid saved filters');if(v.view&&(typeof v.view!=='object'||Array.isArray(v.view)))throw Error('Invalid saved view');if(v.settings.dark!=null&&typeof v.settings.dark!=='boolean')throw Error('Invalid theme mode');if(v.settings.collapsed!=null&&typeof v.settings.collapsed!=='boolean')throw Error('Invalid navigation mode');const validDate=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&localDay(new Date(d+'T12:00:00'))===d;for(const r of v.records){if(r.amount!=null&&r.amount<0)throw Error('Amounts must be positive; choose Income or Expense.');for(const k of ['date','completedDate'])if(r[k]&&!validDate(r[k]))throw Error('Invalid calendar date');for(const k of ['checks','subDone'])if(r[k]&&!Array.isArray(r[k]))throw Error('Invalid checklist');if(r.checks&&r.checks.some(d=>!validDate(d)))throw Error('Invalid check-in date');if(r.subDone&&r.subDone.some(i=>!Number.isInteger(i)||i<0))throw Error('Invalid checklist index');if(r.ingredients&&(!Array.isArray(r.ingredients)||r.ingredients.some(i=>!i||typeof i.name!=='string'||typeof i.unit!=='string'||!Number.isFinite(i.qty)||i.qty<=0)))throw Error('Invalid recipe ingredients');for(const k of ['points','quantity','threshold','servings','minutes','sessionSeconds'])if(r[k]!=null&&(!Number.isFinite(r[k])||r[k]<0||r[k]>1e8))throw Error('Invalid quantity');for(const k of ['unit','mealSlot','recipeId','phone','email','location','nextId','sourceBill'])if(r[k]!=null&&typeof r[k]!=='string')throw Error('Invalid record detail');if(r.color&&!/^#[0-9a-f]{6}$/i.test(r.color))throw Error('Invalid record color');if(r.expiry&&!validDate(r.expiry))throw Error('Invalid expiry');}
const a=v.settings;for(const k of ['scale','radius','density','theme','budgetLimit'])if(a[k]!=null&&!Number.isFinite(a[k]))throw Error('Invalid numeric preference');if(a.theme!=null&&(a.theme<0||a.theme>15||!Number.isInteger(a.theme)))throw Error('Invalid theme');if(a.firstDay!=null&&![0,1].includes(a.firstDay))throw Error('Invalid week start');if(a.sidebar&&!/^#[0-9a-f]{6}$/i.test(a.sidebar))throw Error('Invalid sidebar color');if(a.dateFormat&&!['en-US','en-GB'].includes(a.dateFormat))throw Error('Invalid date format');if(v.packHistory&&(!Array.isArray(v.packHistory)||v.packHistory.some(x=>!Number.isInteger(x)||x<0||x>=48)))throw Error('Invalid pack history');if(v.reviews&&(typeof v.reviews!=='object'||Array.isArray(v.reviews)||Object.values(v.reviews).some(r=>!r||typeof r!=='object'||Object.values(r).some(x=>typeof x!=='string'))))throw Error('Invalid weekly reviews');if(v.timer&&(!Number.isFinite(v.timer.duration)||!Number.isFinite(v.timer.remaining)||v.timer.duration<0||v.timer.duration>86400||v.timer.remaining<0||(v.timer.endAt!==null&&!Number.isFinite(v.timer.endAt))))throw Error('Invalid focus timer');return true}
function applyStyle(){applyStyleBase();const a=S.settings,t=THEMES[a.theme]||THEMES[0],root=document.documentElement;root.style.setProperty('--sidebar',a.sidebar||t[2]);root.style.setProperty('--bg',t[3]);root.style.setProperty('--soft',t[4]);document.body.classList.toggle('collapsed',!!a.collapsed);$('#brand').textContent=a.title}
function chooseTheme(i){const t=THEMES[i];Object.assign(S.settings,{theme:i,accent:t[1],sidebar:t[2],peach:t[5],lilac:t[4]});persist();render();toast(t[0]+' selected')}
function toggleSidebar(){if(matchMedia('(max-width:760px)').matches){document.body.classList.toggle('drawer')}else{S.settings.collapsed=!S.settings.collapsed;persist();render()}}
function go(p){S.page=p;let f=S.filters[p]||{};query=f.query||'';filter=f.filter||'All';sort=f.sort||'date';document.body.classList.remove('drawer');persist();render();window.scrollTo(0,0)}
function setFilter(key,value){S.filters[S.page]={...(S.filters[S.page]||{}),[key]:value};if(key==='query')query=value;if(key==='filter')filter=value;if(key==='sort')sort=value;persist();render()}
function filtered(type){return records(type).filter(r=>(!query||[r.title,r.notes,r.tags,r.assignee,r.category].join(' ').toLowerCase().includes(query.toLowerCase()))&&(filter==='All'||r.status===filter)).sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='priority'?(['High','Medium','Low'].indexOf(a.priority)-['High','Medium','Low'].indexOf(b.priority)):((a.date||'9999')+(a.time||'')).localeCompare((b.date||'9999')+(b.time||'')))}
function toolbar(type){return `<div class="toolbar flex"><input aria-label="Search section" placeholder="Search this section…" value="${esc(query)}" onchange="setFilter('query',this.value)"><select aria-label="Filter status" onchange="setFilter('filter',this.value)">${['All','Pending','In progress','Done'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Sort records" onchange="setFilter('sort',this.value)">${['date','title','priority'].map(x=>`<option ${sort===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="csv('${type}')">Export CSV</button>${['Tasks','Chores','Home Care','Grocery List'].includes(type)?`<button onclick="bulk('${type}')">Complete visible</button>`:''}</div>`}
function render(){applyStyle();const groups={'Dashboard':'YOUR DAY','Family Schedule':'YOUR PEOPLE','Meals':'HOME & TABLE','Budget':'MONEY & MOMENTS','Planning Packs':'MAKE IT YOURS'};$('#nav').innerHTML=S.settings.order.filter(x=>x!=='Settings'&&!S.settings.hidden.includes(x)).map(x=>`${groups[x]?`<div class="sidebarLabel">${groups[x]}</div>`:''}<button class="${S.page===x?'active':''}" data-go="${esc(x)}" ${S.page===x?'aria-current="page"':''}>${icons[modules.indexOf(x)]||'◇'} &nbsp; ${esc(label(x))}</button>`).join('');$('#nav').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));const routes={'Dashboard':dashboard,'Today':todayPage,'Calendar':calendar,'Settings':settings,'Reports':reports,'Meals':mealsPage,'Recipes':recipesPage,'Pantry':pantryPage,'Bills':billsPage,'Focus Timer':focusPage,'Weekly Review':reviewPage,'Planning Packs':packsPage,'Family Schedule':familyPage,'Budget':budgetPage};$('#page').innerHTML=(routes[S.page]||(()=>listPage(S.page)))();if(recovery)$('#page').insertAdjacentHTML('afterbegin',`<div class="alert notice-danger">${esc(recovery)} <button onclick="go('Settings')">Open backup tools</button></div>`);bind();clock();timerTick();$('#nav').querySelector('.active')?.scrollIntoView?.({block:'nearest'});}
function dashboard(){const day=dateKey(),t=totals(),tasks=records('Tasks').filter(r=>r.date===day),pending=S.records.filter(r=>['Tasks','Chores','Home Care'].includes(r.type)&&r.date&&r.date<day&&!done(r)),upcoming=records('Bills').filter(r=>!done(r)&&r.date<=shift(day,7)),low=records('Pantry').filter(r=>r.quantity<=r.threshold),daily=records('Routines');return `${S.sampleNotice&&S.records.some(r=>r.isSample)?'<div class="banner flex">A sample family is here to help you explore.<button class="right" onclick="S.sampleNotice=false;persist();render()">Dismiss</button></div>':''}<section class="hero"><div class="eyebrow">BLOOMSTEAD · YOUR FAMILY STUDIO</div><h1 id="greeting">Make room for a lovely day.</h1><p>${esc(S.settings.subtitle)}</p><div class="actions"><button class="primary" onclick="go('Today')">Open my day →</button><button onclick="go('Planning Packs')">Explore 48 planning packs</button></div><div class="tagline"><span class="pill">${S.settings.members.split(',').filter(x=>x.trim()).length} family members</span><span class="pill">${pending.length} overdue plans</span><span class="pill">${upcoming.length} bills due within 7 days</span></div></section><div class="statstrip">${S.settings.cards.includes('Tasks')?stat('TODAY’S TASKS',tasks.filter(done).length+' / '+tasks.length,'A little progress counts','Tasks'):''}${S.settings.cards.includes('Routines')?stat('DAILY CHECK-INS',daily.filter(r=>(r.checks||[]).includes(day)).length+' / '+daily.length,'Routines you’ve shown up for','Routines'):''}${S.settings.cards.includes('Budget')?stat('HOUSEHOLD BALANCE',money(t.income-t.expense),'Income − expenses · selected range','Budget'):''}${S.settings.cards.includes('Goals')?stat('GOALS IN MOTION',records('Goals').filter(r=>!done(r)).length,'Make space for what comes next','Goals'):''}</div><div class="grid"><section class="card span8"><div class="cardtop"><h2>Your top priorities</h2><button onclick="edit(null,'Tasks')">＋ Add task</button></div>${rows(tasks.sort((a,b)=>['High','Medium','Low'].indexOf(a.priority)-['High','Medium','Low'].indexOf(b.priority)).slice(0,5),true)}${pending.length?`<details><summary>${pending.length} overdue plans need a new date</summary>${rows(pending.slice(0,6),true)}</details>`:''}</section><section class="card span4"><div class="eyebrow">AROUND YOUR TABLE</div><h2 style="margin-top:10px">Tonight, made simpler</h2>${rows(records('Meals').filter(r=>r.date===day).slice(0,2))}<div class="actions"><button onclick="go('Meals')">Plan the week</button><button onclick="go('Recipes')">Recipe box</button></div>${low.length?`<p class="mutedline">${low.length} pantry items are running low.</p>`:''}</section><section class="card span6"><h2>Coming up for your people</h2>${rows(S.records.filter(r=>['Family Schedule','Appointments'].includes(r.type)&&r.date>=day).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4))}<button onclick="go('Calendar')">Open calendar →</button></section><section class="card span6"><h2>A moment for you</h2>${rows(records('Self-Care').filter(r=>!done(r)).slice(0,2))}<div class="help" style="padding:16px;border-radius:12px"><strong>One thing at a time.</strong><p class="mutedline">A short focus session can make a big list feel smaller.</p><button onclick="go('Focus Timer')">Start a focus session</button></div></section><section class="card span6"><h2>Your weekly rhythm</h2>${lineChart()}<small>Tasks completed each day · latest 7 days</small></section><section class="card span6"><h2>Where your money goes</h2>${donutChart()}</section><section class="card span6"><h2>Income & spending</h2>${barChart()}</section><section class="card span6"><h2>Dream a little, grow a little</h2>${goalCards()}<button onclick="go('Weekly Review')">Reflect on your week →</button></section></div>`}
function stat(title,value,caption,page){return `<section class="card"><div class="eyebrow">${title}</div><strong>${value}</strong><small>${caption}</small><button onclick="go('${page}')" style="margin-top:12px">View →</button></section>`}
function subtasks(r){const items=(r.subtasks||'').split('\n').map(x=>x.trim()).filter(Boolean);if(!items.length)return '';return `<details><summary>${(r.subDone||[]).length} / ${items.length} checklist items</summary>${items.map((s,i)=>`<label class="subcheck"><input type="checkbox" ${(r.subDone||[]).includes(i)?'checked':''} onchange="toggleSub('${r.id}',${i})"><span>${esc(s)}</span></label>`).join('')}</details>`}
function toggleSub(id,i){commit(()=>{let r=S.records.find(x=>x.id===id);r.subDone??=[];r.subDone=r.subDone.includes(i)?r.subDone.filter(n=>n!==i):[...r.subDone,i];r.isSample=false},'Checklist updated')}
function rows(a,checks=false){if(!a.length)return '<div class="empty">A little breathing room.<br>Add a plan or explore a ready-to-use planning pack.</div>';return a.map(r=>`<article class="row ${done(r)?'completed':''}" data-record="${r.id}">${checks?`<input class="check" type="checkbox" aria-label="Complete ${esc(r.title)}" ${done(r)?'checked':''} onchange="complete('${r.id}')">`:`<span class="dot" style="margin-top:10px"></span>`}<div class="body"><button class="titlebutton ${done(r)?'done':''}" onclick="edit('${r.id}')">${r.pinned?'⌖ ':''}${esc(r.title)}</button><small>${esc([r.date,r.time,r.assignee,r.category].filter(Boolean).join(' · '))}</small>${r.priority==='High'?'<span class="badge" style="margin-left:6px">High priority</span>':''}${r.type==='Budget'?`<div>${r.flow==='Income'?'+':'−'} ${money(r.amount)}</div>`:''}${r.type==='Grocery List'?`<div class="mutedline">${r.quantity||1} ${esc(r.unit||'item(s)')} ${r.amount?'· '+money(r.amount):''}</div>`:''}${r.type==='Chores'?`<div class="mutedline">${r.points||0} chore points</div>`:''}${['Notes','Kids','Important Contacts','Self-Care'].includes(r.type)?`<div class="compact-note">${esc((r.notes||'').slice(0,250))}</div>`:''}${subtasks(r)}</div><div class="row-actions noprint"><button onclick="edit('${r.id}')" aria-label="Edit ${esc(r.title)}">✎</button></div></article>`).join('')}
function listPage(type){let a=filtered(type);let extra='';if(type==='Chores')extra=`<div class="card" style="margin-bottom:18px"><h2>Team effort, little wins</h2>${S.settings.members.split(',').map(x=>x.trim()).filter(Boolean).map(name=>{let chores=records('Chores').filter(r=>r.assignee===name);return `<div class="row"><span class="person-avatar">${esc(name.slice(0,1))}</span><div class="body"><strong>${esc(name)}</strong><br><small>${chores.filter(done).length} chores completed</small></div><strong>${chores.filter(done).reduce((n,r)=>n+(r.points||0),0)} points</strong></div>`}).join('')}</div>`;if(type==='Notes')return heading(label(type),'Ideas, reminders and checklists, all in one quiet place.')+toolbar(type)+`<div class="grid">${a.sort((x,y)=>!!y.pinned-!!x.pinned).map(r=>`<section class="card span4" style="border-top:5px solid ${/^#[0-9a-f]{6}$/i.test(r.color)?r.color:'#70516c'}"><div class="cardtop"><h2>${r.pinned?'⌖ ':''}${esc(r.title)}</h2><button onclick="edit('${r.id}')">Edit</button></div><div class="compact-note">${esc(r.notes)}</div>${subtasks(r)}</section>`).join('')||'<div class="empty span12">Add your first note.</div>'}</div>`;return heading(label(type))+toolbar(type)+extra+(type==='Routines'?`<div class="grid">${habitCards(a,true)}</div>`:type==='Goals'?`<div class="grid">${goalCards(a,true)}</div>`:`<section class="card">${rows(a,['Tasks','Chores','Home Care','Grocery List'].includes(type))}</section>`)}
function nextDate(d,pattern){if(pattern==='Monthly'){const x=new Date(d+'T12:00:00'),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return localDay(x)}return shift(d,pattern==='Daily'?1:pattern==='Weekly'?7:30)}
function markComplete(r){r.status=done(r)?'Pending':'Done';r.completedDate=done(r)?dateKey():'';r.isSample=false;if(done(r)&&r.recurring&&r.recurring!=='None'&&!S.records.some(x=>x.id===r.nextId)){const n={...structuredClone(r),id:uid(),status:'Pending',completedDate:'',date:nextDate(r.date||dateKey(),r.recurring),subDone:[],checks:[],nextId:''};r.nextId=n.id;S.records.push(n)}}
function complete(id){commit(()=>markComplete(S.records.find(r=>r.id===id)),'Plan updated')}
function bulk(type){const a=filtered(type).filter(r=>!done(r));commit(()=>a.forEach(markComplete),'Visible plans completed')}
function duplicate(id){commit(()=>{let r=structuredClone(S.records.find(x=>x.id===id));r.id=uid();r.title+=' (copy)';r.nextId='';r.sourceBill='';r.isSample=false;S.records.push(r)},'Copied');closeModal()}
function checkHabit(id,d){if(d>dateKey())return;commit(()=>{let r=S.records.find(x=>x.id===id);r.checks??=[];r.checks=r.checks.includes(d)?r.checks.filter(x=>x!==d):[...r.checks,d];r.isSample=false},'Check-in saved')}
function habitStats(r){let t=dateKey(),days=Array.from({length:30},(_,i)=>shift(t,-i)),checks=new Set(r.checks||[]),n=days.filter(d=>checks.has(d)).length;return {n,rate:Math.round(n/30*100),streak:streak(r)}}
function habitCards(a=records('Routines'),grid=false){return a.length?a.map(r=>{let st=habitStats(r),t=dateKey();return `<section class="${grid?'card span4':''}" style="margin-bottom:15px"><div class="cardtop"><div><span class="badge">${esc(r.icon||'✧')} ${esc(r.frequency||'Daily')}</span><h3 style="margin-top:12px">${esc(r.title)}</h3></div><button onclick="edit('${r.id}')">Edit</button></div><small>Target: ${r.target||1} ${r.frequency==='Weekly'?'days per week':'per day'} · ${st.streak} day streak</small><div class="flex" style="margin:14px 0">${Array.from({length:7},(_,i)=>{let d=shift(t,i-6),yes=(r.checks||[]).includes(d);return `<button aria-pressed="${yes}" aria-label="Check in ${d}" title="${d}" style="padding:8px;${yes?'background:var(--accent);color:white':''}" onclick="checkHabit('${r.id}','${d}')">${yes?'✓':d.slice(-2)}</button>`}).join('')}</div><p class="mutedline">${st.n} days checked in / 30 (${st.rate}%)</p>${r.frequency==='Weekly'?`<p class="mutedline">This week: ${(r.checks||[]).filter(d=>d>=weekOf(t)&&d<=t).length} / ${r.target||1} target days</p>`:''}<small>Check in after meeting your target. Streaks count consecutive days.</small></section>`}).join(''):'<div class="empty span12">Create a routine or add a planning pack.</div>'}
function goalCards(a=records('Goals'),grid=false){return a.length?a.map(r=>{let p=Math.min(100,Math.max(0,(r.progress||0)/(r.target||1)*100));return `<section class="${grid?'card span4':''}" style="margin-bottom:20px"><div class="cardtop"><h3>${esc(r.title)}</h3><button onclick="edit('${r.id}')">Edit</button></div><small>${r.progress||0} / ${r.target||1} · ${p.toFixed(0)}%</small><progress max="100" value="${p}" aria-label="${esc(r.title)} progress"></progress><p class="mutedline">${r.date?'Due '+r.date:'No deadline'} · ${esc(r.status)}</p>${subtasks(r)}<div class="actions noprint" style="margin-top:10px"><button onclick="adjustGoal('${r.id}')">Update progress</button></div></section>`}).join(''):'<div class="empty">Your next goal starts here.</div>'}
function adjustGoal(id){const r=S.records.find(x=>x.id===id),v=prompt('New progress amount (target '+r.target+')',r.progress||0);if(v===null)return;let n=Number(v);if(!Number.isFinite(n)||n<0||n>1e12){toast('Enter a valid positive amount.');return}commit(()=>{r.progress=n;r.isSample=false;r.status=n>=r.target?'Done':'In progress'},'Goal updated')}
// Focused forms: only fields that are useful for the selected record type.
function area(name,title,value='',help=''){return `<label class="full">${title}<textarea name="${name}" maxlength="20000">${esc(value)}</textarea>${help?`<small>${help}</small>`:''}</label>`}
function edit(id=null,type='Tasks',presetDate=null){const old=id?S.records.find(r=>r.id===id):null;if(id&&!old)return;const r=old||freshRecord(type,'',{date:presetDate||dateKey()}),kind=r.type,isTask=['Tasks','Chores','Home Care','Grocery List','Self-Care'].includes(kind);let f='';if(!id)f+=select('type','Section',recordTypes,kind);f+=field('title',kind==='Recipes'?'Recipe name *':'Title *',r.title,'text','required maxlength="300"');
if(!['Notes','Recipes','Important Contacts','Pantry','Kids','Routines'].includes(kind))f+=field('date',kind==='Bills'?'Due date':'Date',r.date,'date');
if(['Tasks','Family Schedule','Appointments','Self-Care'].includes(kind))f+=field('time','Time',r.time,'time');
if(kind!=='Bills')f+=select('status','Status',['Pending','In progress','Done'],r.status);
f+=field('category','Category',r.category,'text','list="categories"');
if(!['Budget','Recipes','Pantry','Important Contacts'].includes(kind))f+=field('assignee','Family member',r.assignee,'text','list="members"');
f+=`<datalist id="members">${S.settings.members.split(',').map(x=>`<option value="${esc(x.trim())}">`).join('')}</datalist><datalist id="categories">${S.settings.categories.split(',').map(x=>`<option value="${esc(x.trim())}">`).join('')}</datalist>`;
if(isTask)f+=select('priority','Priority',['High','Medium','Low'],r.priority)+select('recurring','Repeat after completion',['None','Daily','Weekly','Monthly'],r.recurring);
if(kind==='Chores')f+=field('points','Points per completion',r.points??5,'number','min="0" max="1000" step="1"');
if(['Budget','Bills','Grocery List'].includes(kind))f+=field('amount',kind==='Grocery List'?'Estimated total cost':'Amount',r.amount||0,'number','min="0" max="1000000000000" step="0.01"');
if(kind==='Budget')f+=select('flow','Direction',['Expense','Income'],r.flow||'Expense');
if(kind==='Bills')f+=select('recurring','Repeat bill',['None','Monthly','Weekly'],r.recurring||'None');
if(['Goals','Routines'].includes(kind))f+=field('target',kind==='Goals'?'Goal target':'Routine target',r.target||1,'number','min="1" max="1000000000000" step="any"');
if(kind==='Goals')f+=field('progress','Current progress',r.progress||0,'number','min="0" max="1000000000000" step="any"');
if(kind==='Routines')f+=select('frequency','Frequency',['Daily','Weekly'],r.frequency||'Daily')+select('icon','Icon',['✧','♡','☀','◈','✓','♧'],r.icon||'✧');
if(['Grocery List','Pantry'].includes(kind))f+=field('quantity','Quantity',r.quantity??1,'number','min="0" max="1000000" step="any"')+field('unit','Unit (g, ml, items…) ',r.unit||'items');
if(kind==='Pantry')f+=field('threshold','Low-stock threshold',r.threshold??1,'number','min="0" max="1000000" step="any"')+field('expiry','Expiry date (optional)',r.expiry,'date');
if(kind==='Recipes')f+=field('servings','Base servings',r.servings||4,'number','min="1" max="1000"')+field('minutes','Preparation minutes',r.minutes||20,'number','min="0" max="10000"')+area('ingredientsText','Ingredients: one per line',(r.ingredients||[]).map(i=>`${i.name} | ${i.qty} | ${i.unit}`).join('\n'),'Use name | quantity | unit. Example: Rice | 200 | g');
if(kind==='Meals')f+=select('mealSlot','Meal',['Breakfast','Lunch','Dinner','Snack'],r.mealSlot||'Dinner')+`<label>Recipe (optional)<select name="recipeId"><option value="">No recipe linked</option>${records('Recipes').map(x=>`<option value="${x.id}" ${r.recipeId===x.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select></label>`+field('servings','Servings',r.servings||4,'number','min="1" max="1000"');
if(kind==='Important Contacts')f+=field('phone','Phone',r.phone,'tel')+field('email','Email',r.email,'email');
if(['Appointments','Family Schedule','Important Contacts'].includes(kind))f+=field('location','Location / address',r.location);
f+=field('tags','Tags (comma separated)',r.tags)+area('notes',kind==='Recipes'?'Recipe method / notes':'Notes',r.notes);
if(['Tasks','Chores','Home Care','Goals','Notes','Kids'].includes(kind))f+=area('subtasks',kind==='Goals'?'Milestones (one per line)':'Checklist (one per line)',r.subtasks);

function parseIngredients(text){if(!text.trim())return [];return text.split('\n').filter(x=>x.trim()).map(line=>{let [name,q,unit,...extra]=line.split('|').map(x=>x.trim()),qty=Number(q);if(!name||!q||!unit||extra.length||!Number.isFinite(qty)||qty<=0||qty>1e6)throw Error('Use name | quantity | unit for each ingredient, with a positive quantity.');return {name,qty,unit}})}

function ingredientTotals(plans,skipPantry){const totals=new Map();for(const m of plans){const r=S.records.find(x=>x.id===m.recipeId&&x.type==='Recipes');if(!r)continue;const multiplier=(m.servings||r.servings||4)/(r.servings||4);for(const i of r.ingredients||[]){const key=i.name.trim().toLowerCase()+'|'+i.unit.trim().toLowerCase();let v=totals.get(key)||{name:i.name,unit:i.unit,qty:0};v.qty+=i.qty*multiplier;totals.set(key,v)}}if(skipPantry)for(const v of totals.values()){const stock=records('Pantry').filter(r=>r.title.trim().toLowerCase()===v.name.trim().toLowerCase()&&(r.unit||'').trim().toLowerCase()===v.unit.trim().toLowerCase()&&(!r.expiry||r.expiry>=dateKey())).reduce((n,r)=>n+(r.quantity||0),0);v.qty=Math.max(0,v.qty-stock)}return [...totals.values()].filter(x=>x.qty>0).map(x=>({...x,qty:Math.round(x.qty*1000)/1000}))}
function groceryPreview(plans){let skip=true;function show(){let items=ingredientTotals(plans,skip);openModal('Build your grocery list',`<p>Amounts combine matching ingredient names and units. Different units stay separate.</p><label class="checkrow"><input id="skipPantry" type="checkbox" ${skip?'checked':''}>Subtract unexpired pantry stock with matching names and units</label><ul>${items.map(i=>`<li>${esc(i.name)} — ${i.qty} ${esc(i.unit)}</li>`).join('')||'<li>No ingredients needed, or no recipes are linked.</li>'}</ul><p class="formhelp">Existing uncompleted grocery entries with matching names and units are increased. Pantry stock is not consumed.</p><button id="confirmGroceries" class="primary" ${items.length?'':'disabled'}>Add ${items.length} items</button>`);$('#skipPantry').onchange=e=>{skip=e.target.checked;show()};$('#confirmGroceries').onclick=()=>{commit(()=>{for(const i of items){let old=records('Grocery List').find(r=>!done(r)&&r.title.toLowerCase()===i.name.toLowerCase()&&(r.unit||'').toLowerCase()===i.unit.toLowerCase());if(old){old.quantity=Math.round(((old.quantity||0)+i.qty)*1000)/1000;old.isSample=false}else S.records.push(freshRecord('Grocery List',i.name,{quantity:i.qty,unit:i.unit,category:'Food'}))}},'Grocery list updated');closeModal()}}show()}

function reports(){let t=totals();return heading('A clearer picture','Reports calculate from the records you save.')+`<div class="toolbar flex"><label>Range<select onchange="setReport(this.value)">${['7 days','30 days','This month','Custom'].map(x=>`<option ${reportMode===x?'selected':''}>${x}</option>`).join('')}</select></label><label>From<input type="date" value="${reportFrom}" onchange="changeReportDate('from',this.value)"></label><label>To<input type="date" value="${reportTo}" onchange="changeReportDate('to',this.value)"></label><button onclick="csv('Budget')">Export CSV</button></div><div class="statstrip">${stat('INCOME',money(t.income),'Sum of income entries in this range','Budget')}${stat('EXPENSES',money(t.expense),'Sum of expense entries in this range','Budget')}${stat('NET BALANCE',money(t.income-t.expense),'Income minus expenses','Budget')}${stat('COMPLETED TASKS',records('Tasks').filter(r=>done(r)&&r.completedDate>=reportFrom&&r.completedDate<=reportTo).length,'Completed within this range','Tasks')}</div><div class="grid"><section class="card span6"><h2>Income & spending</h2>${barChart()}<details><summary>Accessible chart values</summary><div class="tablewrap"><table><thead><tr><th>Dates</th><th>Income</th><th>Expenses</th></tr></thead><tbody>${chartData().map(x=>`<tr><td>${x.start} — ${x.end}</td><td>${money(x.income)}</td><td>${money(x.expense)}</td></tr>`).join('')}</tbody></table></div></details></section><section class="card span6"><h2>Spending by category</h2>${donutChart()}</section><section class="card span12"><h2>Task rhythm · latest seven days</h2>${lineChart()}<p class="mutedline">Each label is the number of tasks marked complete on that day.</p></section></div>`}
function changeReportDate(k,v){if(!v)return;let f=k==='from'?v:reportFrom,t=k==='to'?v:reportTo;if(f>t){toast('Start date must be on or before the end date.');render();return}reportFrom=f;reportTo=t;reportMode='Custom';persistView();render()}
function settings(){let base=settingsBase();const gallery=`<section class="card"><div class="eyebrow">A PALETTE FOR EVERY MOOD</div><h2 style="margin-top:10px">16 thoughtfully paired themes</h2><div class="themegrid">${THEMES.map((t,i)=>`<button class="themechoice" onclick="chooseTheme(${i})" aria-pressed="${S.settings.theme===i}"><span class="swatches">${[t[2],t[1],t[4],t[5]].map(c=>`<i style="background:${c}"></i>`).join('')}</span><strong>${t[0]}</strong></button>`).join('')}</div><p class="mutedline">Theme selection changes the sidebar, accent and page palette. Light and dark modes remain available.</p></section>`;base=base.replace('<div class="settings">','<div class="settings">'+gallery).replace(field('accent','Main accent',S.settings.accent,'color'),field('accent','Main accent',S.settings.accent,'color')+field('sidebar','Sidebar color',S.settings.sidebar||'#342b3d','color'));base=base.replace('Recurring tasks generate the next occurrence when completed. “Every 30 days” uses a fixed 30-day interval.','Recurring tasks create the next plan when completed. Monthly repeats use the same day where possible and the last day in shorter months.');base=base.replace('Routine check-ins record the days you meet your target; streaks count consecutive checked days.','Recipe ingredients use name | quantity | unit. Meal-to-grocery tools match ingredient names and units exactly; pantry stock is not automatically consumed. Routine streaks count consecutive checked days.');return base}
function resetAppearance(){for(let k of ['accent','sidebar','theme','peach','lilac','scale','radius','density','dark'])S.settings[k]=defaults[k];persist();render();toast('Appearance restored.')}
function bind(){bindBase();const form=$('#settingsForm');if(form){form.onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(form));try{new Intl.DateTimeFormat('en',{timeZone:f.zone});const a={...S.settings,...f,firstDay:f.firstDay==='Monday'?1:0,hour24:f.hour24==='24 hour',scale:+f.scale,radius:+f.radius,density:+f.density};validate({version:1,records:[],settings:a});S.settings=a;persist();render();toast('Preferences saved')}catch(err){toast('Check your preferences: '+err.message)}}}const review=$('#reviewForm');if(review)review.onsubmit=e=>{e.preventDefault();saveReview()};$('#page').querySelectorAll('.calendar').forEach(c=>c.parentElement.classList.add('calendarcard'))}
function clearSamples(){if(confirm('Remove only untouched sample records? Your own and edited records stay.'))commit(()=>{S.records=S.records.filter(r=>!r.isSample);S.sampleNotice=false},'Sample records removed')}
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;if(!$('#modal').open){openModal.returnFocus=document.activeElement;$('#modal').showModal()}setTimeout(()=>$('#modalBody').querySelector('input,select,button,textarea')?.focus(),0)}
function closeModal(){$('#modal').close();openModal.returnFocus?.focus?.()}
function persist(){if(recovery)return;clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,180)}
function saveNow(){if(recovery)return;try{localStorage.setItem(KEY,JSON.stringify(S));$('#saved').textContent='✓ Saved on this device'}catch(err){$('#saved').textContent='Not saved — export a backup';toast('Storage is unavailable or full. Export your backup from Settings.')}}
async function importBackup(file){if(!file)return;if(file.size>8*1024*1024){toast('Choose a backup smaller than 8 MB.');return}try{let v=JSON.parse(await file.text());validate(v);const counts=recordTypes.map(t=>[t,v.records.filter(r=>r.type===t).length]).filter(x=>x[1]);openModal('Review your backup',`<p><strong>${v.records.length} records</strong> in ${esc(v.settings.title||'Bloomstead')}.</p><ul>${counts.map(([t,n])=>`<li>${t}: ${n}</li>`).join('')}</ul><p>This will replace the current planner. Export your current backup first if you want to keep it.</p><button id="confirmImport" class="primary">Replace planner with this backup</button>`);$('#confirmImport').onclick=()=>{undoState=structuredClone(S);S={...newState(),...v,settings:{...defaults,...v.settings}};normalizeState();recovery='';persist();closeModal();go(S.page);toast('Backup imported.',true)}}catch(err){toast('Import rejected: '+err.message)}}
function resetPlanner(){if(prompt('Remove all records and preferences? Type RESET to continue.')==='RESET'){S=newState();S.sampleNotice=false;S.studioSeeded=true;recovery='';normalizeState();persist();render();toast('A fresh start.')}}
function printPanel(){openModal('Print your plans',`<form id="printForm"><div class="fields">${select('scope','What to print',['Current section','Planner summary'],'Current section')}${field('from','From',dateKey(),'date','required')}${field('to','To',shift(dateKey(),6),'date','required')}${select('orientation','A4 layout',['Portrait','Landscape'],'Portrait')}<label class="checkrow"><input type="checkbox" name="completed" checked>Include completed records</label></div><p>Print a clean record summary. Use Save as PDF in the browser print dialog for a PDF copy.</p><button class="primary">Print</button></form>`);$('#printForm').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.from>f.to){toast('End date must follow start date.');return}const types=f.scope==='Current section'&&recordTypes.includes(S.page)?[S.page]:recordTypes;const show=S.records.filter(r=>types.includes(r.type)&&(!r.date||(r.date>=f.from&&r.date<=f.to))&&(f.completed||!done(r)));closeModal();$('#page').innerHTML=types.map(t=>{let a=show.filter(r=>r.type===t);return a.length?`<section class="card" style="margin-bottom:20px"><h2>${esc(label(t))}</h2>${a.map(r=>`<article style="padding:10px 0;border-bottom:1px solid #ddd;break-inside:avoid"><strong>${esc(r.title)}</strong><p>${esc([r.date,r.time,r.assignee,r.status].filter(Boolean).join(' · '))}</p>${['Budget','Bills'].includes(t)?`<p>${money(r.amount||0)} ${esc(r.flow||'')}</p>`:''}<p style="white-space:pre-wrap">${esc(r.notes)}</p>${(r.subtasks||'').split('\n').filter(Boolean).map((x,i)=>`<div>${(r.subDone||[]).includes(i)?'✓':'□'} ${esc(x)}</div>`).join('')}${(r.ingredients||[]).map(i=>`<div>${esc(i.name)} · ${i.qty} ${esc(i.unit)}</div>`).join('')}</article>`).join('')}</section>`:''}).join('')||'<p>No records in the selected range.</p>';$('#printhead').innerHTML=`<h2>${esc(S.settings.title)}</h2><p>${f.from} — ${f.to} · Printed ${dateKey()}</p>`;const style=document.createElement('style');style.textContent=`@page{size:A4 ${f.orientation.toLowerCase()};margin:14mm}`;document.head.append(style);const cleanup=()=>{style.remove();render()};window.addEventListener('afterprint',cleanup,{once:true});window.print()}}
function selfTest(){const results=[],test=(name,fn)=>{try{if(!fn())throw Error('Unexpected result');results.push([name,true,''])}catch(e){results.push([name,false,e.message])}};let copy=newState();test('Create a clean state',()=>copy.version===1&&copy.records.length===0);test('Add, edit and delete a record',()=>{copy.records.push(freshRecord('Tasks','One'));copy.records[0].title='Two';let yes=copy.records[0].title==='Two';copy.records.splice(0,1);return yes&&copy.records.length===0});test('Income minus spending',()=>{let t=totals([{flow:'Income',amount:50},{flow:'Expense',amount:75}]);return t.income-t.expense===-25});test('Leap-day calendar calculation',()=>shift('2024-02-28',1)==='2024-02-29');test('Monthly short-month repeat',()=>nextDate('2026-01-31','Monthly')==='2026-02-28');test('Routine check-in streak',()=>streak({checks:[dateKey(),shift(dateKey(),-1)]})===2);test('Backup round trip',()=>validate(JSON.parse(JSON.stringify(copy))));test('Reject malformed backup',()=>{try{validate({version:3});return false}catch{return true}});test('Reject duplicate record IDs',()=>{let v=newState();let r=freshRecord('Tasks','Test');v.records=[r,{...r}];try{validate(v);return false}catch{return true}});test('Reject impossible dates',()=>{let v=newState();v.records=[freshRecord('Tasks','Test',{date:'2026-02-31'})];try{validate(v);return false}catch{return true}});test('Ingredient parser',()=>parseIngredients('Rice | 200 | g')[0].qty===200);test('Reject malformed ingredients',()=>{try{parseIngredients('Rice | zero | g');return false}catch{return true}});test('All 48 planning packs contain 3 entries',()=>PACKS.length===48&&PACKS.every(p=>p[3].length===3&&recordTypes.includes(p[2])));test('All 16 theme palettes are complete',()=>THEMES.length===16&&THEMES.every(t=>t.slice(1).every(c=>/^#[0-9a-f]{6}$/i.test(c))));test('Theme changes stay isolated in a copy',()=>{let v=structuredClone(S);v.settings.dark=!S.settings.dark;return v.settings.dark!==S.settings.dark});test('Chart data has finite values',()=>chartData().every(x=>Number.isFinite(x.income)&&Number.isFinite(x.expense)));test('Safe HTML rendering',()=>esc('<img src=x onerror=alert(1)>').startsWith('&lt;'));test('Required page controls',()=>!!$('#nav')&&!!$('#modal')&&!!$('#globalSearch'));let e=$('#tests');if(e)e.innerHTML=results.map(([n,ok,msg])=>`<p>${ok?'✓ Passed':'✕ Failed'} — ${esc(n)} ${esc(msg)}</p>`).join('');return results}
// Fresh-install examples. Every example can be removed without touching user records.
function seedStudio(){if(S.studioSeeded)return;S.studioSeeded=true;if(!S.records.some(r=>r.isSample))return;const t=dateKey(),recipe=freshRecord('Recipes','Lemon chicken & rice',{servings:4,minutes:30,category:'Dinner',ingredients:[{name:'Rice',qty:300,unit:'g'},{name:'Chicken',qty:500,unit:'g'},{name:'Lemon',qty:1,unit:'items'},{name:'Carrots',qty:3,unit:'items'}],notes:'Cook the rice according to the packet. Prepare the chicken and vegetables using your preferred recipe. Serve with lemon.',isSample:true});S.records.push(recipe,freshRecord('Recipes','Tomato & bean bowls',{servings:4,minutes:20,category:'Lunch',ingredients:[{name:'Beans',qty:400,unit:'g'},{name:'Tomatoes',qty:4,unit:'items'},{name:'Rice',qty:200,unit:'g'}],notes:'Prepare the rice and warm the beans. Chop the tomatoes and assemble the bowls.',isSample:true}),freshRecord('Pantry','Rice',{quantity:200,threshold:250,unit:'g',category:'Dry goods',isSample:true}),freshRecord('Pantry','Oats',{quantity:500,threshold:150,unit:'g',expiry:shift(t,60),category:'Breakfast',isSample:true}),freshRecord('Bills','Internet',{amount:45,date:shift(t,3),recurring:'Monthly',category:'Home',isSample:true}),freshRecord('Bills','Electricity',{amount:82,date:shift(t,6),recurring:'Monthly',category:'Home',isSample:true}));let meal=records('Meals')[0];if(meal){meal.recipeId=recipe.id;meal.servings=4;meal.mealSlot='Dinner'}for(const r of records('Chores'))r.points=5;for(const r of records('Routines'))r.target=r.title==='Drink water'?8:1;for(const r of records('Goals'))r.subtasks='Choose a destination\nSet a spending target\nSave a little each week';}
normalizeState();seedStudio();
if(S.view){const v=S.view,valid=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d+'T12:00:00'));if(valid(v.weekStart))weekStart=v.weekStart;if(valid(v.calDate))calDate=v.calDate;if(['Month','Week','Agenda'].includes(v.calView))calView=v.calView;if(valid(v.reportFrom)&&valid(v.reportTo)&&v.reportFrom<=v.reportTo){reportFrom=v.reportFrom;reportTo=v.reportTo}if(['7 days','30 days','This month','Custom'].includes(v.reportMode))reportMode=v.reportMode}
const storedFilter=S.filters[S.page]||{};query=storedFilter.query||'';filter=storedFilter.filter||'All';sort=storedFilter.sort||'date';
$('#modal').setAttribute('aria-labelledby','modalTitle');
const shade=document.createElement('div');shade.className='sidebar-shade';shade.onclick=()=>document.body.classList.remove('drawer');document.body.append(shade);
render();if(!recovery)persist();setInterval(clock,30000);setInterval(timerTick,1000);window.addEventListener('pagehide',saveNow);

</script><style id="demo-readonly-style">
#demoReadOnlyNotice{position:sticky;top:0;z-index:999999;background:#203f35;color:#fff;text-align:center;padding:10px 14px;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.2px;box-shadow:0 2px 10px #0002}
#demoReadOnlyNotice span{opacity:.85;font-weight:400}
input[readonly],textarea[readonly],select:disabled{opacity:.72!important;cursor:not-allowed!important}
.demo-action-blocked{opacity:.55!important;cursor:not-allowed!important}
</style>
<script id="demo-readonly-guard">
(()=> {
 const blocked=/^(save|save changes|delete|remove|clear all|reset|restore|import|export|download|upload|submit|confirm|add new|create new|duplicate|back up|backup)$/i;
 const lock=()=>{
  document.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]),textarea').forEach(el=>{el.readOnly=true;el.setAttribute('aria-readonly','true')});
  document.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(el=>{el.disabled=true;el.setAttribute('aria-disabled','true')});
  document.querySelectorAll('[contenteditable="true"],[contenteditable=""]').forEach(el=>{el.contentEditable='false'});
  document.querySelectorAll('button').forEach(el=>{
   const label=(el.innerText||el.getAttribute('aria-label')||el.title||'').trim().replace(/\s+/g,' ');
   if(blocked.test(label)){el.classList.add('demo-action-blocked');el.setAttribute('aria-disabled','true');}
   else {el.disabled=false;el.removeAttribute('aria-disabled');}
  });
  document.querySelectorAll('a[download]').forEach(el=>{el.removeAttribute('download');el.setAttribute('aria-disabled','true')});
 };
 const addNotice=()=>{
  if(document.getElementById('demoReadOnlyNotice'))return;
  const n=document.createElement('div');n.id='demoReadOnlyNotice';
  n.innerHTML='INTERACTIVE PREVIEW <span>— explore tabs, menus and sections; data entry and saving are disabled</span>';
  document.body.insertBefore(n,document.body.firstChild);
 };
 const start=()=>{
  addNotice();lock();
  new MutationObserver(()=>lock()).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['disabled','contenteditable','readonly']});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
 document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  const label=(b.innerText||b.getAttribute('aria-label')||b.title||'').trim().replace(/\s+/g,' ');
  if(blocked.test(label)){e.preventDefault();e.stopImmediatePropagation();}
 },true);
 document.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
 document.addEventListener('beforeinput',e=>{
  if(e.target.matches('input:not([type="button"]):not([type="submit"]),textarea,[contenteditable="true"]')){e.preventDefault();e.stopImmediatePropagation()}
 },true);
})();
</script></body></html>
