function newState(){return {version:1,settings:structuredClone(defaults),records:[],page:'Dashboard',sampleNotice:true,filters:{}}}
S=newState();function sample(){const today=dateKey(), rec=(type,title,extra={})=>({id:uid(),type,title,date:today,status:'Pending',priority:'Medium',category:'Family',assignee:'Alex',notes:'',tags:'',amount:0,target:100,progress:0,checks:[],frequency:'Daily',isSample:true,...extra});return [rec('Tasks','Prepare school bags',{priority:'High',subtasks:'Pack lunch\nCheck homework'}),rec('Tasks','Book a little time for yourself',{category:'Personal'}),rec('Family Schedule','School pick-up',{time:'15:00',assignee:'Sam'}),rec('Appointments','Family check-up',{date:shift(today,2),time:'10:30',category:'Health'}),rec('Kids','Riley’s reading log',{notes:'Read together for 15 minutes.'}),rec('Meals','Lemon chicken & roasted vegetables',{notes:'Dinner • serves 4',category:'Home'}),rec('Grocery List','Fresh fruit',{amount:12,notes:'Apples, bananas and berries'}),rec('Chores','Refresh the kitchen',{assignee:'Sam'}),rec('Home Care','Check smoke alarms',{date:shift(today,5)}),rec('Self-Care','A quiet walk',{time:'17:30',notes:'20 minutes outside.'}),rec('Important Contacts','Family clinic',{notes:'Example contact — replace with your own details.'}),rec('Goals','A family weekend away',{target:1000,progress:350,amount:350,date:shift(today,60),notes:'Save a little each week.'}),rec('Notes','Little things to remember',{notes:'A slow morning counts as a good morning.',pinned:true,color:'#e8e1f4'}),rec('Routines','Drink water',{target:8,checks:[today],frequency:'Daily',notes:'Keep a bottle nearby.'}),rec('Routines','Evening reading',{target:1,checks:[],frequency:'Daily'}),...Array.from({length:14},(_,i)=>rec('Budget',i%3?'Household essentials':'Monthly income',{date:shift(today,-i*2),amount:i%3?35+i*9:700+i*20,flow:i%3?'Expense':'Income',category:i%2?'Food':'Home'})),...Array.from({length:5},(_,i)=>rec('Tasks','Completed sample task '+(i+1),{date:shift(today,-i),status:'Done',completedDate:shift(today,-i)}))]}

gs.order)||v.settings.order.some(x=>!modules.includes(x))))throw Error('Invalid module order');return true}

function applyStyle(){let a=S.settings;document.body.classList.toggle('dark',!!a.dark);for(const k of ['accent','peach','lilac'])if(/^#[0-9a-f]{6}$/i.test(a[k]))document.documentElement.style.setProperty('--'+k,a[k]);document.documentElement.style.fontSize=Math.max(13,Math.min(20,+a.scale||15))+'px';document.documentElement.style.setProperty('--radius',Math.max(0,Math.min(30,+a.radius||0))+'px');$('#brand').textContent=a.title;document.title=a.title+' • Family Planner'}

function dashboard(){const today=dateKey(),tasks=records('Tasks').filter(r=>r.date===today),routines=records('Routines'),events=S.records.filter(r=>['Family Schedule','Appointments'].includes(r.type)&&r.date>=today).sort((a,b)=>a.date.localeCompare(b.date)),t=totals();return `${recovery?`<div class="banner">${esc(recovery)}</div>`:''}${S.sampleNotice&&S.records.some(r=>r.isSample)?'<div class="banner flex">You’re exploring a sample family. Full features are available in the purchased planner.<button class="right" onclick="S.sampleNotice=false;persist();render()">Dismiss</button></div>':''}<section class="hero"><div class="eyebrow">A FRESH LITTLE START</div><h1 id="greeting">Hello, lovely day.</h1><p>${esc(S.settings.subtitle)} Your plans, people and everyday moments — together in one calm space.</p><div class="flex"><button class="primary" onclick="go('Today')">Plan my day →</button><button onclick="go('Calendar')">View calendar</button></div></section><div class="grid">${S.settings.cards.includes('Tasks')?metric('Today’s tasks',`${tasks.filter(done).length} / ${tasks.length}`,'A little progress goes a long way.','Tasks'):''}${S.settings.cards.includes('Routines')?metric('Daily rituals',`${routines.filter(r=>(r.checks||[]).includes(today)).length} / ${routines.length}`,'Small habits, brighter days.','Routines'):''}${S.settings.cards.includes('Budget')?metric('Household balance',money(t.income-t.expense),'Income minus spending · last '+reportDays+' days','Budget'):''}${S.settings.cards.includes('Goals')?metric('Dreams in motion',records('Goals').filter(r=>r.status!=='Done').length,'Build something to look forward to.','Goals'):''}<section class="card span8"><div class="flex"><h2>Today’s little priorities</h2><button class="right" onclick="edit(null,'Tasks')">＋ Task</button></div>${rows(tasks.sort((a,b)=>(a.priority==='High'?-1:1)),true)}</section><section class="card span4" style="background:var(--peach)"><div class="eyebrow">AROUND THE TABLE</div><h2 style="margin-t function metric(title,value,sub,type){return `<section class="card span3"><div class="eyebrow">${title}</div><div class="metric">${value}</div><small>${sub}</small><div><button onclick="go('${type}')" style="margin-top:12px">Open ${type.toLowerCase()} →</button></div></section>`}
function rows(a,checks=false){if(!a.length)return '<div class="empty">A little room for something new.<br>Add your first plan whenever you’re ready.</div>';return a.map(r=>`<div class="row ${done(r)?'completed':''}">${checks?`<input class="check" type="checkbox" aria-label="Complete ${esc(r.title)}" ${done(r)?'checked':''} onchange="complete('${r.id}')">`:'<span class="dot"></span>'}<div class="body"><strong class="${done(r)?'done':''}">${esc(r.title)}</strong><br><small>${esc([r.date,r.time,r.assignee,r.category].filter(Boolean).join(' · '))}</small>${r.type==='Budget'?`<div>${r.flow==='Income'?'+':'−'} ${money(r.amount)}</div>`:''}${r.type==='Notes'?`<div class="muted">${esc((r.notes||'').slice(0,120))}</div>`:''}</div><button onclick="edit('${r.id}')" aria-label="Edit ${esc(r.title)}">↗</button></div>`).join('')}
function todayPage(){const t=dateKey();return heading('A day with a little more ease',t)+`<div class="grid"><section class="card span8"><h2>Today’s to-do list</h2>${rows(S.records.filter(r=>r.date===t&&['Tasks','Chores','Home Care','Grocery List'].includes(r.type)),true)}</section><section class="card span4"><h2>Your daily rituals</h2>${habitCards()}</section><section class="card span6"><h2>Your appointments & plans</h2>${rows(S.records.filter(r=>r.date===t&&['Family Schedule','Appointments','Self-Care'].includes(r.type)))}</section><section class="card span6"><h2>On the menu</h2>${rows(records('Meals').filter(r=>r.date===t))}</section></div>`}
function listPage(type){let a=records(type).filter(r=>(!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase()))&&(filter==='All'||r.status===filter));a.sort((a,b)=>sort==='title'?a.title.localeCompare(b.title):sort==='priority'?(['High','Medium','Low'].indexOf(a.priority)-['High','Medium','Low'].indexOf(b.priority)):(a.date||'9999').localeCompare(b.date||'9999'));return heading(label(type))+`<div class="toolbar flex"><input aria-label="Search ${type}" placeholder="Search this section…" value="${esc(query)}" onchange="query=this.value;render()"><select aria-label="Filter status" onchange="filter=this.value;render()">${['All','Pending','In progress','Done'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Sort" onchange="sort=this.value;render()">${['date','title','priority'].map(x=>`<option ${sort===x?'selected':''}>${x}</option>`).join('')}</select><button onclick="csv('${type}')">Export CSV</button>${['Tasks','Chores','Grocery List'].includes(type)?`<button onclick="bulk('${type}')">Complete visible</button>`:''}</div>${type==='Routines'?`<div class="grid">${habitCards(a,true)}</div>`:type==='Goals'?`<div class="grid">${goalCards(a,true)}</div>`:`<section class="card">${rows(a,['Tasks','Chores','Home Care','Grocery List'].includes(type))}</section>`}`}
function streak(r){const c=new Set(r.checks||[]);let d=dateKey(),n=0;if(!c.has(d))d=shift(d,-1);while(c.has(d)&&n<40000){n++;d=shift(d,-1)}return n}
function habitCards(a=records('Routines'),grid=false){return a.length?a.map(r=>{const checks=r.checks||[],t=dateKey();return `<section class="${grid?'card span4':''}" style="margin-bottom:15px"><div class="flex"><strong>${esc(r.title)}</strong><button class="right" onclick="edit('${r.id}')">Edit</button></div><small>${r.frequency==='Weekly'?'Weekly target':'Daily target'}: ${r.target||1} · ${streak(r)} day streak</small><div class="flex" style="margin:12px 0">${Array.from({length:7},(_,i)=>{let d=shift(t,i-6);return `<button title="${d}" aria-label="Check in for ${d}" style="padding:7px;min-width:32px;${checks.includes(d)?'background:var(--soft)':''}" onclick="checkHabit('${r.id}','${d}')">${checks.includes(d)?'✓':d.slice(-2)}</button>`}).join('')}</div><small>${checks.filter(d=>d>=shift(t,-29)&&d<=t).length} check-ins in 30 days · ${r.frequency==='Weekly'?'History tracks days checked in.':'Check in once when your daily target is met.'}</small></section>`}).join(''):'<div class="empty">Add a ritual you want to make room for.</div>'}
function goalCards(a=records('Goals'),grid=false){return a.length?a.map(r=>{const p=Math.min(100,Math.max(0,100*(r.progress||0)/(r.target||1)));return `<section class="${grid?'card span4':''}" style="margin-bottom:18px"><div class="flex"><strong>${esc(r.title)}</strong><button class="right" onclick="edit('${r.id}')">Edit</button></div><small>${r.progress||0} of ${r.target||100} · ${p.toFixed(0)}%</small><progress max="100" value="${p}" aria-label="Goal progress">${p}%</progress><small>Due ${esc(r.date||'whenever you’re ready')}</small></section>`}).join(''):'<div class="empty">Your next dream starts here.</div>'}
function complete(id){commit(()=>{let r=S.records.find(x=>x.id===id);r.status=done(r)?'Pending':'Done';r.completedDate=done(r)?dateKey():'';if(done(r)&&r.recurring&&r.recurring!=='None'){const next=structuredClone(r);next.id=uid();next.isSample=false;next.status='Pending';next.completedDate='';next.date=shift(r.date||dateKey(),r.recurring==='Daily'?1:r.recurring==='Weekly'?7:30);S.records.push(next)}},'Status updated')}
function checkHabit(id,d){commit(()=>{let r=S.records.find(x=>x.id===id);r.checks??=[];r.checks=r.checks.includes(d)?r.checks.filter(x=>x!==d):[...r.checks,d]},'Ritual updated')}
function bulk(type){commit(()=>{for(const r of records(type))if((filter==='All'||r.status===filter)&&(!query||JSON.stringify(r).toLowerCase().includes(query.toLowerCase()))){r.status='Done';r.completedDate=dateKey()}},'Visible records completed')}
// Modal editing uses escaped attributes and plain-text storage.
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();setTimeout(()=>$('#modalBody').querySelector('input,select,button')?.focus(),0)}function closeModal(){$('#modal').close()}
function field(name,title,value='',type='text',extra=''){return `<label>${title}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}
function select(name,title,options,value){return `<label>${title}<select name="${name}">${options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function edit(){toast('Demo preview: this feature is available in the purchased planner.')}
function duplicate(id){commit(()=>{const r=structuredClone(S.records.find(x=>x.id===id));r.id=uid();r.title+=' (copy)';r.isSample=false;S.records.push(r)},'Copied');closeModal()}function removeRecord(id){if(confirm('Delete this plan? You can undo immediately afterward.')){commit(()=>S.records=S.records.filter(r=>r.id!==id),'Plan deleted');closeModal()}}
function searchAll(v){if(!v.trim())return;const a=S.records.filter(r=>[r.title,r.notes,r.tags,r.assignee].join(' ').toLowerCase().includes(v.toLowerCase())).slice(0,40);openModal('Find a little something',a.length?a.map(r=>`<div class="row"><div class="body"><span class="badge">${esc(r.type)}</span><br>${esc(r.title)}</div><button onclick="edit('${r.id}')">Open</button></div>`).join(''):'<p>No matching plans yet.</p>');$('#globalSearch').value=''}
// Calendar: month, week and agenda, with task due dates.
function calendar(){const d=new Date(calDate+'T12:00:00'),today=dateKey(),include=['Tasks','Family Schedule','Appointments','Meals','Self-Care','Chores','Home Care','Goals'];let a=S.records.filter(r=>include.includes(r.type)&&r.date&&(!query||(r.category||'').toLowerCase().includes(query.toLowerCase())));let body='';if(calView==='Agenda')body=rows(a.filter(r=>r.date.slice(0,7)===calDate.slice(0,7)).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))));else {let start=new Date(d);if(calView==='Month')start.setDate(1);let offset=(start.getDay()-S.settings.firstDay+7)%7;start.setDate(start.getDate()-offset);let n=calView==='Week'?7:42;body=`<div class="calendar">${Array.from({length:7},(_,i)=>`<div class="weekhead">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][(i+S.settings.firstDay)%7]}</div>`).join('')}${Array.from({length:n},(_,i)=>{let dt=new Date(start);dt.setDate(dt.getDate()+i);let key=localDay(dt);return `<div class="day ${key===today?'today':''}"><div class="flex daynum">${dt.getDate()}<button class="right" aria-label="Add plan on ${key}" onclick="edit(null,'Family Schedule','${key}')">＋</button></div>${a.filter(r=>r.date===key).map(r=>`<button onclick="edit('${r.id}')">${esc((r.time||'')+' '+r.title)}</button>`).join('')}</div>`}).join('')}</div>`}return heading('All your days, together')+`<div class="toolbar flex"><button onclick="moveCal(-1)">← Previous</button><h2 style="margin:0">${d.toLocaleDateString('en',{month:'long',year:'numeric',...(calView==='Week'?{day:'numeric'}:{})})}</h2><button onclick="moveCal(1)">Next →</button><button onclick="calDate=dateKey();render()">Today</button><select aria-label="Calendar view" onchange="calView=this.value;render()">${['Month','Week','Agenda'].map(x=>`<option ${calView===x?'selected':''}>${x}</option>`).join('')}</select><input aria-label="Filter calendar by category" placeholder="Filter category…" value="${esc(query)}" onchange="query=this.value;render()"></div><section class="card">${body}</section>`}
function moveCal(n){let d=new Date(calDate+'T12:00:00');if(calView==='Week')d.setDate(d.getDate()+7*n);else{d.setDate(1);d.setMonth(d.getMonth()+n)}calDate=localDay(d);render()}
// Inline SVG charts use the same records as reports.
function chartData(){let end=dateKey(),out=[];for(let i=5;i>=0;i--){let start=shift(end,-(i+1)*5+1),stop=shift(end,-i*5),a=records('Budget').filter(r=>r.date>=start&&r.date<=stop);out.push({label:start.slice(5),...totals(a)})}return out}
function barChart(){let a=chartData(),max=Math.max(1,...a.flatMap(x=>[x.income,x.expense]));return `<svg viewBox="0 0 480 180" role="img" aria-label="Income and expenses over six five-day periods">${a.map((v,i)=>`<rect x="${30+i*76}" y="${140-v.income/max*110}" width="19" height="${v.income/max*110}" rx="4" fill="var(--accent)"><title>${v.label} income: ${money(v.income)}</title></rect><rect x="${52+i*76}" y="${140-v.expense/max*110}" width="19" height="${v.expense/max*110}" rx="4" fill="#d6a781"><title>Expenses: ${money(v.expense)}</title></rect><text x="${30+i*76}" y="164" font-size="12" fill="var(--muted)">${v.label}</text>`).join('')}</svg><div class="legend"><span>● Income</span><span style="color:#a9764e">● Expenses</span><span>5-day periods · latest 30 days</span></div>`}
function donutChart(){let a=rangeRecords().filter(r=>r.flow!=='Income'),cat={};for(const r of a)cat[r.category||'Other']=(cat[r.category||'Other']||0)+r.amount;let entries=Object.entries(cat),total=sum(a),colors=['#377c69','#d6a781','#9a88b7','#91b5a1','#b4a378'];let offset=0;return `<div class="flex"><svg viewBox="0 0 180 180" width="180" role="img" aria-label="Expenses by category"><circle cx="90" cy="90" r="62" fill="none" stroke="var(--line)" stroke-width="22"/>${entries.map(([k,v],i)=>{let len=total?v/total*389.56:0,s=`<circle cx="90" cy="90" r="62" fill="none" stroke="${colors[i%5]}" stroke-width="22" stroke-dasharray="${len} ${389.56-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 90 90)"><title>${esc(k)}: ${money(v)}</title></circle>`;offset+=len;return s}).join('')}<text x="90" y="87" text-anchor="middle" font-size="19" fill="var(--ink)">${esc(money(total))}</text><text x="90" y="108" text-anchor="middle" font-size="11" fill="var(--muted)">total spent</text></svg><div>${entries.length?entries.map(([k,v],i)=>`<div style="margin:7px 0"><span style="color:${colors[i%5]}">●</span> ${esc(k)} <strong>${money(v)}</strong></div>`).join(''):'<p>No expenses in this range.</p>'}</div></div>`}
function lineChart(){const points=Array.from({length:7},(_,i)=>{let d=shift(dateKey(),i-6);return {d,n:records('Tasks').filter(r=>done(r)&&r.completedDate===d).length}}),max=Math.max(1,...points.map(x=>x.n));return `<svg viewBox="0 0 480 150" role="img" aria-label="Completed tasks over seven days"><polyline fill="none" stroke="var(--accent)" stroke-width="3" points="${points.map((x,i)=>`${20+i*72},${110-x.n/max*80}`).join(' ')}"/>${points.map((x,i)=>`<circle cx="${20+i*72}" cy="${110-x.n/max*80}" r="5" fill="var(--accent)"/><text x="${20+i*72}" y="135" text-anchor="middle" font-size="11" fill="var(--muted)">${x.d.slice(5)}</text><text x="${20+i*72}" y="${99-x.n/max*80}" text-anchor="middle" font-size="12" fill="var(--ink)">${x.n}</text>`).join('')}</svg>`}
function reports(){let t=totals();return heading('A clearer picture of your days')+`<div class="toolbar flex"><label>Financial date range<select onchange="reportDays=+this.value;render()">${[7,30,90,365].map(n=>`<option value="${n}" ${n===reportDays?'selected':''}>Last ${n} days</option>`).join('')}</select></label><button onclick="csv('Budget')">Export budget CSV</button></div><div class="grid">${metric('Money in',money(t.income),'Total income in selected range','Budget')}${metric('Money out',money(t.expense),'Total expenses in selected range','Budget')}${metric('Available',money(t.income-t.expense),'Income minus expenses','Budget')}${metric('Tasks completed',records('Tasks').filter(done).length,'All-time completed tasks','Tasks')}<section class="card span6"><h2>Income & expenses · 30 days</h2>${barChart()}<details><summary>View chart values</summary>${chartData().map(x=>`<p>${x.label}: income ${money(x.income)}, expenses ${money(x.expense)}</p>`).join('')}</details></section><section class="card span6"><h2>Spending · selected range</h2>${donutChart()}</section><section class="card span12"><h2>Your seven-day task rhythm</h2>${lineChart()}<p>Each point counts tasks with a completion date on that day.</p></section></div>`}
// Settings, safe backups and printable summaries.
function settings(){const a=S.settings;return heading('Make yourself at home')+`<div class="settings"><section class="card"><h2>Your planner, your way</h2><form id="settingsForm"><div class="fields">${field('title','Planner title',a.title,'text','required maxlength="50"')}${field('subtitle','Welcome message',a.subtitle)}${field('accent','Main accent',a.accent,'color')}${field('peach','Supporting peach',a.peach,'color')}${field('lilac','Supporting lavender',a.lilac,'color')}${field('scale','Font size',a.scale,'number','min="13" max="20"')}${field('radius','Corner roundness',a.radius,'number','min="0" max="30"')}${field('density','Card spacing',a.density,'number','min="12" max="32"')}${field('zone','Time zone (IANA)',a.zone,'text','required')}${select('currency','Currency',['USD','GBP','EUR','PKR','INR','CAD','AUD','AED'],a.currency)}${select('firstDay','Week starts on',['Monday','Sunday'],a.firstDay===1?'Monday':'Sunday')}${select('dateFormat','Date format',['en-GB','en-US'],a.dateFormat)}${select('hour24','Clock format',['12 hour','24 hour'],a.hour24?'24 hour':'12 hour')}${field('members','Family members (comma separated)',a.members)}${field('categories','Categories (comma separated)',a.categories)}</div><p class="badge">Live palette preview</p><div id="stylePreview" style="padding:20px;border-radius:16px;background:${esc(a.accent)};color:white">A little space for your life.</div><div class="toolbar"><button class="primary">Save preferences</button> <button type="button" onclick="resetAppearance()">Reset appearance</button></div></form></section><section class="card"><h2>Your dashboard cards</h2><div class="flex">${['Tasks','Routines','Budget','Goals'].map(x=>`<label style="flex-direction:row"><input type="checkbox" ${a.cards.includes(x)?'checked':''} onchange="cardToggle('${x}',this.checked)">${x}</label>`).join('')}</div></section><section class="card"><h2>Organize your sections</h2><p>Rename, hide or move optional sections. Core planning pages stay available.</p>${a.order.filter(x=>!['Dashboard','Today','Calendar','Reports','Settings'].includes(x)).map(x=>`<div class="row"><label style="flex-direction:row"><input type="checkbox" ${a.hidden.includes(x)?'':'checked'} onchange="moduleToggle('${x}',this.checked)" aria-label="Show ${x}"></label><input style="width:100%;min-width:0" aria-label="Rename ${x}" value="${esc(label(x))}" onchange="S.settings.labels['${x}']=this.value.trim()||'${x}';persist();render()"><button onclick="moveModule('${x}',-1)" aria-label="Move ${x} up">↑</button><button onclick="moveModule('${x}',1)" aria-label="Move ${x} down">↓</button></div>`).join('')}</section><section class="card"><h2>Data & backup</h2><p>Private by design: data stays in this browser. There is no automatic device sync. Export regular backups, especially before moving this HTML file or clearing browser data.</p><div class="flex"><button onclick="download('mintnest-backup-'+dateKey()+'.json',JSON.stringify(S,null,2),'application/json')">Export full backup</button><label>Import JSON<input type="file" accept=".json,application/json" onchange="importBackup(this.files[0])"></label><button onclick="clearSamples()">Clear sample data</button><button onclick="resetSettings()">Restore default settings</button><button onclick="resetPlanner()">Reset planner</button></div></section><section class="card help"><h2>A little help getting started</h2><p>1. Clear sample data when you’re ready.<br>2. Add family members and choose your time zone above.<br>3. Use Quick add to create plans in any section.<br>4. Export a backup regularly. Use Print → Save as PDF for paper plans.</p><p>Shortcuts outside text fields: Q add · / search · Esc close. Ctrl/⌘ + P opens the print panel; Ctrl/⌘ + S saves a backup.</p><p>Recurring tasks generate the next occurrence when completed. “Every 30 days” uses a fixed 30-day interval. Routine check-ins record the days you meet your target; streaks count consecutive checked days.</p></section><section class="card"><h2>Developer checks</h2><p>Safe tests run on temporary copies. Your records are never changed.</p><button onclick="selfTest()">Run Self-Test</button><div id="tests"></div></section></div>`}
function bind(){const form=$('#settingsForm');if(form){form.elements.accent.oninput=e=>$('#stylePreview').style.background=e.target.value;form.onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form));try{new Intl.DateTimeFormat('en',{timeZone:f.zone})}catch{toast('Use a valid time zone, for example Europe/London or Asia/Karachi.');return}Object.assign(S.settings,f,{firstDay:f.firstDay==='Monday'?1:0,hour24:f.hour24==='24 hour',scale:+f.scale,radius:+f.radius,density:+f.density});persist();render();toast('Your preferences are saved.')}}}
function cardToggle(x,v){S.settings.cards=v?[...new Set([...S.settings.cards,x])]:S.settings.cards.filter(k=>k!==x);persist()}
function moduleToggle(x,v){S.settings.hidden=v?S.settings.hidden.filter(k=>k!==x):[...new Set([...S.settings.hidden,x])];persist();render()}
function moveModule(x,n){let a=S.settings.order,i=a.indexOf(x),j=i+n;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];persist();render()}}
function resetAppearance(){for(let k of ['accent','peach','lilac','scale','radius','density','dark'])S.settings[k]=defaults[k];persist();render();toast('Appearance restored.')}
function resetSettings(){if(confirm('Restore default preferences? Your plans will stay.')){S.settings=structuredClone(defaults);persist();render()}}
function clearSamples(){if(confirm('Remove only the sample records? Your own records will stay.'))commit(()=>{S.records=S.records.filter(r=>!r.isSample);S.sampleNotice=false},'Sample records removed')}
function resetPlanner(){if(prompt('This removes all planner data. Type RESET to continue.')==='RESET'){S=newState();S.sampleNotice=false;recovery='';persist();render();toast('Planner reset.')}}
function download(){toast('Demo preview: this feature is available in the purchased planner.')}
function csv(){toast('Demo preview: this feature is available in the purchased planner.')}
function importBackup(){toast('Demo preview: this feature is available in the purchased planner.')}
function printPanel(){toast('Demo preview: this feature is available in the purchased planner.')}
function selfTest(){const tests=[];function test(name,fn){try{if(!fn())throw Error('Unexpected result');tests.push([name,true,''])}catch(e){tests.push([name,false,e.message])}}let copy=newState();test('State creation',()=>copy.version===1&&copy.records.length===0);test('Add, edit, delete',()=>{copy.records.push({id:'test',title:'A',type:'Tasks'});copy.records[0].title='B';let ok=copy.records[0].title==='B';copy.records=[];return ok&&copy.records.length===0});test('Income and spending totals',()=>{let v=totals([{flow:'Income',amount:20},{flow:'Expense',amount:8}]);return v.income-v.expense===12});test('Leap day date calculation',()=>shift('2024-02-28',1)==='2024-02-29'&&shift('2024-12-31',1)==='2025-01-01');test('Routine streak',()=>streak({checks:[dateKey(),shift(dateKey(),-1)]})===2);test('Serialization',()=>JSON.parse(JSON.stringify(copy)).version===1);test('Import validation',()=>validate(copy));test('Reject invalid import',()=>{try{validate({version:9});return false}catch{return true}});test('Reject duplicate IDs',()=>{let c=structuredClone(copy);c.records=[{id:'x',title:'A',type:'Tasks'},{id:'x',title:'B',type:'Tasks'}];try{validate(c);return false}catch{return true}});test('Theme isolation',()=>{let c=structuredClone(S);c.settings.dark=!S.settings.dark;return c.settings.dark!==S.settings.dark});test('Chart series',()=>chartData().length===6&&chartData().every(x=>Number.isFinite(x.income)));test('Required controls',()=>!!$('#nav')&&!!$('#modal')&&!!$('#globalSearch')&&!!$('#settingsForm'));$('#tests').innerHTML=tests.map(([n,ok,msg])=>`<p>${ok?'✓ Passed':'✕ Failed'} — ${esc(n)} ${esc(msg)}</p>`).join('');return tests}
function clock(){const now=new Date();$('#clock').textContent=now.toLocaleDateString(S.settings.dateFormat,{timeZone:S.settings.zone,weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · '+now.toLocaleTimeString('en',{timeZone:S.settings.zone,hour:'2-digit',minute:'2-digit',hour12:!S.settings.hour24});const g=$('#greeting');if(g){let hour=+new Intl.DateTimeFormat('en-GB',{timeZone:S.settings.zone,hour:'numeric',hourCycle:'h23'}).format(now);g.textContent=hour<12?'Good morning, lovely.':hour<18?'A little afternoon reset.':'Let’s make room for a softer evening.'}}
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();download('mintnest-backup-'+dateKey()+'.json',JSON.stringify(S,null,2),'application/json')}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){e.preventDefault();printPanel()}if(typing||e.ctrlKey||e.metaKey)return;if(e.key.toLowerCase()==='q'){e.preventDefault();edit()}if(e.key==='/'){e.preventDefault();$('#globalSearch').focus()}});
if(!S.settings.splitThemeVersion){S.settings.dark=false;S.settings.splitThemeVersion=1;}
if(!modules.includes(S.page))S.page='Dashboard';S.settings.order=[...new Set([...(Array.isArray(S.settings.order)?S.settings.order:[]),...modules])];render();if(!recovery)persist();setInterval(clock,30000);
</script><style id="demo-readonly-style">

#demoReadOnlyNotice span{opacity:.85;font-weight:400}
input[readonly],textarea[readonly],select:disabled{opacity:.72!important;cursor:not-allowed!important}

</style>
<script id="demo-readonly-guard">
(()=> {
 const lock=()=>{
  document.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]),textarea').forEach(el=>{el.readOnly=true;el.setAttribute('aria-readonly','true')});
  document.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(el=>{el.disabled=true;el.setAttribute('aria-disabled','true')});
  document.querySelectorAll('[contenteditable="true"],[contenteditable=""]').forEach(el=>{el.contentEditable='false'});
  document.querySelectorAll('button').forEach(el=>{el.disabled=false;el.classList.remove('demo-action-blocked');el.removeAttribute('aria-disabled')});
  document.querySelectorAll('a[download]').forEach(el=>{el.removeAttribute('download');el.setAttribute('aria-disabled','true')});
 };
 const addNotice=()=>{
  if(document.getElementById('demoReadOnlyNotice'))return;
  const n=document.createElement('div');n.id='demoReadOnlyNotice';
  n.innerHTML='INTERACTIVE PREVIEW <span>— click through every section, tab and viewing control; typing and saving are disabled</span>';
  document.body.insertBefore(n,document.body.firstChild);
 };
 const start=()=>{
  addNotice();lock();
  new MutationObserver(()=>lock()).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['disabled','contenteditable','readonly']});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
 document.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
 document.addEventListener('beforeinput',e=>{

 },true);
})();
