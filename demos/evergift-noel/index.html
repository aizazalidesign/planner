<script>
'use strict';
const KEY='evergift-studio-v1';
const uid=()=> 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const year=()=>new Date().getFullYear();
const makeSeason=(name=`Christmas ${year()}`,date=`${year()}-12-25`)=>({id:uid(),name,date,budget:1000,currency:'$',archived:false,recipients:[],gifts:[],ideas:[],from:''});
function fresh(){let s=makeSeason();return{app:'evergift',version:1,theme:'light',active:s.id,seasons:[s]}}
let db=fresh(),storageOK=true,loadError=false;

let page='Dashboard',filters={q:'',recipient:'',status:'',sort:'newest'},toastTimer;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const s=()=>db.seasons.find(x=>x.id===db.active)||db.seasons[0];
const sum=(arr,fn)=>arr.reduce((n,x)=>n+fn(x),0),round=x=>Math.round((x+Number.EPSILON)*100)/100;
const cost=g=>round(Math.max(0,g.price+g.tax+g.shipping-g.discount));
const money=n=>`${esc(s().currency)}${Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const recipient=id=>s().recipients.find(r=>r.id===id),rname=id=>recipient(id)?.name||'Unassigned';
const dateLabel=d=>d?new Date(d+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'No date';
const days=d=>Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000);
const link=url=>{try{let u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};
const external=(url,label)=>link(url)?`<a href="${esc(link(url))}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`:'';
function notify(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;$('saveStatus').textContent='Saved on this device'}catch{storageOK=false;$('saveStatus').textContent='Not saved — export backup';notify('Browser storage unavailable. Export a JSON backup before closing.')}}
function go(p){page=p;filters={q:'',recipient:'',status:'',sort:'newest'};render()}
function changeSeason(id){db.active=id;save();go('Dashboard')}
function toggleTheme(){db.theme=db.theme==='dark'?'light':'dark';save();render()}
function render(){document.body.classList.toggle('dark',db.theme==='dark');$('seasonSelect').innerHTML=db.seasons.map(x=>`<option value="${x.id}" ${x.id===db.active?'selected':''}>${esc(x.name)}${x.archived?' · Archived':''}</option>`).join('');$('printSeason').textContent=s().name;let nav=[['Dashboard','◈'],['Gifts','♧'],['Recipients','♡'],['Idea Bank','✧'],['Shopping','▤'],['Deliveries','↗'],['Gift Tags','◇'],['Seasons','◷'],['Settings','⚙'],['Help','?']];document.querySelector('.nav').innerHTML=nav.map(([p,i])=>`<button class="${p===page?'active':''}" onclick="go('${p}')" ${p===page?'aria-current="page"':''}><span>${i}</span>${p}</button>`).join('');let views={Dashboard:dashboard,Gifts:gifts,Recipients:recipients,'Idea Bank':ideas,Shopping:shopping,Deliveries:deliveries,'Gift Tags':tags,Seasons:seasons,Settings:settings,Help:help};$('content').innerHTML=(!storageOK?'<div class="notice warn">Local saving is unavailable or stored data could not be read. Export a backup before closing. Your previous stored data has not been overwritten.</div>':'')+(s().archived?'<div class="notice">Viewing an archived season. You can still edit it or restore it from Seasons.</div>':'')+views[page]();}
const empty=(title,sub,button='')=>`<div class="empty"><div class="symbol">✧</div><h3>${title}</h3><p>${sub}</p>${button}</div>`;

ae57"/><path d="M91 72Q109 94 138 88M75 115Q107 146 157 139" fill="none" stroke="#d9b75e" stroke-width="3"/><g fill="#b13939"><circle cx="111" cy="66" r="6"/><circle cx="85" cy="104" r="6"/><circle cx="137" cy="116" r="7"/><circle cx="112" cy="150" r="6"/></g><g fill="#e3c879"><circle cx="120" cy="102" r="4"/><circle cx="77" cy="146" r="4"/><circle cx="152" cy="154" r="4"/></g><path d="M106 164h12v18h-12Z" fill="#76513d"/><rect x="24" y="148" width="51" height="34" rx="3" fill="#ac3438"/><path d="M45 148h8v34M24 158h51" stroke="#e4c580" stroke-width="6"/><path d="M49 147Q21 125 28 144Q34 151 49 147Q73 124 70 141Q66 150 49 147" fill="none" stroke="#d5ae58" stroke-width="4"/><rect x="148" y="151" width="48" height="32" rx="3" fill="#dfc38a"/><path d="M167 151h8v32M148 160h48" stroke="#9d2f35" stroke-width="6"/><path d="M171 150Q151 130 152 145Q160 153 171 150Q191 129 190 143Q185 152 171 150" fill="none" stroke="#9d2f35" stroke-width="4"/></svg></div><div class="countdown"><strong>${Math.abs(n)}</strong><small>${n<0?'days since':n===0?'today is the day':'days to celebrate'}</small><div><small>${dateLabel(s().date)}</small></div></div></div><div class="grid stats">${[['Season budget',s().budget,'Your overall spending limit'],['Spent so far',t.spent,'Bought gifts • all costs included'],['Left to spend',s().budget-t.spent,'Budget minus purchased gifts'],['Forecast total',t.forecast,'Actual bought + planned unbought']].map(([l,v,d])=>`<div class="card stat"><label>${l}</label><strong class="money ${v<0||l==='Forecast total'&&v>s().budget?'warn':''}">${money(v)}</strong><small>${d}</small></div>`).join('')}</div>${t.forecast>s().budget?`<div class="notice warn">Your forecast is ${money(t.forecast-s().budget)} above your season budget. Review planned gifts before shopping.</div>`:''}<div class="grid split"><section class="card"><div class="section-head"><h2>A little closer to ready</h2><span class="badge">${t.count} gifts</span></div><div class="rings">${[['bought','Bought'],['wrapped','Wrapped'],['sent','Sent / given'],['delivered','Received']].map(([key,l])=>{let count=s().gifts.filter(g=>g[key]).length,p=t.count?Math.round(count/t.count*100):0;return `<div><div class="ring" style="--p:${p}"><b>${p}%</b></div><b class="ring-label">${l}</b><div><small>${count} of ${t.count}</small></div></div>`}).join('')}</div></section><section class="card"><h2>Next little steps</h2><div class="row"><p>Ready to buy</p><span class="badge">${s().gifts.filter(g=>!g.bought).length} gifts</span></div><div class="row"><p>Waiting to be wrapped</p><span class="badge">${s().gifts.filter(g=>g.bought&&!g.wrapped).length} gifts</span></div><div class="row"><p>Ready to send / give</p><span class="badge">${s().gifts.filter(g=>g.bought&&!g.sent).length} gifts</span></div><div class="card-actions"><button onclick="go('Shopping')">Open shopping list →</button><button onclick="window.print()">Print summary</button></div></section></div><div class="grid split"><section class="card"><div class="section-head"><h2>People, plans & budgets</h2><small><span class="swatch gold"></span>Cap <span class="swatch" style="background:var(--green)"></span>Spent</small></div>${s().recipients.length?s().recipients.map(r=>{let spent=sum(s().gifts.filter(g=>g.recipient===r.id&&g.bought),cost),max=Math.max(r.cap,spent,1);return `<div class="bars"><div class="bar-label"><b>${esc(r.name)}</b><span class="${spent>r.cap?'warn':''}">${money(spent)} / ${money(r.cap)}</span></div><div class="track"><div class="fill gold" style="width:${r.cap/max*100}%"></div></div><div class="track"><div class="fill" style="width:${spent/max*100}%"></div></div></div>`}).join(''):empty('Who is on your list?','Add your first recipient to get started.','<button onclick="editRecipient()">＋ Add recipient</button>')}<small>Recipient caps are separate allocations; the season budget controls your overall limit.</small></section><section class="card"><h2>Dates to keep in mind</h2>${pending.length?pending.map(g=>`<div class="row"><div><b>${esc(g.name)}</b><div><small>${esc(rname(g.recipient))} · ${dateLabel(g.due)}</small></div></div><span class="badge ${days(g.due)<0?'warn':''}">${days(g.due)<0?'Overdue':days(g.due)===0?'Today':days(g.due)+' days'}</span></div>`).join(''):empty('No upcoming delivery dates','Add a needed-by date to any gift.')}<div class="card-actions"><button onclick="go('Deliveries')">View deliveries →</button></div></section></div>${!t.count&&!s().recipients.length?`<section class="card"><h2>Your next tradition starts here.</h2><p class="muted">Create your own list, or explore a separate sample season first.</p><button class="primary" onclick="loadSample()">Explore sample season</button> <button onclick="go('Settings')">Set your budget & date</button></section>`:''}`}
function filterBar(){return `<div class="toolbar no-print"><input aria-label="Search gifts" placeholder="Search gift, person, category or store…" value="${esc(filters.q)}" oninput="filters.q=this.value;renderGiftRows()"><select aria-label="Filter recipient" onchange="filters.recipient=this.value;renderGiftRows()"><option value="">All recipients</option>${s().recipients.map(r=>`<option value="${r.id}" ${filters.recipient===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select><select aria-label="Filter status" onchange="filters.status=this.value;renderGiftRows()">${[['','All statuses'],['unbought','To buy'],['unwrapped','To wrap'],['unsent','To send / give'],['delivered','Received'],['over','Over budget'],['high','High priority']].map(([v,l])=>`<option value="${v}" ${filters.status===v?'selected':''}>${l}</option>`).join('')}</select><select aria-label="Sort gifts" onchange="filters.sort=this.value;renderGiftRows()"><option value="newest" ${filters.sort==='newest'?'selected':''}>Newest first</option><option value="recipient" ${filters.sort==='recipient'?'selected':''}>Recipient A–Z</option><option value="due" ${filters.sort==='due'?'selected':''}>Needed-by date</option><option value="cost" ${filters.sort==='cost'?'selected':''}>Highest actual cost</option></select></div>`}
function filtered(){let a=s().gifts.filter(g=>`${g.name} ${rname(g.recipient)} ${g.category} ${g.store}`.toLowerCase().includes(filters.q.toLowerCase())&&(!filters.recipient||g.recipient===filters.recipient)&&(!filters.status||({unbought:!g.bought,unwrapped:g.bought&&!g.wrapped,unsent:g.bought&&!g.sent,delivered:g.delivered,over:g.bought&&cost(g)>g.budget,high:g.priority==='High'})[filters.status]));return a.slice().sort((a,b)=>filters.sort==='recipient'?rname(a.recipient).localeCompare(rname(b.recipient)):filters.sort==='due'?(a.due||'9999').localeCompare(b.due||'9999'):filters.sort==='cost'?cost(b)-cost(a):s().gifts.indexOf(b)-s().gifts.indexOf(a))}
function gifts(){return heading('The gift list','From the first idea to the final ribbon.','<button onclick="exportCSV()">Export CSV</button><button class="primary" onclick="editGift()">＋ Add gift</button>')+filterBar()+`<div id="giftRows">${giftRows()}</div>`}
function renderGiftRows(){$('giftRows').innerHTML=giftRows()}
function giftRows(){let arr=filtered();return arr.length?`<div class="table-wrap"><table><thead><tr>${['Gift & recipient','Store','Budget','Actual¹','Difference¹','Bought','Wrapped','Sent / given','Received','Actions'].map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${arr.map(g=>`<tr><td><b>${esc(g.name)}</b><small>${esc(rname(g.recipient))} · ${esc(g.category)}${g.priority==='High'?' · ★ High':''}</small></td><td>${external(g.link,g.store||'View link')||esc(g.store)||'—'}</td><td>${money(g.budget)}</td><td>${g.bought?money(cost(g)):'—'}</td><td class="${g.bought&&cost(g)>g.budget?'warn':''}">${g.bought?money(g.budget-cost(g)):'—'}</td>${['bought','wrapped','sent','delivered'].map(k=>`<td><input type="checkbox" aria-label="${k} ${esc(g.name)}" ${g[k]?'checked':''} onchange="setFlag('${g.id}','${k}',this.checked)"></td>`).join('')}<td><button onclick="editGift('${g.id}')">Edit</button> <button onclick="duplicateGift('${g.id}')" aria-label="Duplicate ${esc(g.name)}">⧉</button></td></tr>`).join('')}</tbody></table></div><p><small>¹ Actual = item price + tax + shipping − discount. Only bought gifts count as spent. Difference = budget − actual.</small></p>`:empty('No gifts found','Add a gift or change your filters.','<button class="primary" onclick="editGift()">＋ Add gift</button>')}
function setFlag(id,k,value){let g=s().gifts.find(x=>x.id===id);g[k]=value;if(value&&['wrapped','sent','delivered'].includes(k))g.bought=true;if(k==='delivered'&&value)g.sent=true;if(k==='bought'&&!value)g.wrapped=g.sent=g.delivered=false;if(k==='sent'&&!value)g.delivered=false;save();if(page==='Gifts')renderGiftRows();else render()}
function duplicateGift(id){let g=s().gifts.find(x=>x.id===id);s().gifts.push({...g,id:uid(),name:g.name+' (copy)',bought:false,wrapped:false,sent:false,delivered:false,tracking:'',receipt:''});save();render();notify('Gift duplicated. Review its recipient and costs.')}
function openModal(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').showModal()}
function closeModal(){$('modal').close()}
function field(name,label,value='',type='text',extra=''){return `<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`}
function numberField(name,label,value=0){return field(name,label,value,'number','min="0" max="100000000" step="0.01" required')}
function selectField(name,label,options,value){return `<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(o=>{let [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`}).join('')}</select></div>`}
function notesField(name,label,value=''){return `<div class="field"><label for="f_${name}">${label}</label><textarea id="f_${name}" name="${name}" maxlength="3000">${esc(value)}</textarea></div>`}
function formButtons(type,id){return `<div class="modal-foot">${id?`<button type="button" class="danger" onclick="deleteItem('${type}','${id}')">Delete</button>`:''}<button type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save ${type}</button></div>`}
function blankGift(){return{id:uid(),name:'',recipient:'',category:'General',store:'',link:'',budget:0,price:0,tax:0,shipping:0,discount:0,priority:'Normal',method:'In person',due:'',returnBy:'',tracking:'',receipt:'',notes:'',bought:false,wrapped:false,sent:false,delivered:false}}
function editGift(id){let g=id?s().gifts.find(x=>x.id===id):blankGift();openModal(id?'Edit gift':'A thoughtful new gift',`<form id="giftForm">${field('name','Gift name',g.name,'text','required maxlength="160"')}<div class="twocol">${selectField('recipient','Recipient',[['','Unassigned'],...s().recipients.map(r=>[r.id,r.name])],g.recipient)}${field('category','Category',g.category,'text','maxlength="80"')}</div><div class="twocol">${field('store','Store',g.store,'text','maxlength="100"')}${field('link','Product link (https://)',g.link,'url')}</div><div class="twocol">${numberField('budget','Gift budget',g.budget)}${numberField('price','Item price',g.price)}${numberField('tax','Tax amount',g.tax)}${numberField('shipping','Shipping cost',g.shipping)}${numberField('discount','Discount amount',g.discount)}${selectField('priority','Priority',['Normal','High','Low'],g.priority)}</div><div class="notice" id="costPreview">Total actual: ${money(cost(g))}</div><div class="twocol">${selectField('method','Delivery method',['In person','Ship myself','Store delivery','Digital'],g.method)}${field('due','Needed-by date',g.due,'date')}${field('returnBy','Return deadline',g.returnBy,'date')}${field('tracking','Tracking link (https://)',g.tracking,'url')}</div>${field('receipt','Receipt link (optional)',g.receipt,'url')}<div class="checkrow">${['bought','wrapped','sent','delivered'].map(k=>`<label><input name="${k}" type="checkbox" ${g[k]?'checked':''}>${({sent:'Sent / given',delivered:'Received'})[k]||k[0].toUpperCase()+k.slice(1)}</label>`).join('')}</div>${notesField('notes','Notes · sizes, colours, hiding place',g.notes)}<small>Shipping address is stored on the recipient card. Links open online; no receipt files are uploaded.</small>${formButtons('gift',id)}</form>`);$('giftForm').oninput=()=>{let f=new FormData($('giftForm'));$('costPreview').innerHTML='Total actual: '+money(Math.max(0,+f.get('price')+ +f.get('tax')+ +f.get('shipping')- +f.get('discount')))};$('giftForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={...g};for(let k of ['name','recipient','category','store','link','priority','method','due','returnBy','tracking','receipt','notes'])v[k]=String(f.get(k)||'').trim();if(!v.name)return notify('Please enter a gift name.');for(let k of ['budget','price','tax','shipping','discount'])v[k]=round(Number(f.get(k)));if(v.discount>round(v.price+v.tax+v.shipping))return notify('Discount cannot exceed price + tax + shipping.');for(let k of ['link','tracking','receipt'])if(v[k]&&!link(v[k]))return notify('Use an http:// or https:// link.');for(let k of ['bought','wrapped','sent','delivered'])v[k]=f.has(k);if(v.delivered)v.sent=true;if(v.wrapped||v.sent)v.bought=true;if(id)Object.assign(g,v);else s().gifts.push(v);save();closeModal();render();notify('Gift saved')};}
function recipients(){let caps=sum(s().recipients,r=>r.cap);return heading('Your favourite people','A thoughtful plan for everyone on your list.','<button class="primary" onclick="editRecipient()">＋ Add recipient</button>')+`<div class="notice">Recipient caps: ${money(caps)} · Season budget: ${money(s().budget)}${caps>s().budget?' <span class="warn">· Allocations exceed your season budget.</span>':''}</div><div class="grid recipient-grid">${s().recipients.map(r=>{let gs=s().gifts.filter(g=>g.recipient===r.id),spent=sum(gs.filter(g=>g.bought),cost),forecast=sum(gs,g=>g.bought?cost(g):g.budget);return `<article class="card"><div class="person"><div class="avatar">${esc(r.name.slice(0,1))}</div><div><h3>${esc(r.name)}</h3><small>${esc(r.group||'Recipient')} · ${gs.length} gifts</small></div></div><div class="big-money ${spent>r.cap?'warn':''}">${money(spent)} <small>of ${money(r.cap)}</small></div><div class="track"><div class="fill" style="width:${r.cap?Math.min(100,spent/r.cap*100):spent?100:0}%"></div></div><p><small>Forecast ${money(forecast)} · ${gs.filter(g=>g.delivered).length} received</small></p>${r.interests?`<p class="muted longtext">${esc(r.interests)}</p>`:''}${r.address?`<small class="longtext">${esc(r.address)}</small>`:''}<div class="card-actions"><button onclick="editRecipient('${r.id}')">Edit details</button></div></article>`}).join('')}</div>${!s().recipients.length?empty('Start with someone special','Keep their budget, interests and address together.','<button onclick="editRecipient()">＋ Add recipient</button>'):''}`}
function editRecipient(id){let r=id?recipient(id):{id:uid(),name:'',group:'',cap:100,interests:'',address:''};openModal(id?'Edit recipient':'Add someone special',`<form id="recipientForm">${field('name','Name',r.name,'text','required maxlength="120"')}<div class="twocol">${field('group','Group · family, friends, work',r.group,'text','maxlength="80"')}${numberField('cap','Budget cap',r.cap)}</div>${notesField('interests','Interests, sizes & favourites',r.interests)}${notesField('address','Delivery address',r.address)}${formButtons('recipient',id)}</form>`);$('recipientForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);let v={...r,name:f.get('name').trim(),group:f.get('group').trim(),cap:round(+f.get('cap')),interests:f.get('interests').trim(),address:f.get('address').trim()};if(!v.name)return notify('Please enter a name.');if(id)Object.assign(r,v);else s().recipients.push(v);save();closeModal();render()}}
function deleteItem(type,id){let arr=type==='gift'?'gifts':type==='recipient'?'recipients':'ideas';if(!confirm(type==='recipient'?'Delete this recipient? Their gifts and ideas will become Unassigned.':'Delete this '+type+'? This cannot be undone.'))return;s()[arr]=s()[arr].filter(x=>x.id!==id);if(type==='recipient')for(let g of [...s().gifts,...s().ideas])if(g.recipient===id)g.recipient='';save();closeModal();render()}
function ideas(){return heading('The idea bank','Save the spark. Decide on the perfect gift later.','<button class="primary" onclick="editIdea()">＋ Save an idea</button>')+`<div class="grid idea-grid">${s().ideas.map(i=>`<article class="card"><span class="badge">${esc(rname(i.recipient))}</span><h2 style="margin-top:18px">${esc(i.name)}</h2><div class="big-money">${money(i.estimate)}</div><p class="muted longtext">${esc(i.notes)}</p>${external(i.link,'See inspiration')}<div class="card-actions"><button class="primary" onclick="promoteIdea('${i.id}')">Move to gifts →</button><button onclick="editIdea('${i.id}')">Edit</button></div></article>`).join('')}</div>${s().ideas.length?'':empty('Catch your next bright idea','Ideas do not count toward spending or forecasts.','<button onclick="editIdea()">＋ Save an idea</button>')}`}
function editIdea(id){let i=id?s().ideas.find(x=>x.id===id):{id:uid(),name:'',recipient:'',estimate:0,link:'',notes:''};openModal('Save a bright idea',`<form id="ideaForm">${field('name','Gift idea',i.name,'text','required maxlength="160"')}<div class="twocol">${selectField('recipient','Recipient',[['','Unassigned'],...s().recipients.map(r=>[r.id,r.name])],i.recipient)}${numberField('estimate','Estimated price',i.estimate)}</div>${field('link','Inspiration link (https://)',i.link,'url')}${notesField('notes','Notes',i.notes)}${formButtons('idea',id)}</form>`);$('ideaForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={...i,name:f.get('name').trim(),recipient:f.get('recipient'),estimate:round(+f.get('estimate')),link:f.get('link').trim(),notes:f.get('notes').trim()};if(!v.name)return notify('Please enter an idea.');if(v.link&&!link(v.link))return notify('Use an http:// or https:// link.');if(id)Object.assign(i,v);else s().ideas.push(v);save();closeModal();render()}}
function promoteIdea(id){let i=s().ideas.find(x=>x.id===id);s().gifts.push({...blankGift(),name:i.name,recipient:i.recipient,budget:i.estimate,price:i.estimate,link:i.link,notes:i.notes});s().ideas=s().ideas.filter(x=>x.id!==id);save();render();notify('Moved to gifts. Review costs before marking bought.')}
function shopping(){let gs=s().gifts.filter(g=>!g.bought),stores=[...new Set(gs.map(g=>g.store||'Store to decide'))].sort();return heading('A calmer shopping trip',`${gs.length} gifts to buy · ${money(sum(gs,g=>g.budget))} planned`,'<button onclick="window.print()">Print shopping list</button>')+stores.map(store=>`<section class="card" style="margin-bottom:18px"><div class="section-head"><h2>${esc(store)}</h2><span class="badge">${money(sum(gs.filter(g=>(g.store||'Store to decide')===store),g=>g.budget))} planned</span></div>${gs.filter(g=>(g.store||'Store to decide')===store).map(g=>`<div class="row"><div class="checklist-line"><input type="checkbox" aria-label="Mark ${esc(g.name)} bought" onchange="setFlag('${g.id}','bought',true)"><div><b>${esc(g.name)}</b><div><small>${esc(rname(g.recipient))} · ${esc(g.priority)} priority${g.due?' · By '+dateLabel(g.due):''}</small></div>${external(g.link,'Product link')}</div></div><div><b>${money(g.budget)}</b><div><button onclick="editGift('${g.id}')">Enter cost</button></div></div></div>`).join('')}</section>`).join('')+(gs.length?'<small>Before ticking Bought, use Enter cost to record the actual price, tax, shipping and discount.</small>':empty('All shopping caught up','Your unbought gifts will appear here automatically.'))}
function deliveries(){let gs=s().gifts.filter(g=>g.bought||g.due||g.returnBy).slice().sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'));return heading('From you, with love','Track handoffs, deliveries and return windows.','<button onclick="window.print()">Print delivery list</button>')+`<div class="delivery-list">${gs.map(g=>`<article class="card"><div class="section-head"><div><h3>${esc(g.name)} <span class="badge">${g.delivered?'Received':g.sent?'Sent / given':g.bought?'Preparing':'Not bought'}</span></h3><small>${esc(rname(g.recipient))} · ${esc(g.method)}</small></div><button onclick="editGift('${g.id}')">Edit gift</button></div><div class="twocol"><div>${g.due?`<p class="${!g.delivered&&days(g.due)<0?'warn':''}">Needed by <b>${dateLabel(g.due)}</b>${!g.delivered&&days(g.due)<0?' · overdue':''}</p>`:''}${g.returnBy?`<p>Return by <b>${dateLabel(g.returnBy)}</b> <small>(${days(g.returnBy)<0?'window passed':days(g.returnBy)+' days left'})</small></p>`:''}${external(g.tracking,'Track parcel')} ${external(g.receipt,'View receipt')}</div><div class="longtext muted">${esc(recipient(g.recipient)?.address||'No address saved')}</div></div><div class="checkrow"><label><input type="checkbox" ${g.sent?'checked':''} onchange="setFlag('${g.id}','sent',this.checked)">Sent / given</label><label><input type="checkbox" ${g.delivered?'checked':''} onchange="setFlag('${g.id}','delivered',this.checked)">Received</label></div>${g.notes?`<small class="longtext">${esc(g.notes)}</small>`:''}</article>`).join('')}</div>${gs.length?'':empty('Every delivery, accounted for','Buy a gift or add a deadline to start tracking.')}`}
function tags(){return heading('The finishing touch','One gift tag per gift. Print, cut and add your ribbon.','<button onclick="window.print()">Print gift tags</button>')+`<p class="muted no-print">Set the “From” name in Settings. Gift names are hidden so the surprise stays safe.</p><div class="tag-grid">${s().gifts.map(g=>`<div class="gift-tag"><span style="color:var(--gold);font-size:24px">✧</span><p><small>A LITTLE SOMETHING FOR</small></p><h2>${esc(g.recipient?rname(g.recipient):'________________')}</h2><p>With love, ${esc(s().from||'________________')}</p></div>`).join('')}</div>${s().gifts.length?'':empty('Make it personal','Add a gift to create your first printable tag.')}`}
function seasons(){return heading('Every season, remembered','Keep past lists and start fresh for your next celebration.','<button class="primary" onclick="newSeason()">＋ New season</button>')+`<div class="grid recipient-grid">${db.seasons.map(se=>`<article class="card"><span class="badge">${se.archived?'Archived':se.id===db.active?'Current':'Active'}</span><h2 style="margin-top:16px">${esc(se.name)}</h2><p class="muted">${dateLabel(se.date)} · ${se.gifts.length} gifts<br>${se.recipients.length} recipients</p><div class="card-actions"><button onclick="changeSeason('${se.id}')">Open</button><button onclick="archiveSeason('${se.id}')">${se.archived?'Restore':'Archive'}</button></div></article>`).join('')}</div><p><small>Archives remain editable and are included in full backups. Seasons keep their own currency and budget.</small></p>`}
function archiveSeason(id){let se=db.seasons.find(x=>x.id===id);se.archived=!se.archived;save();render()}
function newSeason(){openModal('A new season of giving',`<form id="seasonForm">${field('name','Season name','','text','required maxlength="120"')}${field('date','Celebration date',`${year()+1}-12-25`,'date','required')}${numberField('budget','Season budget',1000)}<div class="checkrow"><label><input type="checkbox" name="copy">Copy current recipients and their budget caps</label></div><small>Gifts and ideas will start empty. Currency and From name carry over.</small>${formButtons('season')}</form>`);$('seasonForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);if(!f.get('name').trim())return notify('Please enter a season name.');let old=s(),se=makeSeason(f.get('name').trim(),f.get('date'));se.budget=round(+f.get('budget'));se.currency=old.currency;se.from=old.from;if(f.has('copy'))se.recipients=old.recipients.map(r=>({...r,id:uid()}));db.seasons.push(se);db.active=se.id;save();closeModal();go('Dashboard')}}
function settings(){let se=s();return heading('Make it yours','A few thoughtful details for this season.')+`<div class="settings grid"><section class="card"><h2>Season preferences</h2><form id="settingsForm" onsubmit="saveSettings(event)"><div class="twocol">${field('name','Season name',se.name,'text','required maxlength="120"')}${field('date','Celebration date',se.date,'date','required')}${numberField('budget','Overall budget',se.budget)}${field('currency','Currency symbol or code',se.currency,'text','required maxlength="8"')}${field('from','From name on gift tags',se.from,'text','maxlength="120"')}</div><p><small>Changing the currency changes the label only; amounts are not converted.</small></p><button class="primary">Save preferences</button></form></section><section class="card"><h2>Your data, in your hands</h2><p class="muted">Auto-save uses this browser on this device. Keep regular JSON backups, especially before moving or renaming the app, clearing browser data or changing devices.</p><div class="card-actions"><button class="primary" onclick="backup()">Download full backup</button><button onclick="$('restoreFile').click()">Restore JSON backup</button><button onclick="exportCSV()">Export season CSV</button></div><p><small>JSON includes all seasons, addresses and settings. Restore replaces all current app data. CSV is a readable export, not a restorable backup.</small></p></section><section class="card"><h2>Explore & organise</h2><p class="muted">Try a separate sample season without replacing your existing lists.</p><button onclick="loadSample()">Load sample season</button> <button onclick="newSeason()">Create a fresh season</button></section></div>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);if(!f.get('name').trim()||!f.get('currency').trim())return notify('Name and currency are required.');Object.assign(s(),{name:f.get('name').trim(),date:f.get('date'),budget:round(+f.get('budget')),currency:f.get('currency').trim(),from:f.get('from').trim()});save();render();notify('Preferences saved')}
function help(){return heading('A little help, a lot of joy','Your quick-start guide to Evergift.')+`<div class="card help settings"><h2>Start in five simple steps</h2><h3>01 · Set your season</h3><p>Open Settings. Choose your celebration date, overall budget, currency label and From name. Try the sample season if you want to explore first.</p><h3>02 · Add your people</h3><p>Open Recipients and save names, individual budget caps, interests and addresses. Recipient caps are independent of the overall season budget.</p><h3>03 · Plan your gifts</h3><p>Add gifts with a budget, store, priority and deadline. Save undecided ideas in the Idea Bank, then move them into Gifts when you are ready.</p><h3>04 · Shop, wrap & deliver</h3><p>Shopping groups all unbought gifts by store. Enter the actual item price, tax, shipping and discount before marking Bought. Wrapped, Sent and Received also mark the gift Bought; Received also marks it Sent. Digital gifts may skip wrapping.</p><h3>05 · Back up & celebrate</h3><p>Download a JSON backup from Settings regularly. Print your shopping list or gift tags using your browser print dialog. When the season ends, archive it and create a new one.</p><h3>How the money works</h3><p>Spent = bought gifts only, including tax and shipping, less discounts. Left = season budget minus spent. Forecast = actual cost of bought gifts plus budget for unbought gifts. A negative gift difference means over budget. Ideas are excluded. All amounts use two decimal places.</p><h3>Offline, private & device-specific</h3><p>This file needs no account, subscription, internet connection or external fonts. Product, receipt and tracking links need internet. Data stays in browser storage and does not sync automatically between devices. Do not use private browsing for long-term storage. Backups contain personal information; keep them private.</p><h3>Moving to a new device</h3><p>Download a full JSON backup on the old device. Open the HTML app in a browser on the new device, then choose Settings → Restore JSON backup. Restoring replaces the current lists; back them up first.</p><h3>Phone & tablet use</h3><p>The layout adapts to small screens. Use a browser that can open local HTML files. Some mobile file viewers only preview HTML or block scripts and storage; if that happens, use a compatible browser or a desktop browser. Offline file opening depends on the device and its file manager.</p><h3>Troubleshooting</h3><p>If changes do not stay saved, check browser storage permissions and export a backup. Keep the app at the same location and use the same browser. Browser data clearing, moving the file or browser restrictions can disconnect saved data. Restore your last JSON backup when needed.</p><h3>Printing</h3><p>Open the page you want to print and select its Print button or your browser’s Print command. Select A4 or US Letter, adjust scale if needed, and disable browser headers and footers. Choose Save as PDF for a digital copy.</p></div>`}
function download(name,text,type){let blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function backup(){download(`Evergift-backup-${today()}.json`,JSON.stringify(db,null,2),'application/json');notify('Backup download requested')}
function csvCell(v){let t=String(v??'');if(/^[\s]*[=+\-@]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'}
function exportCSV(){let headers=['Season','Recipient','Category','Gift','Store','Product link','Budget','Item price','Tax','Shipping','Discount','Actual total','Budget difference','Bought','Wrapped','Sent / given','Received','Priority','Delivery method','Needed by','Return by','Tracking link','Receipt link','Address','Notes','Currency'];let rows=s().gifts.map(g=>[s().name,rname(g.recipient),g.category,g.name,g.store,g.link,g.budget,g.price,g.tax,g.shipping,g.discount,g.bought?cost(g):'',g.bought?round(g.budget-cost(g)):'',g.bought,g.wrapped,g.sent,g.delivered,g.priority,g.method,g.due,g.returnBy,g.tracking,g.receipt,recipient(g.recipient)?.address||'',g.notes,s().currency]);download('Evergift-gifts-'+today()+'.csv','\uFEFF'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function validate(d){const fail=()=>{throw Error('Invalid Evergift backup')},str=(v,max=3000)=>typeof v==='string'&&v.length<=max,num=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=1e8,date=(v,optional=false)=>optional&&v===''||str(v,10)&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v))&&new Date(v+'T12:00:00Z').toISOString().slice(0,10)===v; if(!d||d.app!=='evergift'||d.version!==1||!['light','dark'].includes(d.theme)||!Array.isArray(d.seasons)||!d.seasons.length||d.seasons.length>200)fail();let ids=new Set();const id=v=>{if(!str(v,80)||!/^id[a-z0-9]+$/.test(v)||ids.has(v))fail();ids.add(v)};for(const se of d.seasons){id(se.id);if(!str(se.name,120)||!date(se.date)||!num(se.budget)||!str(se.currency,8)||!se.currency.trim()||!str(se.from,120)||typeof se.archived!=='boolean')fail();for(const k of ['recipients','gifts','ideas'])if(!Array.isArray(se[k])||se[k].length>10000)fail();for(const r of se.recipients){id(r.id);if(!str(r.name,120)||!str(r.group,80)||!num(r.cap)||!str(r.interests)||!str(r.address))fail()}let rids=new Set(se.recipients.map(r=>r.id));for(const g of se.gifts){id(g.id);if(!str(g.recipient)||g.recipient&&!rids.has(g.recipient))fail();for(const k of ['name','category','store','link','priority','method','tracking','receipt','notes'])if(!str(g[k]))fail();for(const k of ['budget','price','tax','shipping','discount'])if(!num(g[k]))fail();if(g.discount>round(g.price+g.tax+g.shipping))fail();for(const k of ['bought','wrapped','sent','delivered'])if(typeof g[k]!=='boolean')fail();if((g.wrapped||g.sent||g.delivered)&&!g.bought||g.delivered&&!g.sent)fail();if(!date(g.due,true)||!date(g.returnBy,true))fail()}for(const i of se.ideas){id(i.id);if(!str(i.name)||!str(i.recipient)||i.recipient&&!rids.has(i.recipient)||!num(i.estimate)||!str(i.link)||!str(i.notes))fail()}}if(!d.seasons.some(se=>se.id===d.active))fail();return true}
$('restoreFile').onchange=async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>15*1024*1024)return notify('Backup is too large (maximum 15 MB).');let imported;try{imported=JSON.parse(await file.text());validate(imported)}catch{return notify('This is not a valid Evergift v1 backup. Nothing was changed.')}if(!confirm('Replace ALL current seasons with this backup? Download your current backup first if needed.'))return;db=imported;save();go('Dashboard');notify('Backup restored')};
function loadSample(){let existing=db.seasons.find(x=>x.name==='Christmas · sample');if(existing){db.active=existing.id;save();go('Dashboard');return}let se=makeSeason('Christmas · sample',`${year()}-12-25`);se.budget=650;se.from='Alex';let people=[['Mum','Family',150,'Gardening, linen & slow Sunday mornings'],['Jamie','Family',180,'Coffee, books & weekend adventures'],['Sophie','Friends',90,'Art supplies and cosy evenings'],['Noah','Friends',80,'Baking and board games']];se.recipients=people.map(([name,group,cap,interests])=>({id:uid(),name,group,cap,interests,address:''}));let gs=[['Linen gardening apron',0,'Garden & home','Willow & Co.',65,58,true,true,false],['Pour-over coffee set',1,'Food & drink','Local market',85,79,true,false,false],['Watercolour collection',2,'Creative','Art shop',45,42,false,false,false],['Favourite recipe journal',3,'Books','Bookshop',30,28,true,true,true],['A winter reading bundle',0,'Books','Bookshop',40,36,false,false,false],['Weekend adventure kit',1,'Outdoors','Trail store',75,70,false,false,false]];se.gifts=gs.map(([name,r,category,store,budget,price,bought,wrapped,sent])=>({...blankGift(),name,recipient:se.recipients[r].id,category,store,budget,price,bought,wrapped,sent,delivered:sent,due:`${year()}-12-23`}));se.ideas=[{id:uid(),name:'An afternoon pottery class',recipient:se.recipients[2].id,estimate:45,link:'',notes:'A shared experience for the new year.'}];db.seasons.push(se);db.active=se.id;save();go('Dashboard');notify('Sample season added. Your other seasons are unchanged.')}
try{let raw=localStorage.getItem(KEY);if(raw){let parsed=JSON.parse(raw);validate(parsed);db=parsed}}catch(e){storageOK=false;loadError=true}
render();
</script><style id="demo-readonly-style">
#demoReadOnlyNotice{position:sticky;top:0;z-index:999999;background:#203f35;color:#fff;text-align:center;padding:10px 14px;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.2px;box-shadow:0 2px 10px #0002}
#demoReadOnlyNotice span{opacity:.85;font-weight:400}
input[readonly],textarea[readonly],select:disabled{opacity:.72!important;cursor:not-allowed!important}
.demo-action-blocked{opacity:.55!important;cursor:not-allowed!important}
</style>
<script id="demo-readonly-guard">
(()=> {
 const blocked=/(^|\\b)(save|delete|remove|clear all|reset|restore|import|export|download|upload|submit|confirm|add|create|duplicate|backup|back up|mark done|mark complete|complete task|finish task|edit|update)(\\b|$)/i;
 const lock=()=>{
  document.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]),textarea').forEach(el=>{el.readOnly=true;el.setAttribute('aria-readonly','true')});
  document.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(el=>{el.disabled=true;el.setAttribute('aria-disabled','true')});
  document.querySelectorAll('[contenteditable="true"],[contenteditable=""]').forEach(el=>{el.contentEditable='false'});
  document.querySelectorAll('button').forEach(el=>{
   const label=(el.innerText||el.getAttribute('aria-label')||el.title||'').trim().replace(/\s+/g,' ');
   if(blocked.test(label)){el.classList.add('demo-action-blocked');el.setAttribute('aria-disabled','true');}
   else {el.disabled=false;el.removeAttribute('aria-disabled');}
  });
  document.querySelectorAll('a[download]').forEach(el=>{el.removeAttribute('download');el.setAttribute('aria-disabled','true')});
 };
 const addNotice=()=>{
  if(document.getElementById('demoReadOnlyNotice'))return;
  const n=document.createElement('div');n.id='demoReadOnlyNotice';
  n.innerHTML='INTERACTIVE PREVIEW <span>— explore tabs, menus and sections; data entry and saving are disabled</span>';
  document.body.insertBefore(n,document.body.firstChild);
 };
 const start=()=>{
  addNotice();lock();
  new MutationObserver(()=>lock()).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['disabled','contenteditable','readonly']});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
 document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  const label=(b.innerText||b.getAttribute('aria-label')||b.title||'').trim().replace(/\s+/g,' ');
  if(blocked.test(label)){e.preventDefault();e.stopImmediatePropagation();}
 },true);
 document.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
 document.addEventListener('beforeinput',e=>{
  if(e.target.matches('input:not([type="button"]):not([type="submit"]),textarea,[contenteditable="true"]')){e.preventDefault();e.stopImmediatePropagation()}
 },true);
})();
</script></body></html>
