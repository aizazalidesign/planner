<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MerryNest • Gift Planner</title><style>
:root{--bg:#f6f3eb;--panel:#fffef9;--ink:#233d35;--muted:#718078;--line:#dce2d8;--green:#244c3e;--gold:#ba8842;--red:#a34d4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}body.dark{--bg:#172720;--panel:#23372e;--ink:#f4f2e6;--muted:#b4c3b8;--line:#405548;--green:#aacdb5}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 15px;background:var(--panel);color:var(--ink)}button:hover{border-color:var(--gold)}button.primary{background:#244c3e;color:white;border-color:#244c3e}input,select,textarea{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:100%;width:100%}input[type=checkbox]{width:20px;height:20px;accent-color:#37634b}label{display:block;font-size:13px;color:var(--muted)}label input,label select,label textarea{margin-top:5px}aside{position:fixed;width:230px;height:100vh;background:#244c3e;color:#fff;padding:32px 20px;display:flex;flex-direction:column}.logo{font:30px Georgia,serif;letter-spacing:-1px}.logo small{display:block;font:10px system-ui;letter-spacing:3px;margin-top:7px;color:#d1d9c5}nav{display:grid;gap:8px;margin-top:45px}nav button{text-align:left;background:none;color:#dbe5dc;border:0;padding:13px 16px}nav button.active{background:#fff2d8;color:#244c3e}.asidefoot{margin-top:auto;font-size:12px;color:#ccd9ce}main{margin-left:230px;padding:30px 4%;max-width:1600px}.top,.row,.actions{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top select{width:210px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}h1{font:38px Georgia,serif;margin:10px 0}h2{font:25px Georgia,serif;margin:0 0 18px}h3{margin:0 0 8px;font-size:17px}p{color:var(--muted)}.hero{background:#e9eddf;border:1px solid #d4ddc9;border-radius:20px;padding:32px;margin:25px 0;color:#244c3e;position:relative;overflow:hidden}.hero p{color:#59705a}.hero .ornament{font-size:75px;color:#b59156;float:right;line-height:1.2}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.two{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-top:20px}.card{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:15px;min-width:0}.metric{font:30px Georgia,serif;margin:12px 0 3px}.small{font-size:12px;color:var(--muted)}.rings{display:flex;justify-content:space-around;gap:15px;flex-wrap:wrap}.ring{width:95px;height:95px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--pct),var(--line) 0);margin:10px auto}.ring span{width:75px;height:75px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:22px}.center{text-align:center}.bar{height:9px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--gold)}.bar.actual i{background:var(--green)}.item{padding:14px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#e9eddf;color:#244c3e;font-size:11px}.danger{color:var(--red)}.toolbar{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}.toolbar input{flex:2;min-width:170px}.toolbar select{flex:1;min-width:130px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;background:var(--panel);font-size:13px}th,td{padding:14px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:11px;text-transform:uppercase;color:var(--muted)}td small{display:block;color:var(--muted)}a{color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}.empty{text-align:center;padding:45px 20px}.notice{background:#fff0ce;color:#664d24;padding:12px 18px;border-radius:8px;margin:15px 0}.hidden{display:none!important}dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);width:660px;max-width:95vw;max-height:90vh;padding:26px}dialog::backdrop{background:#12271ec0}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}#toast{position:fixed;bottom:20px;right:20px;background:#244c3e;color:white;padding:14px 22px;border-radius:10px;z-index:20}.help{max-width:800px}.help li{margin:12px 0}.no-print{}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}aside{width:190px;padding:25px 12px}main{margin-left:190px;padding:25px}}@media(max-width:650px){aside{position:static;width:100%;height:auto;padding:18px}.logo{font-size:25px}.logo small,.asidefoot{display:none}nav{display:flex;overflow:auto;margin-top:15px;gap:5px}nav button{white-space:nowrap;padding:8px 12px}main{margin:0;padding:20px 15px}.top{gap:8px}.top select{width:160px}.hero{padding:23px}.hero .ornament{font-size:45px}h1{font-size:30px}.cards{grid-template-columns:1fr}.card{padding:17px}.formgrid{grid-template-columns:1fr}.grid{gap:10px}.metric{font-size:25px}}@media print{aside,.top,.toolbar,button,.no-print,dialog,#toast{display:none!important}main{margin:0;padding:0}body{background:white;color:black}.card{break-inside:avoid}.cards,.two{display:block}.card{margin:10px 0}input[type=checkbox]{display:inline-block}a{color:black}}
</style><aside><div class="logo">✧ MerryNest<small>THE JOY IS IN THE GIVING</small></div><nav id="nav"></nav><div class="asidefoot">A little planning.<br>A lot more joy.<hr>Offline • Private • Yours</div></aside><main><div class="top"><span class="eyebrow">Your thoughtful gifting companion</span><div class="actions"><select id="seasonSelect" aria-label="Occasion"></select><button id="theme" aria-label="Toggle dark mode">◐</button></div></div><div id="storageWarning" class="notice hidden">Browser storage is unavailable. Export a JSON backup before closing this page.</div><div id="view"></div></main><dialog id="modal"><form id="form"><div class="row"><h2 id="modalTitle"></h2><button type="button" onclick="modal.close()" aria-label="Close">✕</button></div><div id="fields" class="formgrid"></div><div class="modalfoot"><button type="button" onclick="modal.close()">Cancel</button><button class="primary">Save</button></div></form></dialog><div id="toast" class="hidden" role="status"></div><input type="file" id="restore" accept="application/json,.json" class="hidden"><script>
'use strict';
const KEY='merrynest_gifting_v1', $=id=>document.getElementById(id), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:1,currency:'$',dark:false,active:'first',seasons:[{id:'first',name:'Christmas '+new Date().getFullYear(),date:new Date().getFullYear()+'-12-25',budget:500,archived:false,recipients:[],gifts:[],ideas:[]}]});let db=fresh(),page='Dashboard',query='',filter='all',recipientFilter='all',editing=null;try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);if(!valid(parsed))throw Error('invalid');db=parsed}}catch(e){$('storageWarning').textContent='Saved data could not be loaded. Restore a backup if needed; export your current data regularly.';$('storageWarning').classList.remove('hidden')}
const season=()=>db.seasons.find(s=>s.id===db.active)||db.seasons[0],money=n=>db.currency+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),person=id=>season().recipients.find(r=>r.id===id)?.name||'Unassigned',sum=(a,k)=>a.reduce((n,x)=>n+Number(x[k]||0),0),cost=g=>g.returned?0:Number(g.actual||0),spent=a=>a.reduce((n,g)=>n+(g.bought?cost(g):0),0),days=d=>d?Math.ceil((new Date(d+'T00:00:00')-new Date(new Date().toDateString()))/86400000):null;
function valid(d){return d&&d.version===1&&typeof d.currency==='string'&&d.currency.length<=8&&typeof d.dark==='boolean'&&Array.isArray(d.seasons)&&d.seasons.length>0&&d.seasons.length<=200&&d.seasons.some(s=>s.id===d.active)&&d.seasons.every(s=>typeof s.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(s.id)&&typeof s.name==='string'&&typeof s.date==='string'&&Number.isFinite(s.budget)&&s.budget>=0&&['recipients','gifts','ideas'].every(k=>Array.isArray(s[k])&&s[k].length<=10000&&s[k].every(x=>x&&typeof x.id==='string'&&/^[a-zA-Z0-9_-]+$/.test(x.id)))&&s.recipients.every(r=>typeof r.name==='string'&&Number.isFinite(r.cap)&&r.cap>=0)&&s.gifts.every(g=>typeof g.name==='string'&&['budget','actual','shipping','tax'].every(k=>Number.isFinite(g[k])&&g[k]>=0)&&['bought','wrapped','sent','returned'].every(k=>typeof g[k]==='boolean'))&&s.ideas.every(i=>typeof i.name==='string'&&Number.isFinite(i.price)&&i.price>=0))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){$('storageWarning').classList.remove('hidden')}}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}function go(p){page=p;query='';filter='all';recipientFilter='all';render()}function btn(t,js,primary=false){return `<button type="button" ${primary?'class="primary"':''} onclick="${js}">${t}</button>`}function empty(t){return `<div class="card empty"><h3>${t}</h3><p>Add your first entry, or load the sample occasion in Settings.</p></div>`}function total(g){return g.returned?0:Number(g.actual)+Number(g.shipping)+Number(g.tax)}function actual(a){return a.reduce((n,g)=>n+(g.bought?total(g):0),0)}
function render(){document.body.classList.toggle('dark',db.dark);$('nav').innerHTML=['Dashboard','Gifts','Recipients','Idea Bank','Shopping List','Deadlines','Settings','Help'].map((p,i)=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${['◈','♧','♡','✧','☷','◷','⚙','?'][i]} &nbsp; ${p}</button>`).join('');$('seasonSelect').innerHTML=db.seasons.map(s=>`<option value="${esc(s.id)}" ${s.id===db.active?'selected':''}>${esc(s.name)}${s.archived?' (archived)':''}</option>`).join('');const s=season();$('view').innerHTML=(s.archived?'<div class="notice">Archived occasion • You can still edit records. Unarchive in Settings.</div>':'')+({Dashboard:dashboard,Gifts:gifts,Recipients:recipients,'Idea Bank':ideas,'Shopping List':shopping,Deadlines:deadlines,Settings:settings,Help:help}[page])();}
function heading(title,sub,action=''){return `<div class="row" style="margin-top:28px"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function dashboard(){const s=season(),g=s.gifts,spent=actual(g),remaining=s.budget-spent,d=days(s.date);return `<section class="hero"><span class="ornament">✧<br>✦</span><span class="eyebrow">Make room for the moments that matter</span><h1>${esc(s.name)}</h1><p>Thoughtful gifts. A calmer season. Everything in one place.</p><span class="pill">${d===null?'Set your occasion date':d<0?Math.abs(d)+' days since your occasion':d===0?'Today is the day!':d+' days to celebrate'}</span></section><div class="grid">${[['Occasion budget',money(s.budget),'Your overall spending limit'],['Spent so far',money(spent),'Purchased gifts + tax + shipping'],[remaining<0?'Over budget':'Left to spend',money(Math.abs(remaining)),remaining<0?'Review your spending':'Budget minus purchased costs'],['Gifts planned',g.length,s.recipients.length+' people on your list']].map(a=>`<div class="card"><span class="eyebrow">${a[0]}</span><div class="metric">${a[1]}</div><span class="small">${a[2]}</span></div>`).join('')}</div><div class="two"><section class="card"><div class="row"><h2>A little closer to ready</h2>${btn('+ Add gift',"edit('gifts')",true)}</div><div class="rings">${['bought','wrapped','sent'].map(k=>{let n=g.filter(x=>x[k]&&!x.returned).length,p=g.length?Math.round(n/g.length*100):0;return `<div class="center"><div class="ring" style="--pct:${p}%"><span>${p}%</span></div><strong>${k[0].toUpperCase()+k.slice(1)}</strong><div class="small">${n} of ${g.length} gifts</div></div>`}).join('')}</div><p class="small">Returned gifts remain in the plan but do not count as completed.</p></section><section class="card"><h2>Your next little steps</h2>${[['Still to buy',g.filter(x=>!x.bought||x.returned).length],['Ready to wrap',g.filter(x=>x.bought&&!x.wrapped&&!x.returned).length],['Ready to send / give',g.filter(x=>x.wrapped&&!x.sent&&!x.returned).length]].map(a=>`<div class="row item"><span>${a[0]}</span><strong>${a[1]}</strong></div>`).join('')}</section></div><div class="two"><section class="card"><h2>People & their budgets</h2><p class="small">Gold: recipient cap • Green: purchased total</p>${s.recipients.length?s.recipients.map(r=>{let a=actual(g.filter(x=>x.recipient===r.id)),max=Math.max(r.cap,a,1);return `<div class="item"><div class="row"><strong>${esc(r.name)}</strong><span class="${a>r.cap?'danger':''}">${money(a)} / ${money(r.cap)}</span></div><div class="bar"><i style="width:${r.cap/max*100}%"></i></div><div class="bar actual"><i style="width:${a/max*100}%"></i></div></div>`}).join(''):'<p>Add recipients to see their budget comparison.</p>'}</section><section class="card"><h2>Plan ahead, spend gently</h2><div class="metric">${money(sum(g,'budget'))}</div><p>Planned gift budgets</p><div class="item">${money(sum(s.recipients,'cap'))} allocated to recipients</div><div class="item">${money(g.filter(g=>!g.bought||g.returned).reduce((n,g)=>n+g.budget,0))} planned for gifts still to buy</div><p class="small">Actual totals include tax and shipping. A returned gift is treated as fully refunded; edit the costs instead for a partial refund.</p></section></div>`}
function toolbar(){return `<div class="toolbar"><input aria-label="Search gifts" placeholder="Search gifts, people, stores, categories…" value="${esc(query)}" oninput="query=this.value;refreshGifts()"><select aria-label="Status" onchange="filter=this.value;refreshGifts()">${['all','to buy','bought','to wrap','to send','sent','returned'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select><select aria-label="Recipient" onchange="recipientFilter=this.value;refreshGifts()"><option value="all">All recipients</option>${season().recipients.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select>${btn('Export CSV','csv()')}</div>`}
function filtered(){return season().gifts.filter(g=>(recipientFilter==='all'||g.recipient===recipientFilter)&&[g.name,person(g.recipient),g.store,g.category,g.notes].join(' ').toLowerCase().includes(query.toLowerCase())&&({'all':true,'to buy':!g.bought||g.returned,bought:g.bought&&!g.returned,'to wrap':g.bought&&!g.wrapped&&!g.returned,'to send':g.wrapped&&!g.sent&&!g.returned,sent:g.sent&&!g.returned,returned:g.returned}[filter]))}
function refreshGifts(){$('giftResults').innerHTML=giftTable(filtered())}function gifts(){return heading('The gift list','Every idea, purchase and finishing touch.',btn('+ Add gift',"edit('gifts')",true))+toolbar()+`<div id="giftResults">${giftTable(filtered())}</div>`}
function giftTable(gs){return gs.length?`<div class="tablewrap"><table><thead><tr>${['Gift / recipient','Store','Budget','Total cost','Difference','Bought','Wrapped','Sent','Details'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${gs.map(g=>`<tr><td><strong>${esc(g.name)}</strong><small>${esc(person(g.recipient))} · ${esc(g.category||'General')}${g.returned?' · Returned':''}</small></td><td>${esc(g.store||'—')}</td><td>${money(g.budget)}</td><td>${money(total(g))}${!g.bought?'<small>not purchased</small>':''}</td><td class="${total(g)>g.budget?'danger':''}">${money(g.budget-total(g))}</td>${['bought','wrapped','sent'].map(k=>`<td><input type="checkbox" aria-label="${k}: ${esc(g.name)}" ${g[k]?'checked':''} onchange="toggle('${g.id}','${k}',this.checked)"></td>`).join('')}<td>${btn('Edit',`edit('gifts','${g.id}')`)}</td></tr>`).join('')}</tbody></table></div>`:empty('No gifts here yet')}
function toggle(id,k,v){let g=season().gifts.find(x=>x.id===id);g[k]=v;if(v){g.returned=false;if(k==='sent')g.wrapped=true;if(k==='sent'||k==='wrapped')g.bought=true}else{if(k==='bought'){g.wrapped=false;g.sent=false}if(k==='wrapped')g.sent=false}save();render()}
function recipients(){return heading('Your favourite people','Personal budgets, preferences and little reminders.',btn('+ Add person',"edit('recipients')",true))+`<div class="cards">${season().recipients.map(r=>{let gs=season().gifts.filter(g=>g.recipient===r.id),a=actual(gs);return `<article class="card"><span class="pill">${esc(r.relationship||'Recipient')}</span><h2 style="margin-top:14px">${esc(r.name)}</h2><div class="row"><strong class="${a>r.cap?'danger':''}">${money(a)}</strong><span class="small">of ${money(r.cap)}</span></div><div class="bar actual"><i style="width:${Math.min(100,r.cap?a/r.cap*100:a?100:0)}%"></i></div><p>${gs.length} gifts · ${gs.filter(g=>g.sent&&!g.returned).length} given</p><p>${esc(r.notes||'Add sizes, favourite colours or wish-list notes.')}</p>${btn('Edit person',`edit('recipients','${r.id}')`)}</article>`}).join('')}</div>`+(season().recipients.length?'':empty('Who are you gifting to?'))}
function safeURL(u){try{let x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:''}catch{return ''}}
function ideas(){return heading('The idea garden','Save a spark. Turn it into something thoughtful.',btn('+ Save idea',"edit('ideas')",true))+`<div class="cards">${season().ideas.map(i=>`<article class="card"><span class="pill">${esc(person(i.recipient))}</span><h2 style="margin-top:15px">${esc(i.name)}</h2><div class="metric">${money(i.price)}</div><p>${esc(i.notes||'A little inspiration for later.')}</p>${safeURL(i.link)?`<p><a href="${esc(safeURL(i.link))}" target="_blank" rel="noopener noreferrer">View idea ↗</a></p>`:''}<div class="actions">${btn('Move to gifts',`moveIdea('${i.id}')`,true)}${btn('Edit',`edit('ideas','${i.id}')`)}</div></article>`).join('')}</div>`+(season().ideas.length?'':empty('A home for your gift ideas'))}
function shopping(){let gs=season().gifts.filter(g=>!g.bought||g.returned),stores=[...new Set(gs.map(g=>g.store||'Store to decide'))];return heading('A calmer shopping trip',`${gs.length} gifts to buy · ${money(sum(gs,'budget'))} planned`,btn('Print shopping list','window.print()'))+stores.map(st=>`<section class="card" style="margin:18px 0"><h2>${esc(st)}</h2>${gs.filter(g=>(g.store||'Store to decide')===st).map(g=>`<div class="row item"><div><strong>${esc(g.name)}</strong><div class="small">${esc(person(g.recipient))} · ${esc(g.priority||'Normal')} priority</div>${safeURL(g.link)?`<a href="${esc(safeURL(g.link))}" target="_blank" rel="noopener noreferrer">Open product ↗</a>`:''}</div><div>${money(g.budget)} &nbsp; ${btn('Mark bought',`toggle('${g.id}','bought',true)`)}</div></div>`).join('')}</section>`).join('')+(gs.length?'':empty('Shopping is all caught up'))}
function deadlines(){let entries=[];season().gifts.forEach(g=>{if(g.due&&!g.sent&&!g.returned)entries.push({g,date:g.due,type:'Delivery / giving deadline'});if(g.returnBy&&g.bought&&!g.returned)entries.push({g,date:g.returnBy,type:'Return window ends'})});entries.sort((a,b)=>a.date.localeCompare(b.date));return heading('Nothing slips through','Delivery dates and return windows. Reminders appear while the app is open.')+entries.map(({g,date,type})=>`<div class="card row" style="margin:12px 0"><div><span class="pill">${esc(type)}</span><h3 style="margin-top:9px">${esc(g.name)} · ${esc(person(g.recipient))}</h3><span class="small">${esc(date)} · ${esc(g.tracking||'No tracking reference')}</span></div><div><strong class="${days(date)<0?'danger':''}">${days(date)<0?Math.abs(days(date))+' days overdue':days(date)===0?'Today':days(date)+' days left'}</strong> ${btn('Details',`edit('gifts','${g.id}')`)}</div></div>`).join('')+(entries.length?'':empty('No upcoming deadlines'))}
function settings(){let s=season();return heading('Make it yours','Occasions, backups and your personal preferences.')+`<div class="two"><section class="card"><h2>This occasion</h2><p>${esc(s.name)} · ${esc(s.date||'No date')}</p><div class="actions">${btn('Edit occasion',"edit('season')")}${btn('+ New occasion',"edit('newseason')",true)}${btn(s.archived?'Unarchive':'Archive occasion','archive()')}</div><p class="small">New occasions start empty. Archived occasions remain available in the top menu.</p><hr><label>Currency symbol (no conversion)<input id="currency" maxlength="8" value="${esc(db.currency)}"></label><p>${btn('Save currency','currency()')}</p></section><section class="card"><h2>Keep a safe copy</h2><p>Data is saved in this browser. Download a backup regularly and before moving or renaming the app file.</p><div class="actions">${btn('Download JSON backup','backup()',true)}${btn('Restore backup',"$('restore').click()")}${btn('Export gifts CSV','csv()')}</div><p class="small">A backup includes every occasion, recipient, address and note. Keep it private. Restore replaces all current data after confirmation.</p></section><section class="card"><h2>Try a sample</h2><p>Add a separate sample occasion to explore the planner.</p>${btn('Load sample occasion','sample()')}</section><section class="card"><h2>Appearance</h2><p>Switch between warm cream and forest dark mode.</p>${btn('Toggle light / dark','theme()')}</section></div>`}
function help(){return heading('A lovely place to begin','MerryNest • Offline Gift Planner • Version 1.0')+`<section class="card help"><h2>Five minutes to a calmer season</h2><ol><li>In <b>Settings</b>, edit the occasion name, date, overall budget and currency symbol.</li><li>Add your <b>Recipients</b> and their spending caps. Recipient caps and the overall budget are separate planning limits.</li><li>Add <b>Gifts</b> or collect inspiration in the <b>Idea Bank</b>. Enter item price, shipping and tax separately. Dashboard spending counts only bought gifts.</li><li>Tick <b>Bought → Wrapped → Sent</b>. Sent also means handed over in person. Later stages automatically complete earlier stages.</li><li>Use the <b>Shopping List</b> on errands and <b>Deadlines</b> for delivery and return dates.</li><li>Download a <b>JSON backup</b> regularly. Restore it to transfer your records to another browser or device.</li></ol><h2>Opening your file</h2><p>Unzip the download, then open the HTML file in a modern browser. No installation, account or internet is required. Desktop Chrome, Edge, Firefox or Safari is recommended. Mobile layout is supported, but some phone file-preview apps do not run HTML scripts; open the file in a full browser. File opening and saving behaviour varies by mobile operating system.</p><h2>Your data stays with you</h2><p>Records stay in this browser's local storage, not inside the HTML file. Private browsing, clearing browser data, moving the file or changing browsers can remove or separate records. Backups are essential. There is no cloud account, automatic device sync, online edition or background notification service.</p><h2>Useful details</h2><p>Returned means a full refund: the gift contributes zero actual spending and is removed from completion totals. It reappears on the shopping list for a replacement. For partial refunds, reduce the actual cost instead. CSV exports the currently filtered gifts when you are on Gifts, otherwise the full current occasion. JSON contains all occasions.</p><p>Use Print on Shopping List and choose Save as PDF if desired. You can edit archived records and unarchive them in Settings. All amounts use one chosen symbol; no currency conversion is performed.</p></section>`}
const schemas={recipients:[['name','Name','text',true],['relationship','Relationship'],['cap','Budget cap','number'],['notes','Preferences / sizes / notes','textarea'],['address','Postal address','textarea']],ideas:[['name','Gift idea','text',true],['recipient','Recipient','recipient'],['price','Estimated price','number'],['link','Product URL','url'],['notes','Notes','textarea']],gifts:[['name','Gift name','text',true],['recipient','Recipient','recipient'],['category','Category'],['store','Store'],['link','Product URL','url'],['budget','Planned budget','number'],['actual','Item cost','number'],['shipping','Shipping cost','number'],['tax','Tax','number'],['priority','Priority','priority'],['due','Delivery / giving deadline','date'],['returnBy','Return by','date'],['delivery','Delivery method','delivery'],['tracking','Tracking reference'],['address','Delivery address','textarea'],['notes','Notes','textarea'],['bought','Bought','checkbox'],['wrapped','Wrapped','checkbox'],['sent','Sent / given','checkbox'],['returned','Returned (fully refunded)','checkbox']],season:[['name','Occasion name','text',true],['date','Occasion date','date'],['budget','Overall budget','number']]};
function edit(type,id){let source=type==='season'?season():type==='newseason'?{budget:500}:id?season()[type].find(x=>x.id===id):{};editing={type,id};$('modalTitle').textContent=(id||type==='season'?'Edit ':'Add ')+({gifts:'gift',recipients:'person',ideas:'idea',season:'occasion',newseason:'occasion'}[type]);$('fields').innerHTML=schemas[type==='newseason'?'season':type].map(([k,label,t='text',req])=>{let val=source[k]??'',attrs=`name="${k}" ${req?'required':''}`;return `<label class="${t==='textarea'?'full':''}">${label}${t==='textarea'?`<textarea ${attrs} rows="2">${esc(val)}</textarea>`:t==='recipient'?`<select ${attrs}><option value="">Unassigned</option>${season().recipients.map(r=>`<option value="${esc(r.id)}" ${val===r.id?'selected':''}>${esc(r.name)}</option>`).join('')}</select>`:['priority','delivery'].includes(t)?`<select ${attrs}>${(t==='priority'?['Normal','High','Low']:['In person','Post / courier','Digital']).map(v=>`<option ${v===val?'selected':''}>${v}</option>`).join('')}</select>`:`<input ${attrs} type="${t}" ${t==='number'?'min="0" max="1000000000" step="0.01"':''} ${t==='checkbox'?(val?'checked':''):`value="${esc(val)}"`} maxlength="2000">`}</label>`}).join('')+(id?`<div class="full">${btn('Delete entry',`removeEntry('${type}','${id}')`)}</div>`:'');$('modal').showModal()}
$('form').onsubmit=e=>{e.preventDefault();let {type,id}=editing,fields=schemas[type==='newseason'?'season':type],v={};for(let[k,,t]of fields){let el=$('form').elements[k];v[k]=t==='number'?Number(el.value||0):t==='checkbox'?el.checked:el.value.trim()}if(!v.name){toast('Please enter a name.');return}if(type==='season')Object.assign(season(),v);else if(type==='newseason'){v={...v,id:uid(),archived:false,recipients:[],gifts:[],ideas:[]};db.seasons.push(v);db.active=v.id}else{if(type==='gifts'){if(v.returned){v.wrapped=false;v.sent=false}if(v.sent)v.wrapped=true;if(v.wrapped)v.bought=true}if(id)Object.assign(season()[type].find(x=>x.id===id),v);else season()[type].push({...v,id:uid()})}save();$('modal').close();render();toast('Saved')};
function removeEntry(type,id){if(!confirm('Delete this entry? This cannot be undone.' ))return;if(type==='recipients'){season().gifts.forEach(g=>{if(g.recipient===id)g.recipient=''});season().ideas.forEach(g=>{if(g.recipient===id)g.recipient=''})}season()[type]=season()[type].filter(x=>x.id!==id);save();$('modal').close();render()}
function moveIdea(id){let i=season().ideas.find(x=>x.id===id);season().gifts.push({id:uid(),name:i.name,recipient:i.recipient,link:i.link,notes:i.notes,budget:i.price,actual:0,shipping:0,tax:0,bought:false,wrapped:false,sent:false,returned:false,priority:'Normal'});season().ideas=season().ideas.filter(x=>x.id!==id);save();render();toast('Moved to your gift list')}

function download(name,text,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000)}function backup(){download('MerryNest-Backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}function csv(){let headers=['Gift','Recipient','Category','Store','Link','Budget','Item cost','Shipping','Tax','Total cost','Budget difference','Bought','Wrapped','Sent','Returned','Priority','Due','Return by','Delivery','Tracking','Address','Notes'],gs=page==='Gifts'?filtered():season().gifts;let cell=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';download('MerryNest-Gifts.csv','\ufeff'+[headers,...gs.map(g=>[g.name,person(g.recipient),g.category,g.store,g.link,g.budget,g.actual,g.shipping,g.tax,total(g),g.budget-total(g),g.bought,g.wrapped,g.sent,g.returned,g.priority,g.due,g.returnBy,g.delivery,g.tracking,g.address,g.notes])].map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
$('restore').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10000000)throw Error('This file is too large (maximum 10 MB).');let d=JSON.parse(await f.text());if(!valid(d))throw Error('This is not a valid MerryNest v1 backup.');if(confirm('Replace ALL current occasions with this backup? Export a backup first if you need to keep your current data.')){db=d;save();go('Dashboard');toast('Backup restored')}}catch(err){alert(err.message||'Unable to restore this file.')}finally{e.target.value=''}};

<script id="demo-readonly-guard">
(()=> {
 const lock=()=>{
  document.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]),textarea').forEach(el=>{el.readOnly=true;el.setAttribute('aria-readonly','true')});
  document.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(el=>{el.disabled=true;el.setAttribute('aria-disabled','true')});
  document.querySelectorAll('[contenteditable="true"],[contenteditable=""]').forEach(el=>{el.contentEditable='false'});
  document.querySelectorAll('button').forEach(el=>{el.disabled=false;el.classList.remove('demo-action-blocked');el.removeAttribute('aria-disabled')});
  document.querySelectorAll('a[download]').forEach(el=>{el.removeAttribute('download');el.setAttribute('aria-disabled','true')});
 };
 const addNotice=()=>{
  if(document.getElementById('demoReadOnlyNotice'))return;
  const n=document.createElement('div');n.id='demoReadOnlyNotice';
  n.innerHTML='INTERACTIVE PREVIEW <span>— click through every section, tab and viewing control; typing and saving are disabled</span>';
  document.body.insertBefore(n,document.body.firstChild);
 };
 const start=()=>{
  addNotice();lock();
  new MutationObserver(()=>lock()).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['disabled','contenteditable','readonly']});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
 document.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
 document.addEventListener('beforeinput',e=>{
  if(e.target.matches('input:not([type="button"]):not([type="submit"]),textarea,[contenteditable="true"]')){e.preventDefault();e.stopImmediatePropagation()}
 },true);
})();
