function projectCard(p,i=0){const photo=(p.attachments||[]).find(a=>a.type.startsWith('image/'));return `<article class="card">${photo?`<img class="photo" src="${photo.data}" alt="${esc(p.name)}">`:art(i)}<div class="meta"><span class="pill">${esc(p.status)}</span><span>${esc(p.hook)} mm hook</span></div><h3>${esc(p.name)}</h3><p class="muted cardsmall">${esc(ref('yarn',p.yarn))}</p><div class="progress"><i style="width:${num(p.progress)}%"></i></div><div class="meta"><span>${num(p.progress)}% complete</span><span>${esc(p.deadline||'No deadline')}</span></div><p class="cardsmall">Next: ${esc(p.next||'Choose one small step')}</p><div class="actions" style="margin-top:14px"><button onclick="edit('projects','${p.id}')">Open project ↗</button></div></article>`}
function stat(value,label,p,c,text){return `<div class="stat"><div class="ring" style="--p:${Math.min(100,p)};--c:${c}" data-text="${esc(text)}"></div><div><small>${label}</small><strong>${value}</strong></div></div>`}
function dashboard(){const ps=state.data.projects,active=ps.filter(p=>!['Finished','Idea'].includes(p.status)),finished=ps.filter(p=>p.status==='Finished').length,stock=state.data.yarn.reduce((s,y)=>s+remaining(y,'grams'),0),hrs=state.sessions.reduce((s,t)=>s+t.seconds,0)/3600,deadlines=[...ps.map(p=>({...p,kind:'projects'})),...state.data.commissions.map(p=>({...p,kind:'commissions'})),...state.data.gifts.map(p=>({...p,kind:'gifts'}))].filter(p=>p.deadline&&!['Finished','Delivered','Cancelled','Sent'].includes(p.status)).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,5);return header('Make room for the things you love to make.',false)+`<section class="hero"><div><div class="eyebrow">${DEMO?'Sample studio • separate demo data':'A moment for your making'}</div><h2>Hello, ${esc(state.settings.name)}.</h2><p>${active.length?`${active.length} projects on your hook. One stitch at a time is enough.`:'Your next favourite project starts right here.'}</p><div class="actions"><button class="primary" onclick="edit('projects')">＋ New project</button><button onclick="edit('yarn')">＋ Add yarn</button><button onclick="go('timer')">◷ Start making</button></div></div><svg class="yarn-art" viewBox="0 0 200 160" aria-label="Decorative yarn illustration"><ellipse cx="103" cy="140" rx="72" ry="8" fill="#dbd4cb"/><circle cx="100" cy="82" r="56" fill="#b17d8d"/><g fill="none" stroke="#f2dce3" stroke-width="2" opacity=".7"><path d="M48 61Q115 46 132 126M47 70Q109 55 125 132M44 81Q105 68 116 136M48 93Q97 82 105 137M57 118Q65 55 108 27M65 126Q75 57 120 30M75 132Q83 65 131 37M86 136Q90 73 141 47M50 55Q111 110 153 99M57 43Q120 99 155 87M67 35Q121 84 153 74"/></g><path d="M145 115Q183 120 170 140Q163 151 189 148" stroke="#b17d8d" fill="none" stroke-width="4"/><path d="M129 87L177 15Q184 5 187 13Q190 18 183 21" stroke="#b58d48" fill="none" stroke-width="6" stroke-linecap="round"/></svg></section><div class="stats">${stat(active.length,'ON THE HOOK',ps.length?finished/ps.length*100:0,'var(--accent)',finished+' done')}${stat(hrs.toFixed(1)+' h','STUDIO TIME',Math.min(100,hrs/20*100),'var(--gold)','20h ref')}${stat(mass(stock),'YARN WAITING',stock/Math.max(1,state.data.yarn.reduce((s,y)=>s+num(y.grams),0))*100,'var(--sage)',state.data.yarn.length+' lots')}${stat(state.data.goals.filter(g=>goalValue(g)>=num(g.target)).length+'/'+state.data.goals.length,'GOALS REACHED',state.data.goals.length?state.data.goals.filter(g=>goalValue(g)>=num(g.target)).length/state.data.goals.length*100:0,'#8c7ca6','goals')}</div><div class="sectiontitle"><h2>On your hook</h2><button class="quiet" onclick="go('projects')">All projects →</button></div><div class="grid">${active.slice(0,3).map(projectCard).join('')||'<div class="card empty">Add a project, or explore the sample studio in Settings.</div>'}</div><div class="two" style="margin-top:24px"><section class="card"><div class="sectiontitle"><h2>Coming up</h2><span class="eyebrow">Your next steps</span></div>${deadlines.map(p=>`<div class="row"><div><p><span class="dot"></span>${esc(p.name)}</p><small>${esc(p.next||p.status)}</small></div><button onclick="edit('${p.kind}','${p.id}')">${esc(p.deadline)}</button></div>`).join('')||'<p class="muted">No deadlines. A little breathing room.</p>'}<div class="hint">✧ ${state.data.yarn.filter(y=>remaining(y,'grams')<=num(y.low)).length} yarn lots are at or below their low-stock threshold. <a href="#" onclick="go('yarn');return false">Review stash</a></div></section><section class="card"><div class="sectiontitle"><h2>Your making rhythm</h2><span class="eyebrow">Last 7 days</span></div>${timeBars()}<div class="hint">${state.backupDate?'Last backup: '+esc(state.backupDate):'Keep your studio safe: export a backup after a making session.'}<br><button class="quiet" onclick="exportBackup()">Export backup →</button></div></section></div><div class="two" style="margin-top:20px"><section class="card"><h2>Yarn by weight</h2>${yarnBars()}</section><section class="card"><h2>Project timeline</h2>${ps.filter(p=>p.deadline).sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,5).map(p=>`<div class="row"><span>${esc(p.deadline)}</span><span>${esc(p.name)}</span><span class="pill">${esc(p.status)}</span></div>`).join('')||'<p class="muted">Add project deadlines to see your timeline.</p>'}</section></div>`;}
function timeBars(){const ds=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d.toLocaleDateString('en-CA')});let vals=ds.map(d=>state.sessions.filter(t=>t.date===d).reduce((s,t)=>s+t.seconds,0)/3600),max=Math.max(1,...vals);return '<div class="bars">'+ds.map((d,i)=>`<div class="bar"><span>${vals[i].toFixed(1)}h</span><i style="height:${Math.max(2,vals[i]/max*80)}px"></i>${new Date(d+'T12:00').toLocaleDateString('en',{weekday:'short'})}</div>`).join('')+'</div>'}
function yarnBars(){const w={};state.data.yarn.forEach(y=>w[y.weight]=(w[y.weight]||0)+remaining(y,'grams'));let max=Math.max(1,...Object.values(w));return Object.entries(w).map(([k,v])=>`<div class="meta"><span>${esc(k)}</span><span>${mass(v)}</span></div><div class="progress"><i style="width:${v/max*100}%;background:var(--sage)"></i></div>`).join('')||'<p class="muted">Your stash chart appears here.</p>'}
function fieldHTML(f,r={}){let v=r[f.key]??(f.type==='date'?today():f.type==='number'?0:'');let input;if(f.type==='select'||f.type==='ref'){let opts=f.type==='ref'?[['','— Select —'],...state.data[f.options].map(r=>[r.id,r.name])]:f.options.map(x=>[x,x]);input=`<select name="${f.key}" aria-label="${esc(f.label)}">${opts.map(([id,n])=>`<option value="${esc(id)}" ${v===id?'selected':''}>${esc(n)}</option>`).join('')}</select>`}else if(f.type==='textarea')input=`<textarea name="${f.key}" ${f.key==='tasks'?'placeholder="Choose yarn\nMake a swatch\nWeave in ends"':''}>${esc(v)}</textarea>`;else input=`<input name="${f.key}" type="${f.type}" ${f.type==='checkbox'?(v?'checked':''):`value="${esc(v)}"`} ${f.key==='name'?'required maxlength="150"':''} ${f.type==='number'?'min="0" step="any"':''} ${f.key==='progress'?'max="100"':''}>`;return `<div class="field ${f.type==='textarea'?'full':''}"><label>${esc(f.label)}${input}</label></div>`}
function modal(html){const d=$('#modal');d.classList.remove('focus');d.innerHTML=html;if(!d.open)d.showModal()}
function closeModal(){ const wasFocus=focused;$('#modal').close();focused=null;if(wasFocus)render();}
function attachmentHTML(r){return (r.attachments||[]).map((a,i)=>`<div class="attachment">${a.type.startsWith('image/')?`<img src="${a.data}" alt="${esc(a.name)}">`:''}<small>${esc(a.name)}</small><div><button type="button" onclick="downloadAttachment('${r.id}',${i})">Open</button><label><input type="checkbox" name="removeAttachment" value="${i}" style="width:auto"> Remove</label></div></div>`).join('')}
let editingKind=null;
function edit(k,id){editingKind=k;const r=id?get(k,id):{};if(!schemas[k])return;modal(`<h2>${id?'Edit':'New'} ${singular(k)}</h2><form id="editor"><div class="fields">${schemas[k].map(f=>fieldHTML(f,r)).join('')}<div class="field full"><label>Attach photos or PDF (up to 1 MB each)<input type="file" id="files" multiple accept="image/png,image/jpeg,image/webp,application/pdf"></label><small>Attachments use browser storage. Keep full-size originals separately.</small><div class="attachments">${attachmentHTML(r)}</div></div></div><footer>${id?`<button type="button" class="danger" onclick="removeRecord('${k}','${id}')">Delete</button>`:''}<button type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save ${singular(k)}</button></footer></form>`);$('#editor').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),out={...r,id:id||uid(),created:r.created||today()};schemas[k].forEach(f=>out[f.key]=f.type==='checkbox'?fd.has(f.key):f.type==='number'?num(fd.get(f.key)):fd.get(f.key));if(k==='counters'&&['value','target','repeat'].some(n=>!Number.isInteger(out[n]))){toast('Counter values, targets and repeat lengths must be whole numbers.');return}if(k==='goals'&&out.target<=0){toast('Set a goal target greater than zero.');return}if(k==='projects'){out.progress=Math.min(100,out.progress);if(out.status==='Finished'){out.progress=100;out.completed=r.completed||today()}else delete out.completed}if(k==='usage'){if(!out.yarn){toast('Choose a yarn lot first.');return}let y=get('yarn',out.yarn);if(out.grams>0&&out.metres===0&&y.grams>0)out.metres=Math.round(out.grams*y.metres/y.grams*100)/100;for(let unit of ['grams','metres']){let available=remaining(y,unit)+(r.yarn===out.yarn?num(r[unit]):0);if(out[unit]>available+.0001){toast(`Not enough ${unit} in this lot. Available: ${available.toFixed(1)}`);return}}}if(k==='yarn'){for(let unit of ['grams','metres']){let used=state.data.usage.filter(u=>u.yarn===id).reduce((s,u)=>s+num(u[unit]),0);if(out[unit]<used){toast('Starting stock cannot be less than logged usage.');return}}}out.attachments=(r.attachments||[]).filter((a,i)=>!fd.getAll('removeAttachment').includes(String(i)));const files=Array.from($('#files').files);if(files.some(f=>f.size>1024*1024||!['image/png','image/jpeg','image/webp','application/pdf'].includes(f.type))){toast('Use PNG, JPG, WebP or PDF files of 1 MB or less.');return}for(const f of files){out.attachments.push({name:f.name,type:f.type,data:await new Promise((res,rej)=>{let fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)})})}if(id)state.data[k][state.data[k].findIndex(x=>x.id===id)]=out;else state.data[k].push(out);save();closeModal();render();toast('Saved to your studio');};}
function removeRecord(k,id){const links=Object.entries(schemas).flatMap(([key,fs])=>fs.filter(f=>f.type==='ref'&&f.options===k).flatMap(f=>state.data[key].filter(r=>r[f.key]===id).map(r=>key+': '+r.name)));if(links.length){toast('Linked records exist. Edit or delete them first: '+links.slice(0,3).join(', '));return}if(state.timer?.project===id&&k==='projects'){toast('Stop the project timer before deleting.');return}if(!confirm('Delete this entry? This cannot be undone.'))return;state.data[k]=state.data[k].filter(x=>x.id!==id);save();closeModal();render();}
function downloadAttachment(id,i){const a=get(editingKind,id).attachments[i];const blob=dataBlob(a.data);download(a.name,blob,a.type)}
function dataBlob(d){let parts=d.split(','),b=atob(parts[1]);return new Uint8Array([...b].map(c=>c.charCodeAt(0)))}
function records(k){const rows=state.data[k]||[];let desc={projects:'Every WIP has a home. Keep your next step close.',yarn:'Separate lots, honest totals. Usage is deducted automatically.',usage:'Edit or delete entries to correct totals. Enter 0 metres to estimate metres from this lot’s starting ratio.',patterns:'Keep pattern details, favourites and your own PDF attachments together.',goals:'Automatically measured from records within each goal’s date window.',payments:'One entry per payment. Commission balances update automatically.',market:'Stock quantities are managed here; sales are logged separately.',testing:'Record real maker evidence. A log entry does not certify a pattern.'}[k]||'A calm place to keep the details that matter.';let body=header(desc)+`<div class="toolbar no-print"><input placeholder="Filter ${title().toLowerCase()}…" aria-label="Filter entries" oninput="filterRecords(this.value)"><button onclick="exportCSV('${k}')">Export CSV</button></div><div id="recordContent">${recordContent(k,rows)}</div>`;return body;}
function filterRecords(v){filter=v.toLowerCase();$('#recordContent').innerHTML=recordContent(page,state.data[page].filter(r=>JSON.stringify(r).toLowerCase().includes(filter)))}
function recordContent(k,rows){if(!rows.length)return `<div class="card empty"><h2>Your next chapter starts here.</h2><p>Add your first ${singular(k)} to get started.</p><button style="margin-top:18px" class="primary" onclick="edit('${k}')">＋ Add ${singular(k)}</button></div>`;if(k==='projects')return '<div class="grid">'+rows.map(projectCard).join('')+'</div>';if(k==='ideas')return '<div class="grid">'+rows.map(r=>`<div class="card"><span class="pill">${esc(r.priority)}</span><h2>${esc(r.name)}</h2><p class="muted">${esc(r.category)}</p><div class="actions" style="margin:18px 0">${String(r.palette||'').split(',').map(x=>x.trim()).filter(x=>/^#[0-9a-f]{6}$/i.test(x)).map(x=>`<span class="swatch" title="${x}" style="display:inline-block;background:${x}"></span>`).join('')}</div><p>${esc(r.notes)}</p><button style="margin-top:15px" onclick="edit('ideas','${r.id}')">Open idea</button></div>`).join('')+'</div>';if(k==='goals')return '<div class="grid">'+rows.map(g=>{let v=goalValue(g),p=g.target?Math.min(100,v/g.target*100):0;return `<div class="card"><span class="pill">${esc(g.metric)}</span><h2>${esc(g.name)}</h2><div class="bigresult">${v.toFixed(1)} / ${g.target}</div><div class="progress"><i style="width:${p}%"></i></div><p class="muted">${esc(g.start)} → ${esc(g.deadline)}</p><button onclick="edit('goals','${g.id}')">Edit goal</button></div>`}).join('')+'</div>';if(k==='checklists')return '<div class="grid">'+rows.map(r=>`<div class="card checklist"><h2>${esc(r.name)}</h2><p class="muted">${esc(ref('projects',r.project))}</p>${String(r.tasks).split('\n').filter(Boolean).map((t,i)=>`<label style="margin:14px 0"><input type="checkbox" ${r.checked?.[i]?'checked':''} onchange="toggleTask('${r.id}',${i},this.checked)">${esc(t)}</label>`).join('')}<button onclick="edit('checklists','${r.id}')">Edit checklist</button></div>`).join('')+'</div>';let fs=schemas[k].filter(f=>!['textarea','color'].includes(f.type)).slice(0,7);return '<div class="card tablewrap"><table><thead><tr>'+fs.map(f=>'<th>'+esc(f.label)+'</th>').join('')+((k==='yarn'||k==='commissions'||k==='sales'||k==='testing')?'<th>Live result</th>':'')+'<th></th></tr></thead><tbody>'+rows.map(r=>'<tr>'+fs.map(f=>`<td>${cell(f,r)}</td>`).join('')+(k==='yarn'?`<td>${mass(remaining(r,'grams'))}<br>${length(remaining(r,'metres'))}${remaining(r,'grams')<=num(r.low)?'<br><span class="danger">Low stock</span>':''}</td>`:k==='commissions'?`<td>${money(r.price-paid(r.id))} due<br><button onclick="invoice('${r.id}')">Invoice</button></td>`:k==='sales'?`<td>${money(r.revenue-r.cost)} profit</td>`:k==='testing'?`<td>${num(r.actual)-num(r.expected)} stitch difference</td>`:'')+`<td><button onclick="edit('${k}','${r.id}')">Edit</button>${k==='care'?` <button onclick="printCare('${r.id}')">Print label</button>`:''}</td></tr>`).join('')+'</tbody></table></div>'}
function cell(f,r){let v=r[f.key];if(f.type==='ref')return esc(ref(f.options,v));if(f.type==='checkbox')return v?'✓':'—';if(f.type==='url')return /^https?:\/\//i.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">Open link ↗</a>`:'—';return esc(v||'—')}
function toggleTask(id,i,b){let r=get('checklists',id);r.checked=r.checked||{};r.checked[i]=b;save()}
function goalValue(g){const within=d=>(!g.start||d>=g.start)&&(!g.deadline||d<=g.deadline);return g.metric==='Finished projects'?state.data.projects.filter(p=>p.status==='Finished'&&within(p.completed||p.created)).length:g.metric==='Studio hours'?state.sessions.filter(t=>within(t.date)).reduce((s,t)=>s+t.seconds/3600,0):g.metric==='Yarn used (g)'?state.data.usage.filter(t=>within(t.date)).reduce((s,t)=>s+num(t.grams),0):state.data.sales.filter(t=>within(t.date)).reduce((s,t)=>s+num(t.revenue),0)}
function board(){return header('Drag a project between columns, or use its status menu on any device.',false)+`<div class="board">${['Idea','In progress','Blocking','Finished'].map(s=>`<section class="lane" data-status="${s}" ondragover="event.preventDefault()" ondrop="moveProject(event.dataTransfer.getData('text/plain'),'${s}')"><h3>${s} <small> ${state.data.projects.filter(p=>p.status===s).length}</small></h3>${state.data.projects.filter(p=>p.status===s).map(p=>`<div class="card" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${p.id}')"><button class="draghandle" data-project="${p.id}" aria-label="Drag ${esc(p.name)}" style="touch-action:none;float:right;padding:2px 7px">⠿</button><h3>${esc(p.name)}</h3><small>${esc(p.next)}</small><div class="progress"><i style="width:${p.progress}%"></i></div><select aria-label="Status of ${esc(p.name)}" onchange="moveProject('${p.id}',this.value)">${['Idea','In progress','Blocking','Finished'].map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('')}</select><button class="quiet" onclick="edit('projects','${p.id}')">Open →</button></div>`).join('')}</section>`).join('')}</div>`}
function moveProject(id,s){let p=get('projects',id);if(!p)return;p.status=s;if(s==='Finished'){p.progress=100;p.completed=today()}else delete p.completed;save();render()}
function counterCard(c,focus=false){let repeat=num(c.repeat),v=num(c.value);return `<div class="card"><div class="meta"><span class="pill">${esc(c.kind)}</span><span>${esc(ref('projects',c.project))}</span></div><h2>${esc(c.name)}</h2><div class="counter-num">${v}</div><p style="text-align:center" class="muted">${repeat?`Next: repeat ${Math.floor(v/repeat)+1}, row ${v%repeat+1} of ${repeat}`:`Target: ${c.target||'free counting'}`}</p><div class="progress"><i style="width:${c.target?Math.min(100,v/c.target*100):0}%"></i></div><div class="counter-controls"><button onclick="count('${c.id}',-1)">−</button><button class="primary" onclick="count('${c.id}',1)">＋ ${esc(c.kind.slice(0,-1))}</button><button onclick="undoCount('${c.id}')" aria-label="Undo last count">↶</button></div><div class="actions" style="margin-top:14px"><button class="quiet" onclick="${focus?'closeModal()':`focusCounter('${c.id}')`}">${focus?'Close focus':'⛶ Focus'}</button><button class="quiet" onclick="focused=null;edit('counters','${c.id}')">Edit</button><button class="quiet" onclick="resetCounter('${c.id}')">Reset</button></div></div>`}
function counters(){return header('Big buttons. Multiple counters. One less thing to remember.')+'<div class="grid">'+(state.data.counters.map(c=>counterCard(c)).join('')||'<div class="card empty">Create a row, round, stitch or repeat counter.</div>')+'</div>'}
function count(id,n){let c=get('counters',id);c.previous=c.value;c.value=Math.max(0,num(c.value)+n);save();if(focused)focusCounter(id);else render()}
function undoCount(id){let c=get('counters',id);if(c.previous==null)return;[c.value,c.previous]=[c.previous,c.value];save();if(focused)focusCounter(id);else render()}
function resetCounter(id){if(!confirm('Reset this counter to zero?'))return;let c=get('counters',id);c.previous=c.value;c.value=0;save();if(focused)focusCounter(id);else render()}
function focusCounter(id){focused=id;modal(counterCard(get('counters',id),true));$('#modal').classList.add('focus')}
function newChart(){modal(`<h2>New colorwork chart</h2><form id="chartform"><div class="fields">${[F('name','Chart name'),F('width','Columns (2–60)','number'),F('height','Rows (2–60)','number'),F('mode','Chart style','select',['Tapestry','Graphgan','C2C','Mosaic planning'])].map(f=>fieldHTML(f,{width:20,height:20})).join('')}</div><p class="hint">A visual planning grid. C2C cells represent blocks; mosaic grids still need a technique-specific stitch plan.</p><footer><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Create chart</button></footer></form>`);$('#chartform').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target),w=Math.floor(num(fd.get('width'))),h=Math.floor(num(fd.get('height')));if(w<2||w>60||h<2||h>60){toast('Use whole dimensions from 2 to 60.');return}let c={id:uid(),name:fd.get('name'),width:w,height:h,mode:fd.get('mode'),cells:Array(w*h).fill('#fffefa')};state.charts.push(c);chartId=c.id;save();closeModal();render()}}
function chartCurrent(){return state.charts.find(c=>c.id===chartId)||state.charts[0]}
function charts(){let c=chartCurrent();if(c)chartId=c.id;return header('Paint your own design. Numbered rows, colour counts and printable charts.',false)+`<div class="toolbar no-print"><button class="primary" onclick="newChart()">＋ New chart</button>${c?`<select style="max-width:260px" aria-label="Select chart" onchange="chartId=this.value;undoStack=[];render()">${state.charts.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button onclick="deleteChart()">Delete</button>`:''}</div>`+(!c?'<div class="card empty"><h2>A blank canvas for your next idea.</h2><p>Create a chart to start painting.</p></div>':`<div class="card"><div class="sectiontitle"><div><h2>${esc(c.name)}</h2><p class="muted">${c.width} × ${c.height} • ${esc(c.mode)}</p></div><button class="no-print" onclick="exportChartSVG()">Download SVG</button></div><div class="actions no-print" style="margin-bottom:18px">${['#fffefa','#ac6a7c','#704357','#638575','#c7a66a','#30313c','#a69bc2','#d99966'].map(x=>`<button class="swatch ${paint===x?'selected':''}" style="background:${x}" title="${x}" aria-label="Paint ${x}" onclick="paint='${x}';render()"></button>`).join('')}<input type="color" aria-label="Custom paint colour" value="${paint}" style="width:50px" onchange="paint=this.value"><button onclick="undoPaint()">Undo stroke</button><button onclick="mirrorChart()">Mirror</button><button onclick="symbolMode=!symbolMode;render()">${symbolMode?'Hide':'Show'} symbols</button></div><div class="chartscroll"><div class="chartgrid" id="chartgrid" style="grid-template-columns:repeat(${c.width+1},25px)">${chartCells(c)}</div></div><div id="chartLegend">${chartLegend(c)}</div><p class="caption">Rows are numbered bottom to top; columns left to right. ${c.mode==='C2C'?'Each cell is one C2C block. Work order is diagonal and not encoded.':c.mode==='Mosaic planning'?'Planning grid only: this does not validate mosaic stitch feasibility.':'Each cell represents one planned stitch or block, according to your technique.'} Tap cells or drag to paint. Keyboard: Tab to a cell, Enter to paint.</p></div>`)}
function symbols(c){return Object.fromEntries([...new Set(c.cells)].map((x,i)=>[x,String.fromCharCode(65+i)]))}
function chartCells(c){let sy=symbols(c),html='<span class="axis"></span>'+Array.from({length:c.width},(_,i)=>`<span class="axis">${i+1}</span>`).join('');for(let y=0;y<c.height;y++){html+=`<span class="axis">${c.height-y}</span>`;for(let x=0;x<c.width;x++){let i=y*c.width+x;html+=`<button class="pixel" data-i="${i}" style="background:${c.cells[i]}" aria-label="Row ${c.height-y}, column ${x+1}, ${c.cells[i]}" onclick="keyboardPaint(event,${i})">${symbolMode?sy[c.cells[i]]:''}</button>`}}return html}
function chartLegend(c){let counts={};c.cells.forEach(v=>counts[v]=(counts[v]||0)+1);let sy=symbols(c);return '<div class="actions" style="margin-top:18px">'+Object.entries(counts).map(([v,n])=>`<span><i class="dot" style="background:${v};border:1px solid #888"></i>${sy[v]} ${v}: <b>${n}</b></span>`).join('')+'</div>'}
function bindChart(){const grid=$('#chartgrid');if(!grid)return;let drawing=false;grid.onpointerdown=e=>{const b=e.target.closest('[data-i]');if(!b)return;e.preventDefault();undoStack.push([...chartCurrent().cells]);if(undoStack.length>30)undoStack.shift();drawing=true;grid.setPointerCapture(e.pointerId);paintCell(+b.dataset.i)};grid.onpointermove=e=>{if(!drawing)return;let b=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-i]');if(b)paintCell(+b.dataset.i)};grid.onpointerup=grid.onpointercancel=e=>{if(drawing){drawing=false;save();$('#chartLegend').innerHTML=chartLegend(chartCurrent())}}}
function paintCell(i){let c=chartCurrent();c.cells[i]=paint;const b=$(`[data-i="${i}"]`);b.style.background=paint;b.textContent=symbolMode?symbols(c)[paint]:'';b.setAttribute('aria-label','Painted '+paint)}
function keyboardPaint(e,i){if(e.detail===0){undoStack.push([...chartCurrent().cells]);paintCell(i);save();$('#chartLegend').innerHTML=chartLegend(chartCurrent())}}
function undoPaint(){let c=chartCurrent();if(undoStack.length){c.cells=undoStack.pop();save();render()}}function mirrorChart(){let c=chartCurrent();undoStack.push([...c.cells]);for(let y=0;y<c.height;y++){let start=y*c.width;c.cells.splice(start,c.width,...c.cells.slice(start,start+c.width).reverse())}save();render()}
function deleteChart(){if(!confirm('Delete this chart?'))return;state.charts=state.charts.filter(c=>c.id!==chartId);chartId=null;undoStack=[];save();render()}
function exportChartSVG(){let c=chartCurrent(),sy=symbols(c);let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${(c.width+2)*24}" height="${(c.height+5)*24}"><rect width="100%" height="100%" fill="white"/><text x="24" y="20" font-family="sans-serif" font-size="14">${esc(c.name)}</text>`;for(let y=0;y<c.height;y++){svg+=`<text x="2" y="${y*24+65}" font-size="10">${c.height-y}</text>`;for(let x=0;x<c.width;x++){let color=c.cells[y*c.width+x];svg+=`<rect x="${x*24+24}" y="${y*24+48}" width="24" height="24" fill="${color}" stroke="#888" stroke-width=".5"/>${symbolMode?`<text x="${x*24+31}" y="${y*24+64}" font-size="10">${sy[color]}</text>`:''}`}}for(let x=0;x<c.width;x++)svg+=`<text x="${x*24+28}" y="42" font-size="10">${x+1}</text>`;svg+='</svg>';download(c.name+'.svg',svg,'image/svg+xml')}
function calculator(){return header('Estimate from your own swatch for a closer match. All dimensions use centimetres.',false)+`<div class="two"><section class="card"><h2>Swatch → project</h2><label style="margin:15px 0">Planning shape<select aria-label="Planning shape" onchange="applyPreset(this.value)"><option value="custom">Custom dimensions</option><option value="scarf">Scarf · 25 × 160 cm</option><option value="throw">Throw · 120 × 150 cm</option><option value="cushion">Cushion · two 40 × 40 cm panels</option><option value="tote">Tote · two 35 × 40 cm panels</option></select></label><p class="muted">Enter a swatch made with the intended stitch, yarn and hook.</p><div class="fields" style="margin-top:20px">${[F('sw','Swatch width (cm)','number'),F('sh','Swatch height (cm)','number'),F('sg','Swatch grams','number'),F('sm','Swatch metres (optional)','number'),F('pw','Project width (cm)','number'),F('ph','Project height (cm)','number'),F('pieces','Number of equal panels','number'),F('extra','Extra allowance %','number')].map(f=>fieldHTML(f,state.calc.swatch||{sw:10,sh:10,sg:8,sm:20,pw:100,ph:120,pieces:1,extra:15})).join('')}</div><button class="primary" style="margin-top:20px" onclick="calcSwatch()">Estimate yarn</button><div id="calcResult"></div><p class="caption">Area scaling is best for flat pieces. Shaping, seams, borders and stitch changes affect usage. Swatch and add an allowance.</p></section><section class="card"><h2>Foundation & row calculator</h2><div class="fields" style="margin-top:20px">${[F('st','Stitches per 10 cm','number'),F('rw','Rows per 10 cm','number'),F('cw','Target width (cm)','number'),F('ch','Target height (cm)','number'),F('multiple','Stitch multiple','number'),F('extraChains','Additional / turning chains','number')].map(f=>fieldHTML(f,{st:16,rw:12,cw:100,ch:120,multiple:1,extraChains:1})).join('')}</div><button style="margin-top:20px" onclick="calcGauge()">Calculate foundation</button><div id="gaugeResult"></div><h2 style="margin-top:30px">Stash substitution shortlist</h2><p class="muted">Matches by weight class and fibre text. Always confirm gauge, care and metres per gram.</p><select style="margin-top:12px" id="subYarn"><option value="">Select a yarn</option>${state.data.yarn.map(y=>`<option value="${y.id}">${esc(y.name)}</option>`).join('')}</select><button style="margin-top:10px" onclick="substitute()">Find candidates</button><div id="subResult"></div></section></div>`}
function applyPreset(k){let v={scarf:[25,160,1],throw:[120,150,1],cushion:[40,40,2],tote:[35,40,2]}[k];if(v)['pw','ph','pieces'].forEach((n,i)=>$(`[name="${n}"]`).value=v[i])}
function values(keys){return Object.fromEntries(keys.map(k=>[k,num($(`[name="${k}"]`).value)]))}
function calcSwatch(){let v=values(['sw','sh','sg','sm','pw','ph','pieces','extra']);if(Object.values(v).some(x=>x<0)||!v.sw||!v.sh||!v.sg||!v.pw||!v.ph||!v.pieces){toast('Enter positive dimensions, swatch grams and panel count.');return}let factor=v.pw*v.ph*v.pieces/v.sw/v.sh*(1+v.extra/100),g=v.sg*factor,m=v.sm*factor;state.calc.swatch=v;save();$('#calcResult').innerHTML=`<div class="bigresult">${mass(g)} ${v.sm?' / '+length(m):''}</div><h3>Check each dye lot separately</h3>${state.data.yarn.map(y=>`<div class="row"><span>${esc(y.name)}<br><small>Lot ${esc(y.lot||'unspecified')}</small></span><span>${remaining(y,'grams')>=g?'✓ Enough by weight':mass(g-remaining(y,'grams'))+' short'}</span></div>`).join('')||'<p>Add yarn to compare your stash.</p>'}`}
function calcGauge(){let v=values(['st','rw','cw','ch','multiple','extraChains']);if(Object.values(v).some(x=>x<0)||!v.st||!v.rw||!v.multiple||!v.cw||!v.ch){toast('Use positive gauge, dimensions and stitch multiple.');return}let stitches=Math.ceil(v.cw*v.st/10/v.multiple)*v.multiple;$('#gaugeResult').innerHTML=`<div class="hint"><b>${stitches+v.extraChains} foundation chains</b><br>${stitches} working stitches + ${v.extraChains} extra chains<br>${Math.ceil(v.ch*v.rw/10)} rows<br>Rounded width: ${(stitches/v.st*10).toFixed(1)} cm. Confirm how your pattern counts turning chains.</div>`}
function substitute(){let y=get('yarn',$('#subYarn').value);if(!y)return;let rows=state.data.yarn.filter(z=>z.id!==y.id&&z.weight===y.weight);$('#subResult').innerHTML=rows.map(z=>`<div class="row"><span>${esc(z.name)}<br><small>${esc(z.fibre)} • ${z.grams?(z.metres/z.grams).toFixed(2):'?'} m/g</small></span><span>${z.fibre.toLowerCase()===y.fibre.toLowerCase()?'Same fibre label':'Check fibre'}<br>${mass(remaining(z,'grams'))}</span></div>`).join('')||'<p class="hint">No other yarn in this weight class.</p>'}
function formatTime(s){s=Math.max(0,Math.floor(s));return [Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(v=>String(v).padStart(2,'0')).join(':')}
function timer(){let live=state.timer;return header('The timer uses elapsed clock time, including time while this page is closed.',false)+`<div class="two"><section class="card"><h2>Make a little space.</h2><p class="muted">Choose a project and settle into your stitches.</p><select id="timerProject" style="margin-top:20px" ${live?'disabled':''}><option value="">General studio time</option>${state.data.projects.map(p=>`<option value="${p.id}" ${live?.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="counter-num" id="clock">${live?formatTime((Date.now()-live.start)/1000):'00:00:00'}</div><div class="actions"><button class="primary" onclick="${live?'stopTimer()':'startTimer()'}">${live?'■ Stop & save session':'▶ Start timer'}</button><button onclick="manualTime()">＋ Log time manually</button></div><p class="hint">Forgot to stop? Edit the saved session below. The timer cannot detect whether you are actively crocheting.</p></section><section class="card"><h2>Time at a glance</h2>${timeBars()}<div class="row"><span>Today</span><b>${formatTime(state.sessions.filter(t=>t.date===today()).reduce((s,t)=>s+t.seconds,0))}</b></div><div class="row"><span>All recorded time</span><b>${formatTime(state.sessions.reduce((s,t)=>s+t.seconds,0))}</b></div>${state.data.projects.map(p=>`<div class="row"><span>${esc(p.name)}</span><span>${formatTime(state.sessions.filter(t=>t.project===p.id).reduce((s,t)=>s+t.seconds,0))}</span></div>`).join('')}</section></div><section class="card" style="margin-top:20px"><h2>Session log</h2>${state.sessions.slice().reverse().map(t=>`<div class="row"><span>${esc(t.date)} · ${esc(ref('projects',t.project))}<br><small>${esc(t.note||'')}</small></span><span>${formatTime(t.seconds)} <button onclick="manualTime('${t.id}')">Edit</button></span></div>`).join('')||'<p class="muted">Your first session will appear here.</p>'}</section>`}
function startTimer(){if(state.timer)return;state.timer={start:Date.now(),project:$('#timerProject').value};save();render()}
function stopTimer(){if(!state.timer)return;let t=state.timer;state.sessions.push({id:uid(),project:t.project,date:today(),seconds:Math.max(0,Math.round((Date.now()-t.start)/1000)),note:'Timer session'});state.timer=null;save();render()}
setInterval(()=>{if($('#clock')&&state.timer)$('#clock').textContent=formatTime((Date.now()-state.timer.start)/1000)},1000);
function manualTime(id){let r=state.sessions.find(t=>t.id===id)||{date:today(),seconds:1800};modal(`<h2>${id?'Edit':'Log'} studio time</h2><form id="timeForm"><div class="fields">${[F('project','Project','ref','projects'),F('date','Date','date'),F('minutes','Minutes','number'),F('note','Session notes')].map(f=>fieldHTML(f,{...r,minutes:r.seconds/60})).join('')}</div><footer>${id?'<button type="button" class="danger" id="deleteTime">Delete</button>':''}<button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save session</button></footer></form>`);if(id)$('#deleteTime').onclick=()=>{if(confirm('Delete session?')){state.sessions=state.sessions.filter(t=>t.id!==id);save();closeModal();render()}};$('#timeForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),o={id:id||uid(),project:d.get('project'),date:d.get('date'),seconds:num(d.get('minutes'))*60,note:d.get('note')};if(id)state.sessions[state.sessions.findIndex(t=>t.id===id)]=o;else state.sessions.push(o);save();closeModal();render()}}
function priceMath(v){if(Object.values(v).some(x=>!Number.isFinite(x)||x<0))return null;const cost=v.materials+v.hours*v.rate+v.overhead,denom=1-(v.fees+v.margin)/100;if(denom<=0)return null;let price=(cost+v.fixed)/denom,fee=price*v.fees/100+v.fixed,profit=price-fee-cost;return {cost,price,fee,profit,take:price-fee-v.materials-v.overhead,effective:v.hours?(price-fee-v.materials-v.overhead)/v.hours:0}}
function pricing(){return header('Build a price from your costs. Fee and margin inputs are your assumptions.',false)+`<div class="two"><section class="card"><h2>Know the value of your time.</h2><div class="fields" style="margin-top:20px">${[F('materials','Materials cost','number'),F('hours','Hours of work','number'),F('rate','Hourly labour rate','number'),F('overhead','Overhead allocation','number'),F('fees','Selling fees % of price','number'),F('fixed','Fixed fee per sale','number'),F('margin','Profit margin % of price','number')].map(f=>fieldHTML(f,state.pricing)).join('')}</div><button style="margin-top:20px" class="primary" onclick="calculatePrice()">Calculate & save</button><p class="caption">Margin is applied after materials, labour, overhead and fees. Taxes and shipping are not included unless entered in your costs.</p></section><section class="card" id="priceResult">${priceResult(state.pricing)}</section></div>`}
function priceResult(v){let p=priceMath(v);if(!p)return '<h2>Check percentages</h2><p>Use nonnegative costs. Fees plus margin must total less than 100%.</p>';return `<div class="eyebrow">Suggested selling price</div><div class="bigresult">${money(p.price)}</div><div class="row"><span>Materials + labour + overhead</span><b>${money(p.cost)}</b></div><div class="row"><span>Estimated fees</span><b>${money(p.fee)}</b></div><div class="row"><span>Profit after labour allocation</span><b>${money(p.profit)}</b></div><div class="row"><span>Maker pay incl. profit</span><b>${money(p.take)}</b></div><div class="row"><span>Effective hourly maker pay</span><b>${v.hours?money(p.effective)+'/h':'Set hours'}</b></div><p class="hint">Price = (materials + labour + overhead + fixed fee) ÷ (1 − fee rate − profit margin).</p>`}
function calculatePrice(){state.pricing=values(['materials','hours','rate','overhead','fees','fixed','margin']);save();$('#priceResult').innerHTML=priceResult(state.pricing)}
function customHome(){return header('Create your own trackers with text, number, date and checkbox columns.',false)+`<button class="primary" onclick="newCustom()">＋ Create tracking page</button><div class="grid" style="margin-top:20px">${state.custom.map(c=>`<div class="card"><h2>${esc(c.name)}</h2><p class="muted">${c.fields.length} fields · ${c.rows.length} records</p><div class="actions" style="margin-top:18px"><button onclick="go('custom:${c.id}')">Open page →</button><button class="quiet danger" onclick="deleteCustom('${c.id}')">Delete</button></div></div>`).join('')||'<div class="card empty">Try a workshop log, client notes or pattern release checklist.</div>'}</div>`}
function newCustom(){modal(`<h2>Your own tracking page</h2><form id="customForm"><label>Page name<input name="name" required maxlength="100"></label><label style="margin-top:15px">Fields, one per line: Label | type<textarea name="fields" required placeholder="Item | text\nDue date | date\nQuantity | number\nDone | checkbox"></textarea></label><small>Supported types: text, number, date, checkbox. Up to 12 fields.</small><footer><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Create page</button></footer></form>`);$('#customForm').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),fs=String(d.get('fields')).split('\n').filter(s=>s.trim()).slice(0,12).map((line,i)=>{let [label,t]=line.split('|').map(s=>s.trim());return F('f'+i,label,['number','date','checkbox'].includes(t)?t:'text')});let c={id:uid(),name:d.get('name'),fields:fs,rows:[]};state.custom.push(c);save();closeModal();go('custom:'+c.id)}}
function customPage(c){return `<div class="pagehead"><div><div class="eyebrow">Custom tracking page</div><h1>${esc(c.name)}</h1></div><button class="primary" onclick="customEdit('${c.id}')">＋ Add record</button></div><div class="actions" style="margin-bottom:20px"><button onclick="go('custom')">← All custom pages</button><button onclick="customCSV('${c.id}')">Export CSV</button><button onclick="printPage()">Print</button></div><div class="card tablewrap"><table><tr>${c.fields.map(f=>'<th>'+esc(f.label)+'</th>').join('')}<th></th></tr>${c.rows.map(r=>'<tr>'+c.fields.map(f=>'<td>'+cell(f,r)+'</td>').join('')+`<td><button onclick="customEdit('${c.id}','${r.id}')">Edit</button></td></tr>`).join('')}</table></div>`}
function customEdit(cid,rid){let c=state.custom.find(c=>c.id===cid),r=c.rows.find(r=>r.id===rid)||{};modal(`<h2>${rid?'Edit':'New'} record</h2><form id="customRow"><div class="fields">${c.fields.map(f=>fieldHTML(f,r)).join('')}</div><footer>${rid?'<button type="button" class="danger" id="deleteCustomRow">Delete</button>':''}<button type="button" onclick="closeModal()">Cancel</button><button class="primary">Save</button></footer></form>`);if(rid)$('#deleteCustomRow').onclick=()=>{if(confirm('Delete record?')){c.rows=c.rows.filter(r=>r.id!==rid);save();closeModal();render()}};$('#customRow').onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),o={id:rid||uid()};c.fields.forEach(f=>o[f.key]=f.type==='checkbox'?d.has(f.key):f.type==='number'?num(d.get(f.key)):d.get(f.key));if(rid)c.rows[c.rows.findIndex(r=>r.id===rid)]=o;else c.rows.push(o);save();closeModal();render()}}

function reference(){return header('A compact, editable-workflow companion. Your pattern and yarn label take priority.',false)+`<div class="grid"><section class="card"><h2>US ↔ UK terminology</h2>${refTable(['US term','UK term'],[['Slip stitch (sl st)','Slip stitch (ss)'],['Single crochet (sc)','Double crochet (dc)'],['Half double (hdc)','Half treble (htr)'],['Double crochet (dc)','Treble (tr)'],['Treble (tr)','Double treble (dtr)'],['Double treble (dtr)','Triple treble (trtr)']])}<p class="caption">Check which terminology a pattern uses before starting.</p></section><section class="card"><h2>Hook reference</h2>${refTable(['Metric','Common US label'],[['2.25 mm','B-1'],['2.75 mm','C-2'],['3.25 mm','D-3'],['3.5 mm','E-4'],['3.75 mm','F-5'],['4 mm','G-6'],['5 mm','H-8'],['5.5 mm','I-9'],['6 mm','J-10'],['6.5 mm','K-10½']])}<p class="caption">Letter sizes vary by manufacturer. Use millimetres and a swatch.</p></section><section class="card"><h2>Yarn categories</h2>${refTable(['Class','Common name'],[['0','Lace'],['1','Super fine / sock'],['2','Fine / sport'],['3','Light / DK'],['4','Medium / worsted'],['5','Bulky / chunky'],['6','Super bulky'],['7','Jumbo']])}</section><section class="card"><h2>Planning sizes</h2>${refTable(['Blanket type','Illustrative dimensions'],[['Small lap','90 × 120 cm'],['Throw','120 × 150 cm'],['Large throw','150 × 180 cm']])}<p class="hint">These are planning examples, not universal standards. Measure the intended use and adapt.</p><h3 style="margin-top:15px">Hat fit</h3><p class="muted">Measure the wearer’s head circumference and desired depth. Choose ease based on the actual fabric stretch; do not rely on age alone.</p></section><section class="card"><h2>Studio habits</h2><p>1. Make and measure a swatch.<br>2. Label every dye lot.<br>3. Log yarn usage once.<br>4. Save the next small step.<br>5. Export a backup regularly.</p></section><section class="card"><h2>Care first</h2><p>Use the yarn manufacturer’s washing and drying instructions. Blends need care suitable for every fibre. Test blocking on a swatch; heat can permanently change some fibres.</p></section></div>`}

function settings(){return header('Make this little studio feel like you.',false)+`<div class="two"><section class="card"><h2>Personalise your space</h2><form id="settingsForm" onsubmit="saveSettings(event)"><div class="fields" style="margin-top:20px">${fieldHTML(F('name','Your name'),state.settings)}${fieldHTML(F('currency','Currency symbol'),state.settings)}${fieldHTML(F('mass','Display weight','select',['g','oz']),state.settings)}${fieldHTML(F('length','Display length','select',['m','yd']),state.settings)}${fieldHTML(F('dark','Dark mode','checkbox'),state.settings)}</div><label style="margin-top:20px">Accent colour</label><div class="actions">${['#704357','#476b59','#315f7c','#7b5f8f','#9d553c','#73612c','#3c7070','#515768'].map(c=>`<label><input type="radio" name="accent" value="${c}" ${state.settings.accent===c?'checked':''} style="width:auto"><span class="swatch" style="display:inline-block;background:${c};vertical-align:middle"></span></label>`).join('')}</div><button class="primary" style="margin-top:20px">Save preferences</button></form><p class="caption">Stock entry and gauge calculations use grams, metres and centimetres. Display preferences convert stash totals and calculator results.</p></section><section class="card"><h2>Start your way</h2><p class="muted">Explore a fictional studio, or keep a clean space for your own work.</p><div class="actions" style="margin-top:20px"><button onclick="loadSample()">Load sample studio</button><button class="danger" onclick="clearStudio()">Start fresh</button></div><div class="hint"><b>Local data, no automatic cloud sync.</b><br>Use the same browser and keep this file in the same location. Moving or renaming an HTML file can change access to saved data. Export first.</div><h2 style="margin-top:25px">Opening on a phone</h2><p class="muted">Local HTML handling varies by mobile operating system and file app. Desktop Chrome/Edge is the primary offline workflow. On phones, open in a browser that supports local HTML; test on your device before relying on it.</p></section></div><section class="card" style="margin-top:20px"><h2>Quick start</h2><div class="grid" style="margin-top:18px"><p><b>01 / Add your materials</b><br>Enter each dye lot separately in Yarn stash. Attach small photos if helpful.</p><p><b>02 / Give your WIP a home</b><br>Create a project, link its pattern and yarn, and leave a next-step note.</p><p><b>03 / Make, log, back up</b><br>Use counters and the timer. Log yarn usage once, then export your backup.</p></div><p class="caption">Threadhaven v1.0 • No external fonts, scripts, analytics or network requests. Browser storage has limits. Keep backups and original attachments.</p></section>`}
function saveSettings(e){e.preventDefault();let d=new FormData(e.target);state.settings={...state.settings,name:d.get('name'),currency:String(d.get('currency')).slice(0,12),mass:d.get('mass'),length:d.get('length'),dark:d.has('dark'),accent:d.get('accent')||state.settings.accent};save();render();toast('Preferences saved')}
function clearStudio(){if(!confirm('Replace ALL studio data with an empty studio? Export a backup first.'))return;state=fresh();save();go('dashboard')}
function sample(){let s=fresh();s.settings.name='Alex';const d=new Date(),due=n=>{let x=new Date(d);x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')};s.data.yarn=[{id:'y1',name:'Rosewood merino',brand:'Sample Yarn Co.',colour:'#ad778a',fibre:'Merino wool',weight:'3 Light / DK',lot:'R-204',location:'Basket A',grams:500,metres:1100,cost:45,low:50},{id:'y2',name:'Garden sage cotton',brand:'Sample Yarn Co.',colour:'#819b83',fibre:'Cotton',weight:'4 Medium',lot:'S-118',location:'Shelf 2',grams:400,metres:680,cost:28,low:50},{id:'y3',name:'Golden oat',brand:'Sample Yarn Co.',colour:'#c7a66a',fibre:'Wool blend',weight:'5 Bulky',lot:'O-92',location:'Basket B',grams:250,metres:300,cost:22,low:60}];s.data.patterns=[{id:'pat1',name:'Weekend texture scarf',designer:'Sample pattern entry',difficulty:'Easy',category:'Accessories',notes:'Fictional demonstration record. No pattern instructions included.'}];s.data.projects=[{id:'p1',name:'Rosewood weekend scarf',status:'In progress',progress:64,deadline:due(8),pattern:'pat1',yarn:'y1',hook:4.5,next:'Finish repeat 8, then check length',created:today()},{id:'p2',name:'Sage market tote',status:'In progress',progress:35,deadline:due(15),yarn:'y2',hook:5,next:'Start the second handle',created:today()},{id:'p3',name:'Golden hour cushion',status:'Blocking',progress:90,deadline:due(3),yarn:'y3',hook:6,next:'Let dry fully before assembly',created:today()}];s.data.usage=[{id:'u1',name:'Scarf body so far',project:'p1',yarn:'y1',grams:120,metres:264,date:today()},{id:'u2',name:'Tote base',project:'p2',yarn:'y2',grams:90,metres:153,date:today()}];s.data.counters=[{id:'c1',name:'Scarf texture rows',project:'p1',kind:'Rows',value:24,target:80,repeat:4},{id:'c2',name:'Tote body rounds',project:'p2',kind:'Rounds',value:12,target:32,repeat:0}];s.data.commissions=[{id:'co1',name:'Custom rosewood scarf',client:'Sample client',project:'p1',status:'Making',price:95,deadline:due(8)}];s.data.payments=[{id:'pay1',name:'Deposit',commission:'co1',amount:35,date:today(),method:'Sample payment'}];s.data.goals=[{id:'g1',name:'A little making, often',metric:'Studio hours',target:20,start:due(-30),deadline:due(30)},{id:'g2',name:'Use what I love',metric:'Yarn used (g)',target:500,start:due(-30),deadline:due(30)}];s.data.checklists=[{id:'ch1',name:'Scarf finishing',project:'p1',tasks:'Check final length\nWeave in ends\nBlock gently\nPhotograph finished scarf\nAdd care label',checked:{}}];s.data.ideas=[{id:'i1',name:'A wildflower blanket',category:'Home',palette:'#ac6a7c,#638575,#c7a66a',priority:'Someday',notes:'Try three textured square variations.'}];s.data.shopping=[{id:'sh1',name:'Locking stitch markers',quantity:1,budget:5,bought:false}];for(let i=0;i<7;i++)s.sessions.push({id:'t'+i,date:due(-i),project:i%2?'p1':'p2',seconds:[1800,3600,2700,0,5400,2100,3900][i],note:'Sample making session'});let c={id:'chart1',name:'Little diamond',mode:'Tapestry',width:17,height:17,cells:Array(289).fill('#fffefa')};for(let y=0;y<17;y++)for(let x=0;x<17;x++)if(Math.abs(x-8)+Math.abs(y-8)<=6)c.cells[y*17+x]=Math.abs(x-8)+Math.abs(y-8)<=3?'#704357':'#ac6a7c';s.charts=[c];return s;}
function loadSample(){if(!confirm('Replace current data with fictional sample records? Export a backup first.'))return;state=sample();save();go('dashboard')}
function download(name,data,type='application/json'){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function exportBackup(){state.backupDate=today();save();download('Threadhaven-backup-'+today()+'.json',JSON.stringify({app:'Threadhaven',version:1,savedAt:new Date().toISOString(),state},null,2));toast('Backup exported. Keep it somewhere safe.')}
function validBackup(s){if(!s||s.version!==1||!s.settings||typeof s.settings.name!=='string'||!/^#[0-9a-f]{6}$/i.test(s.settings.accent)||!s.data||!Array.isArray(s.charts)||!Array.isArray(s.custom)||!Array.isArray(s.sessions))throw Error('Not a valid Threadhaven backup');for(let k of Object.keys(schemas)){if(!Array.isArray(s.data[k]))throw Error('Missing '+k);for(let r of s.data[k]){if(typeof r.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(r.id))throw Error('Invalid record ID');for(let f of schemas[k]){if(f.type==='number'&&r[f.key]!=null&&(!Number.isFinite(r[f.key])||r[f.key]<0))throw Error('Invalid number');}for(let a of r.attachments||[]){if(!['image/png','image/jpeg','image/webp','application/pdf'].includes(a.type)||!new RegExp('^data:'+a.type.replace('/','\/')+';base64,[A-Za-z0-9+/=]+$').test(a.data))throw Error('Invalid attachment')}}}for(let c of s.charts){if(!/^[a-zA-Z0-9-]+$/.test(c.id)||!Number.isInteger(c.width)||!Number.isInteger(c.height)||c.width<2||c.width>60||c.height<2||c.height>60||!Array.isArray(c.cells)||c.cells.length!==c.width*c.height||c.cells.some(x=>!/^#[0-9a-f]{6}$/i.test(x)))throw Error('Invalid chart')}for(let c of s.custom){if(!/^[a-zA-Z0-9-]+$/.test(c.id)||!Array.isArray(c.fields)||!Array.isArray(c.rows)||c.fields.some(f=>!/^f\d+$/.test(f.key)||!['text','number','date','checkbox'].includes(f.type))||c.rows.some(r=>!/^[a-zA-Z0-9-]+$/.test(r.id)))throw Error('Invalid custom page')}for(let t of s.sessions)if(!/^[a-zA-Z0-9-]+$/.test(t.id)||!Number.isFinite(t.seconds)||t.seconds<0)throw Error('Invalid time session');if(s.timer&&(!Number.isFinite(s.timer.start)||typeof s.timer.project!=='string'))throw Error('Invalid timer');return s}
async function restoreBackup(file){if(!file)return;try{if(file.size>30*1024*1024)throw Error('Backup is too large (30 MB limit)');let b=JSON.parse(await file.text());if(b.app!=='Threadhaven')throw Error('Choose a Threadhaven backup');let incoming=validBackup(b.state);if(!confirm('Replace all current records with this backup? Export current data first.'))return;state=incoming;save();go('dashboard');toast('Backup restored')}catch(e){toast('Restore failed: '+e.message)}}
function csvValue(x){let s=String(x??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csvFor(fs,rows){return [fs.map(f=>f.label),...rows.map(r=>fs.map(f=>f.type==='ref'?ref(f.options,r[f.key]):r[f.key]))].map(r=>r.map(csvValue).join(',')).join('\r\n')}
function exportCSV(k){download('Threadhaven-'+k+'.csv','\ufeff'+csvFor(schemas[k],state.data[k]),'text/csv;charset=utf-8')}
function customCSV(id){let c=state.custom.find(c=>c.id===id);download('Threadhaven-'+c.name+'.csv','\ufeff'+csvFor(c.fields,c.rows),'text/csv;charset=utf-8')}
function exportAllCSV(){let rows=[['Section','Record','Field','Value']];for(let [k,fs] of Object.entries(schemas))for(let r of state.data[k])for(let f of fs)rows.push([k,r.name,f.label,f.type==='ref'?ref(f.options,r[f.key]):r[f.key]]);for(let t of state.sessions)rows.push(['time',t.id,'minutes',t.seconds/60],['time',t.id,'date',t.date]);download('Threadhaven-all-records.csv','\ufeff'+rows.map(r=>r.map(csvValue).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function printPage(){document.body.classList.remove('print-document');window.print()}
function printDoc(html){$('#printArea').innerHTML=`<div style="padding:35px;font:14px/1.7 system-ui;color:#222">${html}<p style="margin-top:30px;font-size:10px">Threadhaven • ${esc(today())}</p></div>`;document.body.classList.add('print-document');window.print()}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-document'));
function invoice(id){let c=get('commissions',id),ps=state.data.payments.filter(p=>p.commission===id);printDoc(`<div style="display:flex;justify-content:space-between"><div><h1>INVOICE</h1><p>${esc(state.settings.name)}</p></div><div>Reference: ${esc(c.id.slice(0,8))}<br>Due: ${esc(c.deadline||'Not set')}</div></div><hr><h2>For ${esc(c.client)}</h2><p>${esc(c.email)}</p><table><tr><th>Description</th><th>Amount</th></tr><tr><td>${esc(c.name)}</td><td>${money(c.price)}</td></tr>${ps.map(p=>`<tr><td>Payment received: ${esc(p.date)} • ${esc(p.method)}</td><td>− ${money(p.amount)}</td></tr>`).join('')}<tr><td><b>Balance</b></td><td><b>${money(c.price-paid(id))}</b></td></tr></table><p>${esc(c.notes)}</p><p>Thank you for supporting handmade.</p>`)}
function careIcons(c){let wash=c.wash==='Do not wash'?'<path d="M7 7L43 43M43 7L7 43"/>':c.wash==='Dry clean only'?'<circle cx="25" cy="25" r="17"/>':`<path d="M6 15L11 37H39L44 15M8 20Q15 14 22 20T42 20"/>${c.wash==='Hand wash cool'?'<text x="17" y="32" font-size="9" stroke="none" fill="black">H</text>':'<path d="M12 42H38"/>'}`;let dry=c.dry==='Lay flat to dry'?'<path d="M9 25H41"/>':c.dry==='Hang to dry'?'<path d="M10 17Q25 0 40 17"/>':`<circle cx="25" cy="25" r="16"/>${c.dry==='Do not tumble dry'?'<path d="M5 5L45 45M45 5L5 45"/>':'<circle cx="25" cy="25" r="2" fill="black"/>'}`;let iron='<path d="M6 36Q9 20 20 20H38L44 36ZM20 13H35L38 20"/>'+ (c.iron==='Do not iron'?'<path d="M5 5L45 45M45 5L5 45"/>':c.iron==='Cool iron'?'<circle cx="26" cy="29" r="2" fill="black"/>':'<circle cx="23" cy="29" r="2" fill="black"/><circle cx="31" cy="29" r="2" fill="black"/>');return '<div style="display:flex;gap:20px;margin:15px 0">'+[wash,'<rect x="5" y="5" width="40" height="40"/>'+dry,iron].map(x=>'<svg width="45" height="45" viewBox="0 0 50 50" fill="none" stroke="black" stroke-width="2">'+x+'</svg>').join('')+'</div>'}
function printCare(id){let c=get('care',id);printDoc(`<div style="border:1px solid #bbb;border-radius:12px;padding:30px;width:380px;max-width:100%"><p style="letter-spacing:3px;font-size:10px">MADE WITH CARE</p><h1>${esc(c.name)}</h1><p>Handmade by ${esc(c.madeby)}</p><hr>${careIcons(c)}<p><b>Fibre:</b> ${esc(c.fibre)}</p><p>${esc(c.wash)}<br>${esc(c.dry)}<br>${esc(c.iron)}</p><p>${esc(c.notes)}</p><p style="font-size:11px">Follow the original yarn label instructions.</p></div>`)}
function studioReport(){printDoc(`<h1>Your studio snapshot</h1><p>${esc(state.settings.name)} • ${today()}</p><h2>Projects</h2>${refTable(['Project','Status','Progress','Next step'],state.data.projects.map(p=>[esc(p.name),esc(p.status),p.progress+'%',esc(p.next)]))}<h2 style="margin-top:25px">Yarn stash</h2>${refTable(['Yarn','Dye lot','Remaining'],state.data.yarn.map(y=>[esc(y.name),esc(y.lot),mass(remaining(y,'grams'))+' / '+length(remaining(y,'metres'))]))}<h2 style="margin-top:25px">Commissions</h2>${refTable(['Order','Client','Balance'],state.data.commissions.map(c=>[esc(c.name),esc(c.client),money(c.price-paid(c.id))]))}`)}
function downloadPlanner(){download('Threadhaven-Crochet-Planner.html',originalHTML,'text/html')}
function globalSearch(q){if(!q.trim()){render();return}let hits=[];for(let [k,rows] of Object.entries(state.data))rows.forEach(r=>{if(schemas[k].some(f=>String(r[f.key]||'').toLowerCase().includes(q.toLowerCase())))hits.push({k,r})});$('#main').innerHTML=`<div class="pagehead"><div><h1>Search your studio</h1><p>${hits.length} matches for “${esc(q)}”</p></div></div><div class="card">${hits.slice(0,80).map(({k,r})=>`<div class="row"><div><h3>${esc(r.name)}</h3><small>${esc(k)}</small></div><button onclick="edit('${k}','${r.id}')">Open →</button></div>`).join('')||'<p class="empty">No matching records.</p>'}</div>`}
function bindBoard(){let id=null;document.querySelectorAll('.draghandle').forEach(h=>{h.onpointerdown=e=>{id=h.dataset.project;h.setPointerCapture(e.pointerId);h.style.background='var(--soft)';e.preventDefault()};h.onpointerup=e=>{let lane=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-status]');if(id&&lane)moveProject(id,lane.dataset.status);id=null;h.style.background='';};h.onpointercancel=()=>{id=null;h.style.background='';}})}
function projectSheets(){printDoc(state.data.projects.map(p=>`<article style="break-after:page"><h1>${esc(p.name)}</h1><p>${esc(p.status)} · ${num(p.progress)}% complete · Due ${esc(p.deadline||'not set')}</p><p><b>Pattern:</b> ${esc(ref('patterns',p.pattern))}<br><b>Yarn:</b> ${esc(ref('yarn',p.yarn))}<br><b>Hook:</b> ${esc(p.hook)} mm</p><h2>Next step</h2><p>${esc(p.next)}</p><h2>Notes</h2><p style="white-space:pre-wrap">${esc(p.notes)}</p>${(p.attachments||[]).filter(a=>a.type.startsWith('image/')).map(a=>`<img src="${a.data}" style="max-width:250px;max-height:220px;margin:10px" alt="${esc(a.name)}">`).join('')}</article>`).join(''))}
window.addEventListener('storage',e=>{if(e.key===KEY)toast('Studio changed in another tab. Reload before editing to avoid overwriting changes.');});
const originalHTML='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
if(DEMO){try{if(!localStorage.getItem(KEY)){state=sample();save()}}catch(e){state=sample()}}
render();if(!storageOK)toast('Saved data could not be loaded. Restore a backup before making changes.');
</script><style id="demo-readonly-style">
#demoReadOnlyNotice{position:sticky;top:0;z-index:999999;background:#203f35;color:#fff;text-align:center;padding:10px 14px;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.2px;box-shadow:0 2px 10px #0002}
#demoReadOnlyNotice span{opacity:.85;font-weight:400}
input[readonly],textarea[readonly],select:disabled{opacity:.72!important;cursor:not-allowed!important}
.demo-action-blocked{opacity:.55!important;cursor:not-allowed!important}
</style>
<script id="demo-readonly-guard">
(()=> {
 const blocked=/^(save|save changes|delete|remove|clear all|reset|restore|import|export|download|upload|submit|confirm|add new|create new|duplicate|back up|backup)$/i;
 const lock=()=>{
  document.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]),textarea').forEach(el=>{el.readOnly=true;el.setAttribute('aria-readonly','true')});
  document.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(el=>{el.disabled=true;el.setAttribute('aria-disabled','true')});
  document.querySelectorAll('[contenteditable="true"],[contenteditable=""]').forEach(el=>{el.contentEditable='false'});
  document.querySelectorAll('button').forEach(el=>{
   const label=(el.innerText||el.getAttribute('aria-label')||el.title||'').trim().replace(/\s+/g,' ');
   if(blocked.test(label)){el.classList.add('demo-action-blocked');el.setAttribute('aria-disabled','true');}
   else {el.disabled=false;el.removeAttribute('aria-disabled');}
  });
  document.querySelectorAll('a[download]').forEach(el=>{el.removeAttribute('download');el.setAttribute('aria-disabled','true')});
 };
 const addNotice=()=>{
  if(document.getElementById('demoReadOnlyNotice'))return;
  const n=document.createElement('div');n.id='demoReadOnlyNotice';
  n.innerHTML='INTERACTIVE PREVIEW <span>— explore tabs, menus and sections; data entry and saving are disabled</span>';
  document.body.insertBefore(n,document.body.firstChild);
 };
 const start=()=>{
  addNotice();lock();
  new MutationObserver(()=>lock()).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['disabled','contenteditable','readonly']});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
 document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(!b)return;
  const label=(b.innerText||b.getAttribute('aria-label')||b.title||'').trim().replace(/\s+/g,' ');
  if(blocked.test(label)){e.preventDefault();e.stopImmediatePropagation();}
 },true);
 document.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
 document.addEventListener('beforeinput',e=>{
  if(e.target.matches('input:not([type="button"]):not([type="submit"]),textarea,[contenteditable="true"]')){e.preventDefault();e.stopImmediatePropagation()}
 },true);
})();
</script></body></html>
