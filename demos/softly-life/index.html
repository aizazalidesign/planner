views.Today=()=>{let ts=data.tasks.filter(t=>t.date===today()),done=ts.filter(t=>t.done).length,ds=last7(),counts=ds.map(d=>data.tasks.filter(t=>t.done&&t.completedAt===d).length),focus=data.sessions.filter(s=>ds.includes(s.date)),care=data.care.filter(c=>c.done&&ds.includes(c.completedAt||c.date)),goals=data.goals.flatMap(g=>g.milestones||[]),hc=data.habits.reduce((n,h)=>n+h.dates.filter(d=>ds.includes(d)).length,0),next=data.tasks.filter(t=>!t.done&&(!t.date||t.date<=today())).sort((a,b)=>(a.energy===day().energy?-1:1)-(b.energy===day().energy?-1:1))[0];return `<div class="hero"><div><span class="tag">YOUR DAY, A LITTLE LIGHTER</span><h1>A fresh start${data.settings.name?', '+esc(data.settings.name):''}.</h1><p>${done} of ${ts.length} tasks complete today. A small step is still a step.</p><div class="row"><button class="primary" onclick="edit('tasks')">＋ Add a task</button><button onclick="edit('brain')">Capture a thought</button></div></div><div class="energy-panel"><div class="between"><h3>Your energy today</h3><span class="smalltext">Set your pace</span></div><div class="row">${[['Low','☾','Keep it light'],['Steady','☀','Find a rhythm'],['High','✧','Ready to go']].map(([v,i,n])=>`<button class="${day().energy===v?'active':''}" onclick="setDay('energy','${v}');render()"><span>${i}</span><b>${v}</b><small style="display:block;margin-top:4px">${n}</small></button>`).join('')}</div></div></div><div class="stats">${stat('Today’s tasks',ts.length,'Your plans, at your pace','☷')}${stat('Completed today',done,`${pct(done,ts.length)}% of today’s list`,'✓')}${stat('Still to do',ts.length-done,'One thing at a time','◷')}</div><div class="quick"><button onclick="go('Calendar')">▦ View calendar</button><button onclick="go('Home Reset')">⌂ Reset a room</button><button onclick="go('Focus')">◷ Start focus</button><button onclick="go('Self-Care')">♡ Make space for you</button><button onclick="calm()">◌ ${document.body.classList.contains('calm')?'Exit calm view':'Calm view'}</button></div><div class="triple"><section class="card pink"><h3>Weekly momentum</h3><span class="smalltext muted">Tasks completed · last seven days</span><div class="metric">${counts.reduce((a,b)=>a+b,0)} <small style="font:12px system-ui">small wins</small></div><div class="bars" aria-label="Daily task completions">${counts.map((n,i)=>`<div class="barcol"><span>${n}</span><div class="bar" style="height:${Math.max(3,n/Math.max(1,...counts)*65)}px"></div>${new Date(ds[i]+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})}</div>`).join('')}</div></section><section class="card lav"><h3>Focus rhythm</h3><span class="smalltext muted">Completed sessions · last seven days</span><div class="metric">${focus.reduce((a,s)=>a+s.minutes,0)} <small style="font:12px system-ui">minutes</small></div><div class="ring" style="--p:${pct(new Set(focus.map(s=>s.date)).size,7)}"><span>${new Set(focus.map(s=>s.date)).size}/7</span></div><div class="center smalltext muted">Days with a little focus</div></section><section class="card mint"><h3>Time for yourself</h3><span class="smalltext muted">Completed self-care · last seven days</span><div class="metric">${care.reduce((a,c)=>a+Number(c.minutes||0),0)} <small style="font:12px system-ui">minutes</small></div><p>${care.length} restorative activities complete.</p><button onclick="go('Self-Care')">Plan a gentle pause →</button></section></div><div class="grid" style="margin-bottom:20px"><section class="card"><div class="between"><h3>Habit consistency</h3><b>${pct(hc,data.habits.length*7)}%</b></div><progress value="${hc}" max="${data.habits.length*7||1}"></progress><small class="muted">${hc} of ${data.habits.length*7} daily check-ins over seven days</small></section><section class="card peach"><div class="between"><h3>Goal progress</h3><b>${pct(goals.filter(m=>m.done).length,goals.length)}%</b></div><progress value="${goals.filter(m=>m.done).length}" max="${goals.length||1}"></progress><small class="muted">${goals.filter(m=>m.done).length} of ${goals.length} milestones complete</small></section></div><div class="grid"><section class="card lav"><span class="tag">ONE SMALL THING</span><h2 style="margin-top:12px">${next?esc(next.title):'Make a little room to begin.'}</h2><p>${next?esc(next.steps||'Start with the smallest version of this task.'):'Add a task and we’ll bring a manageable next step here.'}</p>${next?`<button class="primary" onclick="toggleTask('${next.id}')">✓ Mark complete</button>`:'<button class="primary" onclick="edit(\'tasks\')">Add my first task</button>'}</section><section class="card"><div class="between"><h2>Today’s list</h2><button class="icon" onclick="go('Tasks')">All tasks →</button></div>${ts.map(taskRow).join('')||empty('Your day is a blank page. Add just one thing to start.')}</section><section class="card"><h2>Coming up</h2>${[...data.events.filter(e=>e.date>=today()).map(e=>({...e,kind:'Event'})),...data.admin.filter(e=>!e.done&&e.date>=today()).map(e=>({...e,kind:'Admin'})),...data.bills.filter(e=>!e.paid&&e.date>=today()).map(e=>({...e,kind:'Bill'}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(e=>`<div class="item"><div class="grow">${esc(e.title)}<small>${esc(e.date)} · ${e.kind}</small></div></div>`).join('')||empty('Upcoming events, bills and admin deadlines will appear here.')}</section><section class="card pink"><h2>A little intention</h2><label>What would feel good today?<textarea oninput="setDay('win',this.value)" placeholder="A quiet coffee. A short walk. One less open tab.">${esc(day().win)}</textarea></label></section></div>`};
// Reusable edit dialog: all entered values escaped; IDs never enter free-form handlers.

};let editing=null;
function edit(k,id){const x=id?data[k].find(x=>x.id===id):{},def=defs[k];editing={k,id};let vals={...x};if(k==='goals')vals.milestoneText=(x.milestones||[]).map(m=>m.title).join('\n');if(k==='routines')vals.stepText=(x.steps||[]).join('\n');$('#editorTitle').textContent=(id?'Edit ':'Add ')+def.label.toLowerCase();$('#editorFields').innerHTML=def.fields.map(([n,l,t])=>{let v=vals[n]??(n==='date'?selectedDate:n==='minutes'?10:'');let req=n==='title'||n==='amount'||n==='target'||n==='stepText'||n==='milestoneText'||n==='date'&&['events','bills','admin','care','meals','money'].includes(k);return `<label class="${t==='textarea'?'wide':''}">${l}${Array.isArray(t)?`<select name="${n}">${t.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${n}" ${req?'required':''}>${esc(v)}</textarea>`:`<input name="${n}" type="${t}" value="${esc(v)}" ${req?'required':''} ${t==='number'?'min="0" max="100000000" step="0.01"':''} maxlength="500">`}</label>`}).join('');$('#editor').showModal()}
function commit(e){e.preventDefault();let {k,id}=editing,vals=Object.fromEntries(new FormData(e.target)),old=id?data[k].find(x=>x.id===id):null;if(!vals.title.trim())return;for(let n of ['minutes','amount','target','saved','servings'])if(n in vals){vals[n]=Number(vals[n])||0;if(vals[n]<0||!Number.isFinite(vals[n]))return;}if(k==='events'&&vals.time&&vals.end&&vals.end<=vals.time){toast('End time must be after start time.');return}let x={...(old||{}),...vals,id:id||uid()};if(k==='goals'){x.milestones=vals.milestoneText.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({title:s,done:(old?.milestones||[]).find(m=>m.title===s)?.done||false}));delete x.milestoneText}if(k==='routines'){x.steps=vals.stepText.split('\n').map(s=>s.trim()).filter(Boolean);x.checks={};if(old)for(const [d,indices] of Object.entries(old.checks||{}))x.checks[d]=indices.map(i=>x.steps.indexOf(old.steps[i])).filter(i=>i>=0);delete x.stepText}if(k==='habits'){x.dates=old?.dates||[];x.createdAt=old?.createdAt||today()}if(k==='projects'&&old&&old.title!==x.title)data.tasks.forEach(t=>{if(t.project===old.title)t.project=x.title});if(k==='bills'&&old?.paid&&old.transactionId){let linked=data.money.find(m=>m.id===old.transactionId);if(linked)Object.assign(linked,{title:x.title,amount:x.amount,category:x.category})}if(id)data[k]=data[k].map(y=>y.id===id?x:y);else data[k].push(x);save();$('#editor').close();render();toast('Saved to your planner.')}
function actions(k,x,extra=''){return `<div class="actions">${extra}<button onclick="edit('${k}','${x.id}')">Edit</button><button onclick="del('${k}','${x.id}')">Delete</button></div>`}
function plus(k,label){return `<button class="primary" onclick="edit('${k}')">＋ ${label||'Add '+defs[k].label.toLowerCase()}</button>`}
function repeatDate(d,repeat){if(repeat==='Daily')return dateAdd(d,1);if(repeat==='Weekly')return dateAdd(d,7);let v=new Date(d+'T12:00:00'),dayNum=v.getDate();v.setDate(1);if(repeat==='Monthly')v.setMonth(v.getMonth()+1);else v.setFullYear(v.getFullYear()+1);let max=new Date(v.getFullYear(),v.getMonth()+1,0).getDate();v.setDate(Math.min(dayNum,max));return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`}
function finish(k,id,key='done'){let x=data[k].find(x=>x.id===id);x[key]=!x[key];x.completedAt=x[key]?today():null;if(x[key]&&x.repeat&&x.repeat!=='None'&&!x.nextCreated){data[k].push({...x,id:uid(),date:repeatDate(x.date||today(),x.repeat),[key]:false,completedAt:null,nextCreated:false,transactionId:null});x.nextCreated=true}save();render()}
toggleTask=id=>finish('tasks',id);editTask=id=>edit('tasks',id);editNote=id=>edit('notes',id);
taskRow=t=>`<div class="item"><input type="checkbox" aria-label="Complete ${esc(t.title)}" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div class="grow ${t.done?'done':''}"><strong>${esc(t.title)}</strong><small>${esc(t.date||'Anytime')} · ${esc(t.priority||'Normal')} · ${esc(t.energy||'Low')} energy ${t.minutes?'· '+t.minutes+'m':''}</small>${t.steps?`<small style="white-space:pre-line">${esc(t.steps)}</small>`:''}${t.repeat&&t.repeat!=='None'?`<span class="pill">↻ ${esc(t.repeat)}</span>`:''}</div><button class="icon" aria-label="Edit task" onclick="edit('tasks','${t.id}')">✎</button>${removeBtn('tasks',t.id)}</div>`;

views['Brain Dump']=()=>head('Let your mind exhale.','Capture it now. Organize it later. Turn a thought into a task whenever you are ready.')+`<div class="modulebar">${plus('brain')}<button onclick="go('Notes')">Open notes</button></div><label>Search thoughts<input value="${esc(brainSearch)}" onchange="brainSearch=this.value;render()" placeholder="Search ideas and notes"></label><div class="collection">${data.brain.filter(x=>(x.title+' '+x.body).toLowerCase().includes(brainSearch.toLowerCase())).map(x=>`<section class="card lav"><span class="pill">${esc(x.tag)}</span><h2 style="margin-top:12px">${esc(x.title)}</h2><p>${esc(x.body)}</p>${actions('brain',x,`<button class="primary" onclick="toTask('${x.id}')">${x.taskId?'Open linked task':'Turn into task →'}</button>`)}</section>`).join('')||empty('Your mind doesn’t have to hold everything. Capture a thought.')}</div>`;
function toTask(id){let x=data.brain.find(x=>x.id===id);if(x.taskId&&data.tasks.some(t=>t.id===x.taskId)){edit('tasks',x.taskId);return}x.taskId=uid();data.tasks.push({id:x.taskId,title:x.title,steps:x.body,date:today(),priority:'Normal',energy:'Low',done:false,repeat:'None'});save();render();toast('Added to today’s tasks.')}
function shiftMonth(n){let d=new Date(calMonth+'-01T12:00:00');d.setMonth(d.getMonth()+n);calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;render()}
views.Calendar=()=>{let start=new Date(calMonth+'-01T12:00:00'),offset=(start.getDay()+6)%7,count=new Date(start.getFullYear(),start.getMonth()+1,0).getDate();return head('See the shape of your month.','Events, tasks and deadlines together. Scroll the calendar sideways on a small phone.')+`<div class="modulebar"><button onclick="shiftMonth(-1)">←</button><b style="padding:10px">${start.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button onclick="shiftMonth(1)">→</button><button onclick="calMonth=today().slice(0,7);selectedDate=today();render()">Today</button>${plus('events')}<button onclick="window.print()">Print</button></div><section class="card calendar-wrap"><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dow">${x}</div>`).join('')}${'<div class="cell blank"></div>'.repeat(offset)}${Array.from({length:count},(_,i)=>{let d=calMonth+'-'+String(i+1).padStart(2,'0'),all=[...data.events.filter(x=>x.date===d).map(x=>({...x,kind:'events'})),...data.tasks.filter(x=>x.date===d).map(x=>({...x,kind:'tasks'})),...data.bills.filter(x=>x.date===d&&!x.paid).map(x=>({...x,kind:'bills'})),...data.admin.filter(x=>x.date===d&&!x.done).map(x=>({...x,kind:'admin'}))];return `<div class="cell ${d===today()?'today':''}"><b>${i+1}</b><button aria-label="Add event on ${d}" onclick="selectedDate='${d}';edit('events')">＋</button>${all.map(x=>`<button class="${x.done?'done':''}" onclick="edit('${x.kind}','${x.id}')">${esc(x.time||'')} ${esc(x.title)}</button>`).join('')}</div>`}).join('')}</div></section><section class="card" style="margin-top:18px"><h2>Events this month</h2>${data.events.filter(e=>e.date.startsWith(calMonth)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(e=>`<div class="item"><div class="grow"><b>${esc(e.title)}</b><small>${e.date} · ${esc(e.time||'All day')} ${e.end?'– '+esc(e.end):''} · ${esc(e.category)}</small><small>${esc(e.body)}</small></div><button onclick="edit('events','${e.id}')">Edit</button>${removeBtn('events',e.id)}</div>`).join('')||empty('No events planned this month.')}</section>`};
views.Goals=()=>head('Give your dreams a next step.','Set a target and turn it into milestones you can check off.')+`<div class="modulebar">${plus('goals')}</div><div class="collection">${data.goals.map(g=>{let ms=g.milestones||[],n=ms.filter(m=>m.done).length;return `<section class="card lav"><h2>${esc(g.title)}</h2><p>${esc(g.body)}</p><small>Target: ${esc(g.date||'At your own pace')}</small><div class="progressline"><span>${n}/${ms.length} milestones</span><b>${pct(n,ms.length)}%</b></div><progress value="${n}" max="${ms.length||1}"></progress><div class="checklist">${ms.map((m,i)=>`<label><input type="checkbox" ${m.done?'checked':''} onchange="milestone('${g.id}',${i})"><span class="${m.done?'done':''}">${esc(m.title)}</span></label>`).join('')}</div>${actions('goals',g)}</section>`}).join('')||empty('Make room for something you care about. Add a goal.')}</div>`;function milestone(id,i){let g=data.goals.find(g=>g.id===id);g.milestones[i].done=!g.milestones[i].done;save();render()}
const oldProjects=views.Projects;views.Projects=()=>head('Keep your projects moving.','Connect tasks by using the same project name in their Project / area field.')+`<div class="modulebar">${plus('projects')}</div><div class="collection">${data.projects.map(p=>{let ts=data.tasks.filter(t=>t.project===p.title),n=ts.filter(t=>t.done).length;return `<section class="card"><h2>${esc(p.title)}</h2><p>${esc(p.outcome)}</p><small>${esc(p.date||'No target date')}</small><div class="progressline"><span>${n}/${ts.length} linked tasks</span><b>${pct(n,ts.length)}%</b></div><progress value="${n}" max="${ts.length||1}"></progress>${ts.map(taskRow).join('')}${actions('projects',p,`<button onclick="projectTask('${p.id}')">＋ Linked task</button>`)}</section>`}).join('')||empty('Start a project and add its first small task.')}</div>`;function projectTask(id){edit('tasks');$('#editorFields [name=project]').value=data.projects.find(p=>p.id===id).title}
views['Mood & Energy']=views['Self-care'];views['Self-Care']=()=>head('Make a little space for you.','Plan restorative activities and record the time you actually take for yourself.')+`<div class="modulebar">${plus('care')}<button onclick="go('Mood & Energy')">Mood & energy check-in</button></div><div class="collection">${data.care.map(c=>`<section class="card ${c.done?'mint':'pink'}"><span class="pill">${esc(c.category)} · ${c.minutes||0} minutes</span><h2 style="margin-top:15px">${esc(c.title)}</h2><p>${esc(c.body)}</p><small>${esc(c.date)} ${c.done?'· Completed '+esc(c.completedAt||c.date):''}</small>${actions('care',c,`<button class="primary" onclick="finish('care','${c.id}')">${c.done?'Undo':'✓ I made time'}</button>`)}</section>`).join('')||empty('What restores you? Add a walk, a rest, or time with someone you love.')}</div>`;

const oldBudget=views.Budget;views.Budget=()=>{let rows=data.money.filter(m=>m.date.startsWith(month)),inc=rows.filter(x=>x.type==='Income').reduce((n,x)=>n+x.amount,0),exp=rows.filter(x=>x.type==='Expense').reduce((n,x)=>n+x.amount,0),bills=data.bills.filter(x=>x.date.startsWith(month));return head('A clearer picture of your money.','Transactions, bills, a monthly spending target and savings goals. All entered manually.')+`<div class="row">${field('month','Month','month',month,'onchange="month=this.value;render()"')}<button onclick="exportCSV()">↓ Export CSV</button></div><div class="stats">${stat('Income',money(inc),'Recorded this month','↗')}${stat('Spending',money(exp),'Recorded this month','↘')}${stat('Net balance',money(inc-exp),'Income minus expenses','◈')}</div><div class="modulebar">${['Transactions','Bills','Savings','Overview'].map(t=>`<button class="${budgetTab===t?'active':''}" onclick="budgetTab='${t}';render()">${t}</button>`).join('')}</div>${budgetTab==='Transactions'?`<section class="card"><div class="between"><h2>Transactions</h2>${plus('money')}</div>${rows.map(x=>`<div class="item"><div class="grow"><b>${esc(x.title)}</b><small>${x.date} · ${esc(x.category)}</small></div><b>${x.type==='Expense'?'−':'+'}${money(x.amount)}</b><button class="icon" onclick="edit('money','${x.id}')">✎</button>${removeBtn('money',x.id)}</div>`).join('')||empty('Add your first income or expense.')}</section>`:budgetTab==='Bills'?`<div class="modulebar">${plus('bills')}</div><div class="collection">${bills.map(b=>`<section class="card ${b.paid?'mint':'peach'}"><h2>${esc(b.title)}</h2><div class="metric">${money(b.amount)}</div><small>${b.date} · ${esc(b.repeat)} · ${b.paid?'Paid':b.date<today()?'Overdue':'Upcoming'}</small><p>${esc(b.body)}</p>${actions('bills',b,`<button class="primary" onclick="payBill('${b.id}')">${b.paid?'Undo paid':'Mark paid + log expense'}</button>`)}</section>`).join('')||empty('No bills in this month.')}</div>`:budgetTab==='Savings'?`<div class="modulebar">${plus('savings')}</div><div class="collection">${data.savings.map(s=>`<section class="card mint"><h2>${esc(s.title)}</h2><div class="metric">${money(s.saved)}</div><small>of ${money(s.target)} · ${esc(s.date||'No deadline')}</small><progress value="${Math.min(s.saved,s.target)}" max="${s.target||1}"></progress>${actions('savings',s)}</section>`).join('')||empty('Create a savings goal and update its saved balance as you go.')}</div><p class="notice">Savings balances are manually tracked and do not automatically move money or create transactions.</p>`:`<div class="grid"><section class="card lav"><h2>Monthly spending target</h2><label>Limit (${data.settings.currency})<input type="number" min="0" step="0.01" value="${data.budget}" onchange="data.budget=Math.max(0,Number(this.value)||0);save();render()"></label><div class="metric">${money(data.budget-exp)}</div><small>${data.budget-exp<0?'Over your target':'Remaining against your target'}</small><progress value="${Math.min(exp,data.budget)}" max="${data.budget||1}"></progress></section><section class="card"><h2>Spending by category</h2>${Object.entries(rows.filter(x=>x.type==='Expense').reduce((o,x)=>(o[x.category]=(o[x.category]||0)+x.amount,o),{})).map(([c,n])=>`<div class="progressline"><span>${esc(c)}</span><b>${money(n)}</b></div><progress value="${n}" max="${exp||1}"></progress>`).join('')||empty('Your recorded expenses will appear here.')}</section></div>`}`};
function payBill(id){let b=data.bills.find(b=>b.id===id);if(b.paid){if(b.transactionId)data.money=data.money.filter(m=>m.id!==b.transactionId);b.transactionId=null;finish('bills',id,'paid')}else{let tid=uid();data.money.push({id:tid,title:b.title,amount:b.amount,type:'Expense',date:today(),category:b.category});b.transactionId=tid;finish('bills',id,'paid')}}
let mealTab='Meal plan';views['Meals & lists']=()=>head('Meals made a little easier.','Save your recipes, build a meal plan and send ingredients to your shopping list.')+`<div class="modulebar">${['Meal plan','Recipes','Shopping'].map(t=>`<button class="${mealTab===t?'active':''}" onclick="mealTab='${t}';render()">${t}</button>`).join('')}</div>${mealTab==='Meal plan'?`<div class="modulebar">${plus('meals')}</div><div class="collection">${[...data.meals].sort((a,b)=>a.date.localeCompare(b.date)).map(m=>`<section class="card peach"><span class="pill">${m.date} · ${esc(m.slot)}</span><h2 style="margin-top:14px">${esc(m.title)}</h2>${actions('meals',m)}</section>`).join('')||empty('Plan something simple and nourishing.')}</div>`:mealTab==='Recipes'?`<div class="modulebar">${plus('recipes')}</div><div class="collection">${data.recipes.map(r=>`<section class="card"><h2>${esc(r.title)}</h2><small>${r.minutes||0} minutes · ${r.servings||1} servings</small><h3 style="margin-top:15px">Ingredients</h3><p>${esc(r.ingredients)}</p><h3>Method</h3><p>${esc(r.body)}</p>${actions('recipes',r,`<button onclick="ingredients('${r.id}')">＋ To groceries</button><button onclick="planRecipe('${r.id}')">Plan this meal</button>`)}</section>`).join('')||empty('Keep a reliable recipe close by.')}</div>`:`<section class="card"><form class="row" onsubmit="addSimple(event,'shopping')"><label style="flex:1">Item and quantity<input name="title" required placeholder="Milk — 1 litre"></label><button class="primary">＋ Add</button></form>${data.shopping.map(s=>`<div class="item"><input type="checkbox" aria-label="Bought ${esc(s.title)}" ${s.done?'checked':''} onchange="shopping('${s.id}')"><span class="grow ${s.done?'done':''}">${esc(s.title)}</span>${removeBtn('shopping',s.id)}</div>`).join('')||empty('Your shopping list is clear.')}<button style="margin-top:15px" onclick="window.print()">Print shopping list</button></section>`}`;
function ingredients(id){let r=data.recipes.find(r=>r.id===id),n=0;r.ingredients.split('\n').map(x=>x.trim()).filter(Boolean).forEach(title=>{if(!data.shopping.some(s=>s.title.toLowerCase()===title.toLowerCase()&&!s.done)){data.shopping.push({id:uid(),title,done:false});n++}});save();toast(n+' items added to groceries.')}
function planRecipe(id){edit('meals');$('#editorFields [name=title]').value=data.recipes.find(r=>r.id===id).title}
const oldHabits=views.Habits;views.Habits=()=>oldHabits().replace('<section class="card">',`<div class="modulebar">${plus('habits')}</div><section class="card">`);
views.Routines=()=>head('A rhythm that fits your life.','Morning, midday, evening. Checklists refresh with each new date.')+`<div class="modulebar">${plus('routines')}</div><div class="collection">${data.routines.map(r=>{let checked=r.checks[today()]||[];return `<section class="card lav"><span class="pill">${esc(r.period||'Anytime')}</span><h2 style="margin-top:12px">${esc(r.title)}</h2><div class="progressline"><span>${checked.length}/${r.steps.length} steps today</span><b>${pct(checked.length,r.steps.length)}%</b></div><progress value="${checked.length}" max="${r.steps.length||1}"></progress><div class="checklist">${r.steps.map((s,i)=>`<label><input type="checkbox" ${checked.includes(i)?'checked':''} onchange="routine('${r.id}',${i})"><span>${esc(s)}</span></label>`).join('')}</div>${actions('routines',r)}</section>`}).join('')||empty('Create a short routine. Two or three steps is a lovely start.')}</div>`;
const oldSettings=views.Settings;views.Settings=()=>oldSettings().replace('Sage & cream','Pastel sage').replace('Soft rose','Blush & lavender').replace('Quiet blue','Pastel blue').replace('<h2>Your preferences</h2>','<h2>Your preferences</h2><button type="button" onclick="data.settings.dark=!data.settings.dark;save();render()">☾ Toggle light / dark</button>').replace('</section></div>','<h3>Pastel Studio v2</h3><p>Recurring tasks and home resets create the next dated item when completed. Bills and admin reminders do the same when marked paid or complete. These are in-app reminders; there are no push notifications.</p></section></div>');
// Strict backup shape checks, including nested lists and handler IDs.
const baseValid=valid;valid=function(x){if(!baseValid(x))return false;let idok=v=>v&&typeof v==='object'&&/^[a-zA-Z0-9_-]+$/.test(v.id),str=(v,k)=>typeof v[k]==='string',date=v=>typeof v==='string'&&(!v||/^\d{4}-\d{2}-\d{2}$/.test(v)),num=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0;for(let k of ['tasks','habits','routines','projects','notes','money','meals','shopping','sessions',...extras]){if(x[k]===undefined&&extras.includes(k))continue;if(!Array.isArray(x[k])||!x[k].every(idok))return false;if(k!=='sessions'&&!x[k].every(v=>str(v,'title')))return false;}if(!x.tasks.every(t=>date(t.date)&&(!t.steps||typeof t.steps==='string'))||!x.money.every(m=>date(m.date)&&str(m,'category'))||!x.sessions.every(s=>date(s.date)&&num(s.minutes))||!x.meals.every(m=>date(m.date)))return false;for(let k of ['events','bills','admin','care'])if(x[k]&&!x[k].every(v=>date(v.date)))return false;if(x.goals&&!x.goals.every(g=>Array.isArray(g.milestones)&&g.milestones.every(m=>m&&typeof m.title==='string'&&typeof m.done==='boolean')))return false;if(x.recipes&&!x.recipes.every(r=>str(r,'ingredients')&&str(r,'body')))return false;if(x.bills&&!x.bills.every(b=>num(b.amount)))return false;if(x.savings&&!x.savings.every(s=>num(s.target)&&num(s.saved)))return false;for(const k of ['tasks','home','care','recipes'])if(x[k]&&!x[k].every(v=>v.minutes===undefined||v.minutes===''||num(v.minutes)))return false;if(!x.habits.every(h=>h.dates.every(date))||!x.routines.every(r=>Object.values(r.checks).every(a=>Array.isArray(a)&&a.every(i=>Number.isInteger(i)&&i>=0&&i<r.steps.length))))return false;return Object.values(x.days).every(d=>d&&typeof d==='object'&&(d.water===undefined||num(d.water)))};
$('#restoreFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;if(f.size>5000000)throw Error('Backup is too large.');let x=JSON.parse(await f.text());if(!valid(x))throw Error('Not a valid Softly backup.');if(!confirm('Replace all current planner data with this backup?'))return;data=upgrade(x);save();render();toast('Backup restored.')}catch(err){toast('Restore failed: '+err.message)}finally{e.target.value=''}};
// Keep dates fresh across midnight and on returning to an inactive tab.
let observedDate=today();setInterval(()=>{if(today()!==observedDate){observedDate=today();selectedDate=today();render()}},30000);
render();

</script><style id="demo-readonly-style">
#demoReadOnlyNotice{position:sticky;top:0;z-index:999999;background:#203f35;color:#fff;text-align:center;padding:10px 14px;font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.2px;box-shadow:0 2px 10px #0002}
#demoReadOnlyNotice span{opacity:.85;font-weight:400}
input[readonly],textarea[readonly],select:disabled{opacity:.72!important;cursor:not-allowed!important}
.demo-action-blocked{opacity:.55!important;cursor:not-allowed!important}
</style>
<script id="demo-readonly-guard">
(()=> {
 const lock=()=>{
  document.querySelectorAll('input:not([type="checkbox"]):not([type="radio"]):not([type="button"]):not([type="submit"]),textarea').forEach(el=>{el.readOnly=true;el.setAttribute('aria-readonly','true')});
  document.querySelectorAll('input[type="checkbox"],input[type="radio"]').forEach(el=>{el.disabled=true;el.setAttribute('aria-disabled','true')});
  document.querySelectorAll('[contenteditable="true"],[contenteditable=""]').forEach(el=>{el.contentEditable='false'});
  document.querySelectorAll('button').forEach(el=>{el.disabled=false;el.classList.remove('demo-action-blocked');el.removeAttribute('aria-disabled')});
  document.querySelectorAll('a[download]').forEach(el=>{el.removeAttribute('download');el.setAttribute('aria-disabled','true')});
 };
 const addNotice=()=>{
  if(document.getElementById('demoReadOnlyNotice'))return;
  const n=document.createElement('div');n.id='demoReadOnlyNotice';
  n.innerHTML='INTERACTIVE PREVIEW <span>— click through every section, tab and viewing control; typing and saving are disabled</span>';
  document.body.insertBefore(n,document.body.firstChild);
 };
 const start=()=>{
  addNotice();lock();
  new MutationObserver(()=>lock()).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['disabled','contenteditable','readonly']});
 };
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
 document.addEventListener('submit',e=>{e.preventDefault();e.stopImmediatePropagation()},true);
 document.addEventListener('beforeinput',e=>{
  if(e.target.matches('input:not([type="button"]):not([type="submit"]),textarea,[contenteditable="true"]')){e.preventDefault();e.stopImmediatePropagation()}
 },true);
})();
</script></body></html>
